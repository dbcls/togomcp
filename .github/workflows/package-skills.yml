name: Package skills

# Bundles the DISTRIBUTABLE skills under togo_mcp/data/skills/public/<name>/ into
# their own <name>.skill zip archives, uploaded as a SEPARATE artifact per skill,
# and attached to the GitHub Release of every version tag (v*) — so
# https://github.com/dbcls/togomcp/releases/latest always carries the current set
# (the tutorial links there) — and of skills-v* tags (a skills-only release).
#
# public/ holds the portable, MCP-driven analysis skills — the set the server
# serves via get_workflow, skill:// resources and skills/list — plus the entry
# skill togomcp-start. It IS packaged: uploaded into Claude Desktop, its
# description reaches the model from the first turn, before any TogoMCP tool is
# loaded (server instructions arrive only after that). Repo-bound dev /
# maintenance skills (mie-generator, qa-generator, intro-page-updater) live only in
# .claude/skills/ and so are never packaged. (.claude/skills/<public name> are
# symlinks into public/.)
#
# NOTE: `.skill` is NOT an official Claude Code format — it is a local packaging
# convention here. To install one, unzip it into a skills directory, e.g.
#   unzip prism.skill -d .claude/skills/

on:
  push:
    tags: ['v*', 'skills-v*']   # every release tag; skills-v* for a skills-only release
  workflow_dispatch:         # manual run; publishes only with --ref <tag> (see `release`)

permissions:
  contents: write            # needed to attach assets to a Release on tag runs

jobs:
  # Discover the skill directories so the package job can fan out one job per skill.
  discover:
    runs-on: ubuntu-latest
    outputs:
      skills: ${{ steps.list.outputs.skills }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        name: List packageable skills as a JSON array
        run: |
          set -euo pipefail
          skills="$(ls -d togo_mcp/data/skills/public/*/ | xargs -n1 basename \
                    | jq -R . | jq -cs .)"
          echo "Packaging skills: $skills"
          echo "skills=$skills" >> "$GITHUB_OUTPUT"

  # One job per skill -> one independent .skill archive + one artifact each.
  package:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJson(needs.discover.outputs.skills) }}
    steps:
      - uses: actions/checkout@v7

      - name: Build ${{ matrix.skill }}.skill
        env:
          SKILL: ${{ matrix.skill }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ( cd togo_mcp/data/skills/public && \
            zip -r "../../../../dist/${SKILL}.skill" "$SKILL" \
                -x '*/worktrees/*' '*/.DS_Store' '*/__pycache__/*' )
          ls -la "dist/${SKILL}.skill"

      - name: Upload ${{ matrix.skill }}.skill as its own artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.skill }}.skill
          path: dist/${{ matrix.skill }}.skill
          if-no-files-found: error

  # Attach every archive in ONE job. On a v* tag no release exists beforehand, and
  # one action-gh-release call per matrix job would race to create it (duplicate
  # releases). If a release for the tag already exists, the action uploads into
  # it — check that it is not a draft, or the assets will not show publicly.
  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: '*.skill'
          path: dist
          merge-multiple: true

      - run: ls -la dist

      - name: Attach the .skill archives to the ${{ github.ref_name }} Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.skill
          fail_on_unmatched_files: true
          # The action REPLACES an existing release's body with `body` unless
          # append_body is set; append so hand-written notes survive. (A re-run on
          # the same tag appends this text again — harmless.)
          append_body: true
          body: |
            Agent Skill archives for TogoMCP ${{ github.ref_name }}. Each `.skill` file is a zip of one skill directory.
            Claude Desktop users: upload `togomcp-start.skill` as a skill (see the tutorial, chapter 5).
            Release notes: [CHANGELOG.md](https://github.com/dbcls/togomcp/blob/main/CHANGELOG.md).
