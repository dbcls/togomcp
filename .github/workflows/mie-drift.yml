name: MIE drift

# The two MIE checkers execute the file against the LIVE endpoint:
#   scripts/check_mie_examples.py  — every `examples[].sparql` a reader would copy
#   scripts/check_mie_gotchas.py   — every falsifiable `global_gotchas`/`traps_avoided`
#                                    claim that carries a `check:` (MIE_v3_spec.md §3.6)
# Until 2026-08-26 neither was wired to CI, so both ran only when someone remembered.
# The 2026-08-25 sweep is what that cost: a header cross-check of four files found a
# factual defect in all four, including six "this times out" warnings over operations
# that finish in 0.2-41s. Nothing in the repo could have noticed.
#
# Two jobs, because the constraint is different in each direction:
#
#   pr        — runs ONLY the MIE files the PR touched. Cheap and precise: you get the
#               verdict on your own change, and an unrelated upstream release cannot
#               redden your PR.
#   scheduled — runs the whole corpus weekly and opens/updates ONE issue. Drift here is
#               almost always the DATA moving, not the diff moving, so it does not
#               belong on anybody's PR; it belongs on a list someone works through.
#
# Neither job fails on a network problem. Both scripts already separate infrastructure
# failure (gateway 5xx, dead socket) from a real defect and report it as `net-fail`,
# which never counts toward the exit code — an endpoint being down must not read as a
# claim being wrong, or the signal is worthless within a month.

on:
  pull_request:
    paths:
      - "togo_mcp/data/mie/**"
      - "scripts/check_mie_examples.py"
      - "scripts/check_mie_gotchas.py"
  schedule:
    # Mondays 06:17 UTC. Off the hour on purpose — GitHub's scheduler queues heavily
    # at :00 and these jobs are already slow (a full corpus run is minutes of live SPARQL).
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changed-files:
    name: Check the MIE files this PR touches
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the one dependency the checkers need
        run: pip install "pyyaml>=6.0"

      - name: Collect the database names this PR changed
        id: dbs
        run: |
          set -euo pipefail
          # Deleted files are excluded (--diff-filter=d): a removed MIE has nothing to check.
          mapfile -t changed < <(
            git diff --name-only --diff-filter=d \
              "origin/${{ github.base_ref }}...HEAD" -- 'togo_mcp/data/mie/*.yaml' || true)
          dbs=()
          for f in "${changed[@]:-}"; do
            [ -n "$f" ] || continue
            b="$(basename "$f" .yaml)"
            dbs+=("$b")
          done
          if [ "${#dbs[@]}" -eq 0 ]; then
            echo "list=" >> "$GITHUB_OUTPUT"
            echo "No MIE file changed — only a checker script did. Nothing DB-specific to run."
          else
            echo "list=${dbs[*]}" >> "$GITHUB_OUTPUT"
            echo "Will check: ${dbs[*]}"
          fi

      - name: Examples must execute and return rows
        if: steps.dbs.outputs.list != ''
        run: python scripts/check_mie_examples.py ${{ steps.dbs.outputs.list }}

      - name: Falsifiable claims must still hold
        if: steps.dbs.outputs.list != ''
        run: python scripts/check_mie_gotchas.py ${{ steps.dbs.outputs.list }}

  weekly-corpus:
    name: Whole-corpus drift sweep
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write            # to file/update the drift issue
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the one dependency the checkers need
        run: pip install "pyyaml>=6.0"

      - name: Run both checkers over every MIE
        id: sweep
        run: |
          set -uo pipefail            # NOT -e: a non-zero exit is the finding, not an abort
          {
            echo "## Example queries"
            echo '```'
            python scripts/check_mie_examples.py 2>&1 | tail -60
            echo '```'
            echo "## Falsifiable claims"
            echo '```'
            python scripts/check_mie_gotchas.py --all 2>&1 | tail -80
            echo '```'
          } > report.md
          # Re-run for the exit codes alone; the reports above already hold the detail.
          python scripts/check_mie_examples.py >/dev/null 2>&1 && ex=0 || ex=$?
          python scripts/check_mie_gotchas.py --all >/dev/null 2>&1 && gx=0 || gx=$?
          echo "drift=$(( ex + gx ))" >> "$GITHUB_OUTPUT"

      - name: Open or update the drift issue
        if: steps.sweep.outputs.drift != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = [
              'The weekly sweep found MIE content that the live endpoints no longer agree with.',
              '',
              'This is usually the DATA moving (an upstream release shifted a count), not a bad commit —',
              'so the fix is to re-measure, then update the prose AND the `check:` `expect`/`date`',
              'together. A `check:` that is quietly widened to pass is worse than a failing one.',
              '',
              '`net-fail` lines are the endpoint being unreachable and are NOT drift; if the whole',
              'report is net-fail, re-run the workflow rather than editing anything.',
              '',
              fs.readFileSync('report.md', 'utf8'),
              '',
              `<sub>Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}</sub>`,
            ].join('\n');
            const title = 'MIE drift: live endpoints disagree with the shipped files';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'mie-drift',
            });
            if (existing.data.length) {
              // Update in place rather than filing a new issue every Monday — an
              // unattended weekly job that opens issues is how a repo grows 40 of them.
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: 'Still drifting as of this run; the issue body above has the current report.',
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['mie-drift'],
              });
            }

      - name: Report
        run: |
          if [ "${{ steps.sweep.outputs.drift }}" = "0" ]; then
            echo "No drift: every example returned rows and every check: still holds."
          else
            echo "::warning::MIE drift detected — see the mie-drift issue."
          fi
          cat report.md >> "$GITHUB_STEP_SUMMARY"
