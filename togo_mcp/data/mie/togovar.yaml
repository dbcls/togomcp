# MIE v3 — TogoVar (Japanese/human genome variation). Format: togo_mcp/data/docs/MIE_v3_spec.md.
# RE-AUTHORED 2026-10-09 against the restructured endpoint: between 2026-07-22 and 2026-10-05 TogoVar
# renamed its vocabulary namespace, folded the ClinVar annotation graph into the core graph, and grew
# the SPARQL variant set from 390,725,782 to 1,227,614,941. Every figure below was re-run on that date.
mie_spec: 3                        # format version — see MIE_v3_spec.md §2
database: togovar

# ── discovery: rolled into the Usage Guide catalog at build time (spec §3.1). Keep small + uniform. ──
discovery:
  title: TogoVar — Japanese/human genome variation
  description: >
    GRCh38 human genome variants (SNV/Deletion/Insertion/MNV/Indel) with normalized+VCF coordinates,
    Ensembl-VEP per-transcript consequences (SO terms, SIFT/PolyPhen/AlphaMissense, HGVS), dbSNP links,
    and an embedded ClinVar clinical-significance layer; per-population allele frequencies are REST-only.
  keywords: [variant, variation, mutation, snv, snp, indel, genome, human, japanese, dbsnp, clinvar,
             vep, consequence, sequence ontology, sift, polyphen, pathogenic, clinical significance]
  categories: [variant, disease, genomics]

# ── provenance + database-wide truths (get_MIE_file only) ──
endpoint: https://grch38.togovar.org/sparql   # TogoVar's OWN self-hosted endpoint — NOT federated with RDF Portal
base_uri: http://togovar.org/
graphs:
  primary: http://togovar.org/variant          # CORE variant records: type, identifiers, gvo:pos/ref/alt, faldo:location, ClinVar ALLELEID (gvo:info)
  supporting:                                   # TogoVar's OWN per-variant annotation layer — SAME variant IRI as subject
    - http://togovar.org/variant/annotation/ensembl   # VEP consequences (per-transcript bnodes), most_severe_consequence, dbSNP + PubMed rdfs:seeAlso
  co_hosted:                                    # embedded reference datasets on the SAME endpoint — cross-GRAPH join targets, no TogoID bridge
    probed_clean: >
      2g reverse probe run 2026-10-09 (16 graphs on the endpoint) — no re-declaration found. Legs probed: the
      variant IRI (rs671) carries rdf:type in <…/variant> ONLY (1 graph; the old ×2 re-typing went away with the
      <…/variant/annotation/clinvar> graph); hub IRIs obo:SO_0001583, identifiers.org/hgnc/404, Ensembl
      ENSG00000111275 + ENST00000261733 and ncbi.nlm.nih.gov/gene/217 each have ALL their triples in exactly one
      graph (so / hgnc / ensembl / ensembl / clinvar). The duplication that DOES exist is inside one graph
      (gotcha duplicated_bnodes), which a graph pin does not fix.
    clinvar: >
      JOIN — embedded DBCLS ClinVar RDF (mirrors the standalone `clinvar` DB). Join from the variant's
      ClinVar ALLELEID (gvo:info node) to cvo:allele_id. See example clinvar_significance.
    so: "JOIN — Sequence Ontology term labels (rdfs:label); SO consequence IRIs are opaque without it."
    ensembl: "reference — Ensembl gene + transcript models (FALDO); gene IRIs are the tgvo:gene join anchors."
    hgnc: "reference — HGNC gene records; tgvo:hgnc → identifiers.org/hgnc/{n} anchors here."
    other_ontologies: "mondo, medgen, go, mesh, efo, gwas-catalog, pubmed, pubtator, hco — reference graphs; GRAPH-pin explicitly to reach them."

entity_counts:                     # graph-pinned type counts in GRAPH <http://togovar.org/variant>, live 2026-10-09
  date: "2026-10-09"
  total_variants: 1227614941       # sum of the 5 gvo classes
  snv: 1046958793
  deletion: 90067908
  insertion: 90567342
  mnv: 12283
  indel: 8615
  rest_api_total_variants: 1229026068   # REST togovar_search_variant `total`, same day (NOT a SPARQL count) — the two backends now agree to 0.1%

global_gotchas:                    # the few that bite ANY query on this DB — verified 2026-10-09
  - id: vocabulary_namespace
    say: >
      The TogoVar vocabulary prefix is `PREFIX tgvo: <http://togovar.org/vocabulary/>`. The former namespace
      <http://togovar.biosciencedbc.jp/vocabulary/> (still in older documentation and saved queries) matches
      NOTHING now — every tgvo: pattern written with it returns 0 rows, with no error.
    check:
      kind: zero_rows
      date: "2026-10-09"
      query: |
        SELECT ?c WHERE { GRAPH <http://togovar.org/variant/annotation/ensembl> {
          <http://identifiers.org/hco/12/GRCh38#111803962-G-A> <http://togovar.biosciencedbc.jp/vocabulary/hasConsequence> ?c } } LIMIT 1
  - id: graph_scoped_predicates
    say: >
      Predicates are GRAPH-scoped, and the wrong graph returns 0 rows SILENTLY. Core fields (rdf:type, gvo:pos/ref/alt,
      dcterms:identifier, faldo:location, gvo:info) live in <http://togovar.org/variant>; VEP (tgvo:hasConsequence,
      tgvo:most_severe_consequence) and rdfs:seeAlso (dbSNP, PubMed) in <…/variant/annotation/ensembl>; clinical
      significance in the embedded <http://togovar.org/clinvar>. The graph <…/variant/annotation/clinvar> NO LONGER
      EXISTS — its ClinVar identifiers moved onto the core variant node.
    check:
      kind: absent
      date: "2026-10-09"
      query: |
        SELECT ?s WHERE { GRAPH <http://togovar.org/variant/annotation/clinvar> { ?s ?p ?o } } LIMIT 1
  - id: identifier_is_multi_valued
    say: >
      dcterms:identifier on a variant is NOT "the tgv ID": it carries up to three different strings — the tgv ID
      ("tgv47264307"), a "chr-pos-ref-alt" key ("12-111803962-G-A") and, for ClinVar variants, the ClinVar
      VariationID ("18390"). rs671 has all three, so an unfiltered `dcterms:identifier ?id` triples its rows.
      Filter the form you want (STRSTARTS(?id, "tgv")) and do NOT assume a tgv ID exists: of the 27,889 variants
      annotated to ALDH2 only 10,997 have one, and ClinVar-only variants (e.g. CFTR 7:117480132-C-T) have just
      the VariationID.
    check:
      kind: count
      date: "2026-10-09"
      query: |
        PREFIX dcterms: <http://purl.org/dc/terms/>
        SELECT (COUNT(?id) AS ?n) WHERE { GRAPH <http://togovar.org/variant> {
          <http://identifiers.org/hco/12/GRCh38#111803962-G-A> dcterms:identifier ?id } }
      expect: {value: 3, tolerance: 0}
  - id: duplicated_bnodes
    say: >
      Blank-node annotations are stored REPEATEDLY inside one graph: rs671 has 172 tgvo:hasConsequence bnodes for
      43 distinct transcript-level HGVS strings (×4) and 4 identical faldo:location nodes. The repeat factor
      varies by variant, so COUNT(?c) or COUNT(*) over consequence bnodes is meaningless and a graph pin does not
      help. Always count COUNT(DISTINCT ?variant) (or DISTINCT a value such as ?hgvsc) and list with SELECT DISTINCT
      over VALUES, never over the bnode itself. On top of that, hasConsequence is one bnode PER TRANSCRIPT, so
      per-transcript fields (hgvsc/hgvsp/transcript) legitimately fan out per variant.
    check:
      kind: ratio
      date: "2026-10-09"
      numerator: |
        PREFIX tgvo: <http://togovar.org/vocabulary/>
        SELECT (COUNT(?c) AS ?n) WHERE { GRAPH <http://togovar.org/variant/annotation/ensembl> {
          <http://identifiers.org/hco/12/GRCh38#111803962-G-A> tgvo:hasConsequence ?c . ?c tgvo:hgvsc ?h } }
      denominator: |
        PREFIX tgvo: <http://togovar.org/vocabulary/>
        SELECT (COUNT(DISTINCT ?h) AS ?n) WHERE { GRAPH <http://togovar.org/variant/annotation/ensembl> {
          <http://identifiers.org/hco/12/GRCh38#111803962-G-A> tgvo:hasConsequence ?c . ?c tgvo:hgvsc ?h } }
      expect: {ratio: 4.0, tolerance: 0.05}
  - id: no_frequencies
    say: >
      Per-population allele frequencies (ToMMo, gnomAD, JGA, GEM-J, NCBN, BBJ) are NOT in this SPARQL endpoint —
      a variant node carries only type, identifiers, coordinates/alleles, location, gvo:info, consequences and
      seeAlso. Frequencies are REST-only (togovar_search_variant row payload).
    check:
      kind: absent       # rs671 has frequencies in 13 REST panels; in SPARQL it has no predicate beyond the listed ones
      date: "2026-10-09"
      query: |
        PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
        PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
        SELECT ?p WHERE { GRAPH ?g { <http://identifiers.org/hco/12/GRCh38#111803962-G-A> ?p ?o }
          FILTER(?p NOT IN (rdf:type, rdfs:seeAlso, <http://purl.org/dc/terms/identifier>,
            <http://biohackathon.org/resource/faldo#location>, <http://genome-variation.org/resource#info>,
            <http://genome-variation.org/resource#pos>, <http://genome-variation.org/resource#pos_vcf>,
            <http://genome-variation.org/resource#ref>, <http://genome-variation.org/resource#ref_vcf>,
            <http://genome-variation.org/resource#alt>, <http://genome-variation.org/resource#alt_vcf>,
            <http://togovar.org/vocabulary/hasConsequence>, <http://togovar.org/vocabulary/most_severe_consequence>)) } LIMIT 1
  - id: sparql_matches_rest_size
    say: >
      SPARQL is no longer a small subset of TogoVar: the core graph holds 1,227,614,941 variants against the REST
      API's 1,229,026,068 (2026-10-09). Before the 2026-10 reload it held 390,725,782 and lacked ClinVar-pathogenic
      variants such as CFTR 7:117480132-C-T, which is present now — discard older advice that SPARQL enumeration
      is incomplete for that reason. The two backends still differ in CONTENT: frequencies and the per-condition
      significance summary are REST-only, and counts will not match to the last variant.
    check:
      kind: count
      date: "2026-10-09"
      query: |
        PREFIX gvo: <http://genome-variation.org/resource#>
        SELECT (COUNT(?v) AS ?n) WHERE { GRAPH <http://togovar.org/variant> { ?v a gvo:SNV } }
      expect: {value: 1046958793, tolerance: 0.02}

# ── examples: verified, executable atoms. The variant IRI (hco/{chr}/GRCh38#{pos_vcf}-{ref_vcf}-{alt_vcf}) is the hub;
#    the annotation layer keys off it across graphs. Anchor every consequence/gene query on a gene or variant IRI. ──
examples:
  - id: variant_core
    intent: canonical variant record by its TogoVar IRI
    question: "What are the type, tgv ID, coordinates and alleles of chr12:111803962 G>A (rs671)?"
    complexity: basic
    sparql: |
      PREFIX gvo: <http://genome-variation.org/resource#>
      PREFIX dcterms: <http://purl.org/dc/terms/>
      SELECT ?type ?tgv ?pos ?ref ?alt
      WHERE {
        GRAPH <http://togovar.org/variant> {
          <http://identifiers.org/hco/12/GRCh38#111803962-G-A>
              a ?type ; gvo:pos ?pos ; gvo:ref ?ref ; gvo:alt ?alt .
          OPTIONAL { <http://identifiers.org/hco/12/GRCh38#111803962-G-A> dcterms:identifier ?tgv .
                     FILTER(STRSTARTS(?tgv, "tgv")) }     # the predicate also holds 2 other id forms
        }
      }
    verified: {row_count: 1, has_values: ["tgv47264307", 111803962], type: "gvo:SNV", date: "2026-10-09"}
    teaches: "Variant IRI = http://identifiers.org/hco/{chr}/GRCh38#{pos}-{ref}-{alt}; its core node (type, identifiers, gvo:pos/ref/alt) lives ONLY in GRAPH <http://togovar.org/variant>. The tgv ID is OPTIONAL and must be picked out of dcterms:identifier by its prefix (gotcha identifier_is_multi_valued)."
    traps_avoided:
      - say: "The IRI is built from the VCF-style position and alleles (gvo:pos_vcf / ref_vcf / alt_vcf, anchor base included), NOT the normalized gvo:pos/ref/alt. They coincide for an SNV but not for an indel: the deletion …/hco/1/GRCh38#17023993-CCA-C has gvo:pos 17023994, gvo:ref \"CA\", gvo:alt \"\". Build an indel IRI from normalized values and it matches nothing."
        check:
          kind: count
          date: "2026-10-09"
          query: |
            PREFIX gvo: <http://genome-variation.org/resource#>
            SELECT ?pos WHERE { GRAPH <http://togovar.org/variant> {
              <http://identifiers.org/hco/1/GRCh38#17023993-CCA-C> gvo:pos ?pos ; gvo:pos_vcf 17023993 ; gvo:ref "CA" ; gvo:alt "" } }
          expect: {value: 17023994, tolerance: 0}

  - id: variant_by_tgv_id
    intent: resolve a tgv ID (as returned by the REST tool) to its variant IRI
    question: "Which variant IRI has the TogoVar ID tgv47264307?"
    complexity: basic
    sparql: |
      PREFIX dcterms: <http://purl.org/dc/terms/>
      SELECT ?variant
      WHERE {
        GRAPH <http://togovar.org/variant> { ?variant dcterms:identifier "tgv47264307" . }
      }
    verified: {row_count: 1, has_values: ["http://identifiers.org/hco/12/GRCh38#111803962-G-A"], date: "2026-10-09"}
    teaches: "Identifiers are PLAIN string literals — match \"tgv47264307\" with no datatype (the ^^xsd:string form returns 0 rows). The same pattern resolves a ClinVar VariationID (\"18390\") or a \"12-111803962-G-A\" key, since all three share the predicate."

  - id: rsid_consequence
    intent: resolve a dbSNP rsID to its variant + most-severe consequence, with a human-readable SO label
    question: "Which TogoVar variant is dbSNP rs671, and what is its most severe consequence (readable label)?"
    complexity: basic
    sparql: |
      PREFIX tgvo: <http://togovar.org/vocabulary/>
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
      SELECT ?variant ?soConsequence ?soLabel
      WHERE {
        GRAPH <http://togovar.org/variant/annotation/ensembl> {
          ?variant rdfs:seeAlso <http://identifiers.org/dbsnp/rs671> ;
                   tgvo:most_severe_consequence ?soConsequence .
        }
        GRAPH <http://togovar.org/so> {               # SO term labels live in the embedded `so` graph
          ?soConsequence rdfs:label ?soLabel .
        }
      }
    verified: {row_count: 1, has_values: ["missense_variant", "http://identifiers.org/hco/12/GRCh38#111803962-G-A"], date: "2026-10-09"}
    teaches: "dbSNP rsIDs are stored as IRIs (rdfs:seeAlso → identifiers.org/dbsnp/rs…) — match the IRI, never a text 'rs…' string. Consequence SO IRIs are opaque; join GRAPH <…/so> for the label. tgvo:most_severe_consequence is ONE SO term per variant."
    traps_avoided:
      - "rdfs:seeAlso mixes dbSNP IRIs with PubMed IRIs (rdf.ncbi.nlm.nih.gov/pubmed/…; rs671 has 116 of them) — prefix-filter to http://identifiers.org/dbsnp/ when you want only refSNPs. An rsID can also map to several variants (multi-allelic sites: rs334 → T>A and T>G), and only about half of variants have one (13,643 of ALDH2's 27,889)."

  - id: gene_variants
    intent: variants affecting a gene via its Ensembl gene IRI + each variant's most-severe consequence
    question: "List variants affecting ALDH2 (ENSG00000111275) with their most severe consequence."
    complexity: intermediate
    sparql: |
      PREFIX tgvo: <http://togovar.org/vocabulary/>
      SELECT DISTINCT ?variant ?soConsequence
      WHERE {
        GRAPH <http://togovar.org/variant/annotation/ensembl> {
          ?variant tgvo:hasConsequence ?c ;
                   tgvo:most_severe_consequence ?soConsequence .
          ?c tgvo:gene <http://rdf.ebi.ac.uk/resource/ensembl/ENSG00000111275> .
        }
      }
      LIMIT 20
    verified: {min_rows: 20, date: "2026-10-09", note: "the gene has 27,889 distinct variants"}
    teaches: "Filter the per-transcript consequence bnode by the Ensembl gene IRI (structured lookup, no gene-name text search); DISTINCT collapses the per-transcript and repeated bnodes. tgvo:hgnc <http://identifiers.org/hgnc/404> on the same bnode is an equivalent anchor. Resolve a gene NAME→HGNC first with togovar_search_gene."
    traps_avoided:
      - "Not every consequence bnode has tgvo:gene: those with tgvo:gene_symbol_source \"EntrezGene\" (RefSeq-side annotation) carry gene_symbol + hgnc but no tgvo:gene/tgvo:transcript IRI (8 of rs671's 172). Anchoring on tgvo:hgnc catches both kinds."

  - id: gene_consequence_census
    intent: per-gene breakdown of variants by most-severe consequence (the GROUP BY recipe)
    question: "How are ALDH2's variants distributed over most-severe consequence classes?"
    complexity: aggregation
    sparql: |
      PREFIX tgvo: <http://togovar.org/vocabulary/>
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
      SELECT ?soLabel (COUNT(DISTINCT ?variant) AS ?variants)
      WHERE {
        GRAPH <http://togovar.org/variant/annotation/ensembl> {
          ?variant tgvo:hasConsequence ?c ;
                   tgvo:most_severe_consequence ?so .
          ?c tgvo:gene <http://rdf.ebi.ac.uk/resource/ensembl/ENSG00000111275> .
        }
        GRAPH <http://togovar.org/so> { ?so rdfs:label ?soLabel . }
      }
      GROUP BY ?soLabel
      ORDER BY DESC(?variants)
    verified: {row_count: 20, has_values: ["intron_variant", "missense_variant", "stop_gained"], date: "2026-10-09", note: "intron 18,166 · 3'UTR 7,308 · missense 1,067 · synonymous 405 … stop_gained 59; classes sum to the gene's 27,889 variants"}
    teaches: "Because most_severe_consequence is single-valued, a GROUP BY on it partitions a gene's variants exactly once each — COUNT(DISTINCT ?variant) per class sums to the gene total. Grouping on the consequence bnode's own rdf:type instead counts per transcript."

  - id: enum_sift_deleterious
    intent: enumerate predicted-deleterious variants in a gene via the controlled SIFT prediction literal
    question: "Which ALDH2 variants are predicted deleterious by SIFT, and what is the protein change?"
    complexity: intermediate
    sparql: |
      PREFIX tgvo: <http://togovar.org/vocabulary/>
      SELECT DISTINCT ?variant ?hgvsp ?pred
      WHERE {
        GRAPH <http://togovar.org/variant/annotation/ensembl> {
          ?variant tgvo:hasConsequence ?c .
          ?c tgvo:gene <http://rdf.ebi.ac.uk/resource/ensembl/ENSG00000111275> ;
             tgvo:sift_prediction ?pred ;
             tgvo:hgvsp ?hgvsp .
          FILTER(STRSTARTS(?pred, "deleterious"))    # covers "deleterious" AND "deleterious_low_confidence"
        }
      }
      LIMIT 20
    verified: {min_rows: 20, date: "2026-10-09", note: "696 distinct variants, 1,359 distinct protein changes in full"}
    teaches: "SIFT/PolyPhen/AlphaMissense enumeration uses the controlled *_prediction literal on the consequence bnode — a set-level route. STRSTARTS captures the *_low_confidence calls."
    traps_avoided:
      - say: "An exact match on \"deleterious\" silently returns nothing for this gene: every ALDH2 SIFT call is *_low_confidence (deleterious_low_confidence / tolerated_low_confidence)."
        check:
          kind: zero_rows
          date: "2026-10-09"
          query: |
            PREFIX tgvo: <http://togovar.org/vocabulary/>
            SELECT ?variant WHERE { GRAPH <http://togovar.org/variant/annotation/ensembl> {
              ?variant tgvo:hasConsequence ?c .
              ?c tgvo:gene <http://rdf.ebi.ac.uk/resource/ensembl/ENSG00000111275> ; tgvo:sift_prediction "deleterious" } } LIMIT 1
      - "tgvo:sift SCORES have MIXED xsd:decimal/xsd:integer datatypes (a score of 0 is stored as an integer) — numeric comparison works, exact term equality does not. Prefer the *_prediction literal for categorical enumeration."

  - id: count_variant_class
    intent: count a variant class (graph-pinned type scan)
    question: "How many Insertion variants are in TogoVar?"
    complexity: aggregation
    sparql: |
      PREFIX gvo: <http://genome-variation.org/resource#>
      SELECT (COUNT(?v) AS ?insertions)
      WHERE {
        GRAPH <http://togovar.org/variant> {
          ?v a gvo:Insertion .
        }
      }
    verified: {n: 90567342, date: "2026-10-09"}
    teaches: "A type scan pinned to GRAPH <http://togovar.org/variant> gives the class size. Classes: SNV 1,046,958,793 · Insertion 90,567,342 · Deletion 90,067,908 · MNV 12,283 · Indel 8,615 → total 1,227,614,941."

  - id: enum_consequence            # §4.4 enumeration example — the set-level SO-consequence route
    intent: enumerate ALL variants of a given functional class (SO consequence) in a gene — the controlled-vocabulary set route
    question: "How many missense variants does ALDH2 have?"
    complexity: aggregation
    sparql: |
      PREFIX tgvo: <http://togovar.org/vocabulary/>
      PREFIX obo: <http://purl.obolibrary.org/obo/>
      SELECT (COUNT(DISTINCT ?variant) AS ?missense)
      WHERE {
        GRAPH <http://togovar.org/variant/annotation/ensembl> {
          ?variant tgvo:hasConsequence ?c ;
                   tgvo:most_severe_consequence obo:SO_0001583 .   # SO_0001583 = missense_variant
          ?c tgvo:gene <http://rdf.ebi.ac.uk/resource/ensembl/ENSG00000111275> .
        }
      }
    verified: {n: 1067, date: "2026-10-09"}
    teaches: >
      For 'ALL variants with consequence/prediction/significance X', filter on the controlled term — most_severe_consequence
      (SO IRI), a *_prediction literal (see enum_sift_deleterious), or a ClinVar significance literal — NOT a text/name match.
      Anchor on a gene IRI: an unanchored scan faces 1.2 billion variants.
    traps_avoided:
      - "Count COUNT(DISTINCT ?variant), never the bnodes: this join passes through 1,044,024 consequence bnodes for 27,889 variants (gotcha duplicated_bnodes)."
      - "Figures here grew about ninefold in the 2026-10 reload (this count was 123 in 2026-07). A number quoted from an earlier TogoVar SPARQL result is not comparable with one measured now."

  - id: variant_report
    intent: variant report joining core coordinates + VEP annotation across two graphs (gene- and consequence-anchored to stay bounded)
    question: "For ALDH2 stop-gained variants, give position, ref/alt, dbSNP rsID and protein consequence."
    complexity: advanced
    sparql: |
      PREFIX gvo:  <http://genome-variation.org/resource#>
      PREFIX tgvo: <http://togovar.org/vocabulary/>
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
      PREFIX obo:  <http://purl.obolibrary.org/obo/>
      SELECT DISTINCT ?variant ?pos ?ref ?alt ?rs ?hgvsp
      WHERE {
        GRAPH <http://togovar.org/variant/annotation/ensembl> {
          ?variant tgvo:most_severe_consequence obo:SO_0001587 ;     # stop_gained
                   tgvo:hasConsequence ?c .
          ?c tgvo:gene <http://rdf.ebi.ac.uk/resource/ensembl/ENSG00000111275> ;
             tgvo:hgvsp ?hgvsp .
          OPTIONAL { ?variant rdfs:seeAlso ?rs . FILTER(STRSTARTS(STR(?rs), "http://identifiers.org/dbsnp/")) }
        }
        GRAPH <http://togovar.org/variant> {
          ?variant gvo:pos ?pos ; gvo:ref ?ref ; gvo:alt ?alt .
        }
      }
      ORDER BY ?pos ?hgvsp
      LIMIT 20
    verified: {min_rows: 20, date: "2026-10-09"}
    teaches: "Cross-GRAPH join WITHIN the endpoint on the shared variant IRI: VEP + dbSNP from …/annotation/ensembl, coordinates from …/variant. Narrow by gene AND consequence class before the join; DISTINCT collapses repeated bnodes, while one row per distinct transcript-level hgvsp remains."

  - id: clinvar_significance        # ELEVATED cross_db class — bridges the variant layer to the embedded ClinVar dataset
    intent: "cross-DB: variant → embedded ClinVar gene + germline clinical significance via the ClinVar AlleleID"
    question: "For chr12:111803962 G>A (rs671), what gene, variant name and ClinVar germline significance does the embedded ClinVar dataset record?"
    complexity: cross_db
    endpoint_name: togovar
    sparql: |
      PREFIX gvo:     <http://genome-variation.org/resource#>
      PREFIX rdf:     <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
      PREFIX rdfs:    <http://www.w3.org/2000/01/rdf-schema#>
      PREFIX med2rdf: <http://med2rdf.org/ontology/med2rdf#>
      PREFIX cvo:     <http://purl.jp/bio/10/clinvar/>
      SELECT DISTINCT ?alleleId ?variationId ?gene ?name ?significance ?reviewStatus
      WHERE {
        GRAPH <http://togovar.org/variant> {
          <http://identifiers.org/hco/12/GRCh38#111803962-G-A> gvo:info ?info .
          ?info rdfs:label "ALLELEID" ; rdf:value ?alleleId .       # ClinVar AlleleID, an integer
        }
        GRAPH <http://togovar.org/clinvar> {
          ?alleleNode cvo:allele_id ?alleleId ;
                      cvo:variation_id ?variationId ;
                      med2rdf:gene ?gene .
          OPTIONAL { ?alleleNode cvo:name ?name FILTER(isLiteral(?name)) }
          ?varNode a cvo:VariationArchiveType ;
                   cvo:variation_id ?variationId ;
                   cvo:classified_record/cvo:classifications/cvo:germline_classification ?gc .
          ?gc cvo:description ?significance .          # THE aggregate significance literal
          OPTIONAL { ?gc cvo:review_status ?reviewStatus }
        }
      }
    verified: {row_count: 1, has_values: [33429, 18390, "drug response"], gene: "ncbi.nlm.nih.gov/gene/217", reviewStatus: "reviewed by expert panel", date: "2026-10-09"}
    teaches: "A ClinVar-known variant carries a gvo:info node labelled \"ALLELEID\" whose rdf:value is the integer ClinVar AlleleID; it joins straight to cvo:allele_id in the embedded ClinVar graph — no cast. The allele node gives gene + name and its cvo:variation_id; the variation IRI with the same variation_id carries classified_record→classifications→germline_classification→description."
    traps_avoided:
      - "Two id spaces overlap numerically: 33429 is this variant's AlleleID and 18390 its VariationID (also a dcterms:identifier string on the variant node). Join AlleleID→cvo:allele_id or VariationID→cvo:variation_id, never one to the other — in the embedded graph dcterms:identifier is the AlleleID."
      - "med2rdf:gene is MULTI-VALUED where ClinVar assigns overlapping loci, so the join returns one row per gene: rs334 (HBB) returns 3 genes for each of its two alleles. Collapse with GROUP_CONCAT/SAMPLE, or keep the gene matching the VEP tgvo:gene_symbol."
      - "germline_classification is ClinVar's single aggregate call (\"drug response\" here). The REST tool togovar_search_variant instead lists per-condition interpretations (Pathogenic, Risk factor, Protective … for the same variant) — the two are not expected to agree."

# ── schema_delta: non-obvious predicates/structure NO example above already demonstrates. ──
schema_delta:
  - "NORMALIZED vs VCF alleles: gvo:ref/gvo:alt are normalized (trimmed) and are the EMPTY STRING \"\" for pure insertions (ref) / deletions (alt); gvo:ref_vcf/gvo:alt_vcf keep the VCF anchor base (never empty). gvo:pos = gvo:pos_vcf + 1 for insertions and deletions. Match gvo:pos with an INTEGER literal (111803962, not \"111803962\")."
  - "FALDO location shape depends on variant type: SNV → faldo:ExactPosition (faldo:position + faldo:reference → identifiers.org/hco/{chr}/GRCh38); Insertion → faldo:InBetweenPosition; Deletion → faldo:Region. faldo:position alone is NOT chromosome-scoped — also constrain faldo:reference."
  - "Scores on the consequence bnode beyond the *_prediction literals: tgvo:sift / tgvo:polyphen / tgvo:alphamissense (numeric, mixed decimal/integer), tgvo:cadd_phred and tgvo:cadd_raw (CADD), and tgvo:impact (controlled literal, e.g. \"MODERATE\"). SIFT/PolyPhen/AlphaMissense exist only on bnodes for coding changes."
  - "HGVS strings on the consequence bnode: tgvo:hgvsc (\"ENST00000261733.7:c.1510G>A\"), tgvo:hgvsg (\"chr12:g.111803962G>A\"), tgvo:hgvsp (\"ENSP00000261733.2:p.Glu504Lys\") — plain literals, per transcript. tgvo:transcript → rdf.ebi.ac.uk/resource/ensembl.transcript/ENST… (described in GRAPH <…/ensembl>)."
  - "The consequence bnode's rdf:type is the per-transcript SO consequence IRI (multi-valued); tgvo:gene_symbol is a plain literal (\"ALDH2\")."

# ── id_join_map: how to anchor stably and cross to other resources. ──
id_join_map:
  stable_anchor: >
    Variant = IRI http://identifiers.org/hco/{chr}/GRCh38#{pos_vcf}-{ref_vcf}-{alt_vcf} (GRCh38, VCF-style position
    and alleles). The REST tool's `variant_iri` is this IRI. A tgv ID (dcterms:identifier "tgv…") exists for only
    part of the variants; the dbSNP rsID (rdfs:seeAlso IRI) is a secondary key that is neither universal nor unique.
  same_endpoint_joins:            # embedded on the TogoVar endpoint — direct cross-GRAPH join, NO TogoID bridge
    sequence_ontology: "tgvo:most_severe_consequence / consequence rdf:type → obo/SO_… IRI; labels in GRAPH <…/so> (examples rsid_consequence, gene_consequence_census)"
    ensembl_gene:      "tgvo:gene → rdf.ebi.ac.uk/resource/ensembl/ENSG… IRI (example gene_variants)"
    hgnc:              "tgvo:hgnc → identifiers.org/hgnc/{n}; togovar_search_gene('ALDH2') → hgnc_id 404 gives the anchor directly"
    embedded_clinvar:  "gvo:info \"ALLELEID\" rdf:value (integer) → cvo:allele_id (example clinvar_significance)"
  xrefs:                          # stable external IRIs TogoVar exposes as join keys
    dbsnp:   "rdfs:seeAlso → identifiers.org/dbsnp/rs… (13,643 of ALDH2's 27,889 variants, 48.9%)"
    pubmed:  "rdfs:seeAlso → rdf.ncbi.nlm.nih.gov/pubmed/{pmid} on the same predicate (50 of ALDH2's variants)"
    clinvar: "VariationID as a dcterms:identifier string + AlleleID via gvo:info; embedded clinvar also carries cvo:accession VCV… "
    ncbi_gene: "embedded-ClinVar med2rdf:gene → ncbi.nlm.nih.gov/gene/{n} (multi-valued)"
  bridged_via_togoid:             # TogoVar is a STANDALONE endpoint, NOT federated with RDF Portal — external DBs route via TogoID
    - "RDF Portal DBs (uniprot, chembl, ensembl, clinvar-standalone, etc.) reach TogoVar's entities only via togoid_convertId on the dbSNP rsID, ENSG gene, HGNC IRI, or NCBI gene — there is no federated SPARQL join."
    - "REST companion tools (togovar sub-server): togovar_search_gene / _disease resolve name→ID for a SPARQL anchor; togovar_search_variant is the ONLY path for allele frequencies."
