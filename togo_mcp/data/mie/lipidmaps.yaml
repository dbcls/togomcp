mie_spec: 3
database: lipidmaps

discovery:
  title: LIPID MAPS Structure Database (LMSD)
  description: >
    Classified lipid structures with molecular formula, monoisotopic mass, InChI/InChIKey
    and lipidomics shorthand notation, organised under the eight-category LIPID MAPS
    classification hierarchy.
  keywords:
    - lipid
    - lipidomics
    - fatty acid
    - glycerophospholipid
    - sphingolipid
    - sterol
    - metabolite
    - molecular formula
    - monoisotopic mass
    - inchikey
    - shorthand notation
    - mass spectrometry
  categories: [compound, ontology]

endpoint: https://lipidmaps.org/sparql
base_uri: https://www.lipidmaps.org/rdf/

graphs:
  # This endpoint exposes NO named graphs: `SELECT ?g WHERE { GRAPH ?g { ?s ?p ?o } }` returns
  # 0 rows (verified 2026-09-15). All 479,072 triples live in the DEFAULT graph, so there is
  # nothing to GRAPH/FROM-pin and no co-tenant that could re-declare a predicate. `co_hosted`
  # is therefore genuinely N/A rather than un-probed — the `no_named_graphs` gotcha below
  # carries the `kind: absent` check that re-decides it.
  primary: "(default graph — this endpoint declares no named graphs)"
  supporting: []

entity_counts:
  # Nothing here is graph-pinned because there are no graphs to pin (see `graphs`); every
  # figure is COUNT(DISTINCT) so the multi-parent classification cannot inflate it.
  classified_lipid_ids: 52175      # every LM* IRI carrying rdfs:subClassOf — the honest DB size
  typed_owl_class: 50454           # of those, the ones asserting `a owl:Class`
  with_structure_inchikey: 49882   # chebi:inchi / chebi:inchikey
  duplicate_inchikeys: 3           # InChIKeys carried by >1 LM id (6 records, all PK)
  with_formula: 49849
  with_monoisotopic_mass: 49850
  with_shorthand_abbrev: 34567     # lipidmaps:abbrev — 6,988 DISTINCT shorthand strings
  classification_nodes: 708        # EVERY category/* IRI. 672 are labelled (all appear in subject
                                   # position); 36 are unlabelled and appear ONLY as objects.
  classification_nodes_with_children: 607   # the subset that is an object of rdfs:subClassOf, i.e. holds
                                   # >=1 child. This is NOT the node total — an earlier revision published
                                   # it as such, and 571 (labelled AND has a child) as its labelled share.
                                   # Three different quantities; keep them apart.
  empty_classification_leaves: 93  # labelled classes with NO members and NO children (e.g. GL0303
                                   # Dialkylmonoacylglycerols, GP0502). With the 8 roots they make up the
                                   # 101 nodes appearing only as SUBJECTS. Set arithmetic, for reference:
                                   # |subject|=672, |object|=607, |both|=571, |union|=708.
  chebi_xrefs: 14572
  swisslipids_xrefs: 12559
  total_triples: 479072
  date: "2026-09-15"

global_gotchas:
  - id: pr_category_contaminated_by_fa01
    say: >
      The Prenol Lipids [PR] category is contaminated by one spurious edge and its count is inflated
      x3.1. `category/6` (PR) carries five outgoing subClassOf edges: `601`/`602`/`603`/`604` (PR01-PR04,
      correct) plus `category/101` ("Fatty Acids and Conjugates [FA01]"), which is an upstream LMSD
      defect. Because category->category edges run broader->narrower here (gotcha inverted_subclassof),
      that one edge pulls the entire FA01 subtree (17 sub-classes: unsaturated, hydroxy, branched, oxo,
      amino, halogenated fatty acids and more) into PR. MEASURED 2026-09-15: PR reaches 8,558 lipids;
      through its four legitimate children it reaches 2,739 (2,674 LMPR ids plus 65 lipids with other
      id prefixes that PR01-PR04 legitimately hold, e.g. farnesyl esters, lanostane, juvenile hormone
      II). The edge adds 5,819 lipids, and it is ALSO the whole source of the apparent multi-classification: with it, 5,875
      lipids sit under 2-3 top categories; without it, 57. Any "how many prenol lipids" answer, any set
      intersection scoped to PR, and any per-category breakdown is wrong unless the edge is dropped.
      FIX: exclude that single edge while descending from the top category (the `category_breakdown`
      example shows it); filtering members on the `LMPR` id prefix instead silently loses those 65.
      Re-check after every LIPID MAPS release.
    check:
      kind: ratio
      date: "2026-09-15"
      numerator: |
        SELECT (COUNT(DISTINCT ?l) AS ?n) WHERE {
          <https://www.lipidmaps.org/rdf/category/6> <http://www.w3.org/2000/01/rdf-schema#subClassOf>+ ?c .
          ?l <http://www.w3.org/2000/01/rdf-schema#subClassOf> ?c .
          FILTER(STRSTARTS(STR(?l), "https://www.lipidmaps.org/rdf/LM"))
        }
      denominator: |
        SELECT (COUNT(DISTINCT ?l) AS ?n) WHERE {
          VALUES ?pc { <https://www.lipidmaps.org/rdf/category/601> <https://www.lipidmaps.org/rdf/category/602>
                       <https://www.lipidmaps.org/rdf/category/603> <https://www.lipidmaps.org/rdf/category/604> }
          ?pc <http://www.w3.org/2000/01/rdf-schema#subClassOf>* ?c .
          ?l <http://www.w3.org/2000/01/rdf-schema#subClassOf> ?c .
          FILTER(STRSTARTS(STR(?l), "https://www.lipidmaps.org/rdf/LM"))
        }
      expect: {ratio: 3.125, tolerance: 0.05}

  - id: inverted_subclassof
    say: >
      `rdfs:subClassOf` runs in TWO OPPOSITE DIRECTIONS here and the OWL-correct one returns
      NOTHING. Lipid -> category is normal (`LMST01010001 rdfs:subClassOf category/50101`), but
      category -> category is INVERTED: `category/1` ("Fatty Acyls [FA]", the top of the tree) has
      0 incoming and 14 OUTGOING subClassOf, i.e. the broader term is asserted as a subClassOf the
      narrower one. So the query everyone writes — `?lipid rdfs:subClassOf+ <category/N>` — returns
      0 rows in ~1s with no error, reading as "this category is empty". FIX: descend the categories
      first, then collect members: `<category/N> rdfs:subClassOf+ ?cat . ?lipid rdfs:subClassOf ?cat`.
      That route is provably complete — it reaches all 52,175 classified LM IDs from the 8 top
      categories. See the `enum_category_members` example.
    check:
      kind: zero_rows
      date: "2026-09-15"
      query: |
        SELECT ?lipid WHERE {
          ?lipid <http://www.w3.org/2000/01/rdf-schema#subClassOf>+ <https://www.lipidmaps.org/rdf/category/4> .
        } LIMIT 1

  - id: cloudflare_waf_blocks_string_functions
    say: >
      The Cloudflare WAF in front of this endpoint returns HTTP 403 for some LEGAL SPARQL. The request
      never reaches the triplestore: the response is a Cloudflare "Attention Required" HTML page, not a
      SPARQL error. ISOLATED 2026-09-15, each in a one-line `BIND(<fn>(constants) AS ?x)` query: `SUBSTR(`
      and `CONCAT(` are BLOCKED; `REPLACE(` and `STRAFTER(` pass, while a control COUNT from the same
      client succeeds seconds later. The trigger is almost certainly the managed SQL-injection ruleset
      matching on function names, so it may depend on client and IP and can change without notice. The
      403 is NOT a syntax error: do not debug the SPARQL, and ignore any "fix the query" advice attached
      to it. WORKAROUNDS: (1) never derive a prefix or code with SUBSTR; carry the derived value in a
      `VALUES` block and match with `STRSTARTS`, e.g. `VALUES (?code ?p) { ("LMFA"
      "https://www.lipidmaps.org/rdf/LMFA") ... } FILTER(STRSTARTS(STR(?lipid), ?p))`; (2) if a string
      really must be built, use STRAFTER/STRBEFORE/REPLACE, or run the whole query from RDF Portal's `ebi`
      endpoint with LIPID MAPS inside `SERVICE`, putting SUBSTR/CONCAT in the OUTER (Virtuoso) part. Also
      confirmed working here: STRSTARTS, CONTAINS, REGEX (anchors, `+`, 3-argument form), SAMPLE,
      GROUP_CONCAT, FILTER NOT EXISTS, nested sub-SELECT with HAVING.
      REFINED 2026-09-16: the rule is `\b(substr|concat|char)\(` matched case-insensitively against the
      RAW REQUEST BODY, not the parsed query. `SELECT ?x WHERE { BIND("SUBSTR(" AS ?x) }` — where the
      token is only a string LITERAL — is blocked too, which is the proof it never reaches SPARQL, and
      which is also why `GROUP_CONCAT(` passes: the preceding `_` defeats the word boundary. `char(` is
      blocked on the same rule. That makes the fix ONE CHARACTER: PUT A SPACE BEFORE THE PAREN.
      `SUBSTR (?s, 33, 2)` and `CONCAT (?a, ?b)` are valid SPARQL, clear the WAF and return correct
      values (verified) — prefer this to restructuring a query around VALUES/STRSTARTS. The host DOES
      discriminate by client, as suspected above, but on USER-AGENT rather than IP: urllib's default
      `Python-urllib/3.x` is 403'd wholesale, control query included. It is that STRING that is
      blocked, not a missing header — omitting User-Agent entirely returns 200 — but a Python script
      that never sets one sends the urllib default and so sees EVERY query blocked, which is
      indistinguishable from this rule. Set an explicit User-Agent.
    check:
      kind: error
      date: "2026-09-15"
      expect: {timeout_s: 30}
      query: |
        SELECT ?x WHERE { BIND(SUBSTR("abcdef", 1, 2) AS ?x) }

  - id: no_named_graphs
    say: >
      This endpoint declares NO named graphs — every triple is in the default graph. Any query
      written with the `GRAPH <...> { }` or `FROM <...>` pinning that the rest of the RDF Portal
      corpus teaches returns 0 rows here, silently. Write unpinned patterns. There is correspondingly
      no union inflation and no co-tenant to defend against.
    check:
      kind: absent
      date: "2026-09-15"
      query: |
        SELECT ?g WHERE { GRAPH ?g { ?s ?p ?o } } LIMIT 1

  - id: duplicate_labels_fan_out
    say: >
      Most lipids carry TWO `rdfs:label` values — a systematic name and a common name — and NOTHING
      distinguishes them: same predicate, no language tag, no skos:prefLabel. 36,462 entities have 2
      labels and 13,989 have 1, so selecting ?label multiplies rows x1.72 overall (86,913 label
      triples over 50,451 labelled entities) and every other column is duplicated with it. FIX: use
      COUNT(DISTINCT ?lipid) in aggregates, and expect 2 rows per lipid in listings (cholesterol
      LMST01010001 returns both "Cholesterol" and "cholest-5-en-3beta-ol"). For a single canonical
      short name use `lipidmaps:abbrev` instead, which is single-valued.
    check:
      kind: ratio
      date: "2026-09-15"
      numerator: |
        SELECT (COUNT(*) AS ?n) WHERE {
          ?s a <http://www.w3.org/2002/07/owl#Class> ; <http://www.w3.org/2000/01/rdf-schema#label> ?l .
        }
      denominator: |
        SELECT (COUNT(DISTINCT ?s) AS ?n) WHERE {
          ?s a <http://www.w3.org/2002/07/owl#Class> ; <http://www.w3.org/2000/01/rdf-schema#label> ?l .
        }
      expect: {ratio: 1.723, tolerance: 0.05}

  - id: untyped_classification_stubs
    say: >
      Anchoring on `?lipid a owl:Class` silently drops 1,721 lipids (3.3%). 52,175 LM IDs carry a
      classification, but only 50,454 assert `a owl:Class`; the remaining 1,721 are
      classification-only stubs with a `rdfs:subClassOf` and nothing else — no label, no formula, no
      InChIKey. `owl:Class` is also the ONLY class on this endpoint, and the 607 category/* nodes are
      NOT typed at all, so `?s a owl:Class` is a lipid filter, not a category filter. FIX: anchor on
      the IRI prefix (`STRSTARTS(STR(?lipid), "https://www.lipidmaps.org/rdf/LM")`) or on the
      classification edge when you want all classified IDs; anchor on `a owl:Class` only when you
      specifically want records that carry data.
    check:
      kind: ratio
      date: "2026-09-15"
      numerator: |
        SELECT (COUNT(DISTINCT ?s) AS ?n) WHERE {
          ?s <http://www.w3.org/2000/01/rdf-schema#subClassOf> ?c .
          FILTER(STRSTARTS(STR(?s), "https://www.lipidmaps.org/rdf/LM"))
        }
      denominator: |
        SELECT (COUNT(DISTINCT ?s) AS ?n) WHERE { ?s a <http://www.w3.org/2002/07/owl#Class> }
      expect: {ratio: 1.034, tolerance: 0.02}

  - id: not_virtuoso_no_bif_contains
    say: >
      This endpoint is NOT Virtuoso, unlike every rdfportal.org endpoint in this corpus. `bif:contains`
      is a PARSE ERROR ("Unresolved prefixed name: bif:contains"), so the corpus-standard indexed
      text-search idiom does not exist here — use `FILTER(CONTAINS(...))`, which is affordable because
      the whole database is only 479,072 triples (a full unindexed scan runs in ~2s). Literal matching
      is value-based, not term-based: a plain `"C27H46O"` and `"C27H46O"^^xsd:string` BOTH match, so
      the datatype-mismatch trap the Virtuoso-backed MIEs warn about does not apply.
    check:
      kind: error
      date: "2026-09-15"
      expect: {timeout_s: 30}
      query: |
        SELECT ?l WHERE { ?l bif:contains "'cholesterol'" } LIMIT 1

  - id: formula_not_hill_normalised_for_arsenic
    say: >
      `chebi:formula` is NOT Hill-normalised for arsenic, so exact formula matches against ChEBI/PubChem
      fail silently for every arsenolipid. Hill order puts C, then H, then the other elements
      alphabetically, so As precedes O, P and S. LIPID MAPS appends As LAST: LMFA00000032 `C18H35O3As`
      where ChEBI (CHEBI_187398) writes `C18H35AsO3`; LMFA00000033 `C25H53OAs` vs `C25H53AsO`
      (CHEBI_185625); LMFA00000041 `C6H13O2SAs` vs `C6H13AsO2S` (CHEBI_186149). MEASURED 2026-09-15: 42
      lipids carry As in the formula and 0 of them are in Hill order, so a formula string copied from
      ChEBI, PubChem or MS software returns 0 rows for all of them. Deuterium, by contrast, is consistent
      (218 of 219 D-bearing lipids place D immediately after H). Do not use `chebi:formula` as a
      cross-database join key; use `chebi:inchikey`.
    check:
      kind: count
      date: "2026-09-15"
      query: |
        SELECT (COUNT(DISTINCT ?l) AS ?n) WHERE {
          ?l <http://purl.obolibrary.org/obo/chebi/formula> ?f .
          FILTER(REGEX(?f, "As", ""))
          FILTER(!REGEX(?f, "^C[0-9]*H[0-9]*As", ""))
        }
      expect: {value: 42, tolerance: 0.02}

  - id: deuterated_standard_formula_errors
    say: >
      Four deuterated internal standards carry a formula that contradicts their own mass or their ChEBI
      counterpart. These are exactly the records lipidomics labs use for absolute quantitation, so a wrong
      formula propagates straight into an m/z calculation. LMFA03010037 (6keto-PGF1alpha-d4): formula
      `C20H34O6` but mass 374.260648, which is the mass of `C20H30D4O6`; the 278 other `C20H34O6` lipids
      weigh 370.235541, exactly 4 x (D-H) less. LMGP02011284 (PE 15:0/18:1(9Z)-d7) and LMGP06010972
      (PI 15:0/18:1(9Z)-d7): formula says `D5` while the mass says d7, off by exactly 2 x (D-H) = 2.012554
      from their d5 siblings LMGP02011282 / LMGP06010968, which carry the identical formula string.
      LMFA01030003 (arachidonic acid-d8): `C20H24D8O2` against ChEBI's `C28H48O2` for the identical
      InChIKey `YZXBAPSDXZZRGB-FBFLGLDDSA-N` (CHEBI_137828). TRUST THE MASS, not the formula, for any
      record whose name ends in `-d<N>`. More broadly, 22 molecular formulas carry more than one
      `chebi:monoisotopicmass` value: those 3 formula strings, plus 19 that differ only in the last
      stored digit (`2.722504E2` vs `2.72250401E2`, `3.20235145E2` vs `3.20235146E2`). The 19 are
      harmless in a numeric window but split a GROUP BY or an equality match on mass.
    check:
      kind: count
      date: "2026-09-15"
      query: |
        SELECT (COUNT(*) AS ?n) WHERE {
          { SELECT ?f WHERE {
              ?l <http://purl.obolibrary.org/obo/chebi/formula> ?f ;
                 <http://purl.obolibrary.org/obo/chebi/monoisotopicmass> ?m }
            GROUP BY ?f HAVING (COUNT(DISTINCT ?m) > 1) }
        }
      expect: {value: 22, tolerance: 0.02}

  - id: label_search_low_recall
    say: >
      KEYWORD SEARCH ON `rdfs:label` HAS 0.2-4% RECALL FOR LIPID CLASS NAMES — it fails silently,
      returning a short plausible list instead of an error. Each lipid carries a SYSTEMATIC name and an
      ABBREVIATION, and the class noun a biologist types appears in NEITHER; it lives only in the
      `category/*` label. "cardiolipin" matches 2 lipids while class GP1201 holds 1,306;
      "prostaglandin" matches 11 while class FA0301 holds 291. PGE2, the most cited eicosanoid there is,
      carries exactly two labels — "PGE2" and "9-oxo-11R,15S-dihydroxy-5Z,13E-prostadienoic acid" — and
      neither contains "prostaglandin". FIX: resolve a CLASS through the category tree (see
      `enum_category_members`), or through the shorthand head group `STRBEFORE(?abbrev, " ")` (see
      `enum_by_headgroup`); the two agree exactly for CL (1,306 either way). Reserve
      `FILTER(CONTAINS(...))` on labels for a SPECIFIC compound, and even then try both punctuations —
      sphingosine-1-phosphate needs "sphingosine-1-phosphate" AND "sphingosine 1-phosphate" to come back
      complete. This is the label-side counterpart of the formula-side defects above: the identifier a
      human would search on is the one the record does not carry.
    # Checks the PROSTAGLANDIN case (291 in class FA0301 / 11 label matches = 26.5), not the
    # cardiolipin one, because a ratio over a denominator of 2 has no slack: at tolerance 0.3
    # the band [457, 849] admits a denominator of 2 and NOTHING else — 3 gives 435 and fails —
    # so it would assert "exactly two labels contain cardiolipin" and drift on any upstream
    # label addition. Here the same band spans 9-15 label matches. Same claim, real headroom.
    check:
      kind: ratio
      date: "2026-09-16"
      numerator: |
        SELECT (COUNT(DISTINCT ?l) AS ?n) WHERE {
          ?l <http://www.w3.org/2000/01/rdf-schema#subClassOf>
             <https://www.lipidmaps.org/rdf/category/10301> .
        }
      denominator: |
        SELECT (COUNT(DISTINCT ?l) AS ?n) WHERE {
          ?l <http://www.w3.org/2000/01/rdf-schema#label> ?lab .
          FILTER(CONTAINS(LCASE(?lab), "prostaglandin"))
        }
      expect: {ratio: 26.45, tolerance: 0.3}

examples:
  - id: lipid_core_record
    intent: retrieve the complete attribute set of one lipid from its LM ID
    question: "What are the formula, monoisotopic mass, InChIKey and names of cholesterol (LMST01010001)?"
    complexity: basic
    sparql: |
      PREFIX rdfs:  <http://www.w3.org/2000/01/rdf-schema#>
      PREFIX chebi: <http://purl.obolibrary.org/obo/chebi/>
      SELECT ?label ?formula ?mass ?inchikey
      WHERE {
        <https://www.lipidmaps.org/rdf/LMST01010001>
            rdfs:label            ?label ;
            chebi:formula         ?formula ;
            chebi:monoisotopicmass ?mass ;
            chebi:inchikey        ?inchikey .
      }
    verified:
      row_count: 2
      has_values: ["Cholesterol", "cholest-5-en-3beta-ol", "C27H46O", "HVYWMOMLDIMFJA-DPAQBDIFSA-N"]
      date: "2026-09-15"
      note: "2 rows, not 1 — the two rdfs:label values duplicate every other column."
    teaches: >
      The whole per-lipid attribute set is five predicates on the LM IRI itself, with NO
      intermediate node: rdfs:label, and chebi:formula / chebi:monoisotopicmass / chebi:inchi /
      chebi:inchikey borrowed from the ChEBI vocabulary.
    traps_avoided:
      - "The structural predicates live in the ChEBI namespace (`http://purl.obolibrary.org/obo/chebi/formula`), NOT a lipidmaps one — only `abbrev`/`abbrevChains` use `https://www.lipidmaps.org/ontology/`."
      - "`chebi:monoisotopicmass` is `xsd:double` and serialises in E-notation (`3.86354866E2`), so compare it numerically (`FILTER(?mass > 400)`); a string comparison against \"386.35\" matches nothing."

  - id: enum_category_members
    intent: enumerate ALL lipids in a LIPID MAPS category, traversing the inverted hierarchy correctly
    question: "How many lipids are classified as Sphingolipids [SP]?"
    complexity: basic
    sparql: |
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
      # Descend the category tree FIRST (category->category subClassOf is INVERTED),
      # then collect the lipids that point UP into each category reached.
      SELECT (COUNT(DISTINCT ?lipid) AS ?n)
      WHERE {
        <https://www.lipidmaps.org/rdf/category/4> rdfs:subClassOf+ ?cat .
        ?lipid rdfs:subClassOf ?cat .
        FILTER(STRSTARTS(STR(?lipid), "https://www.lipidmaps.org/rdf/LM"))
      }
    verified: {n: 5110, date: "2026-09-15"}
    teaches: >
      THE set-level enumeration route for this database: `<category/N> rdfs:subClassOf+ ?cat .
      ?lipid rdfs:subClassOf ?cat`. The 8 top categories are category/1..8 = FA, GL, GP, SP, ST,
      PR, SL, PK in that order. Swap the category IRI for any other node in the tree (main class
      or sub class) to scope the enumeration narrower.
    traps_avoided:
      - "The FILTER is load-bearing: `?lipid rdfs:subClassOf ?cat` also binds the 100 category nodes that are themselves children in the tree, so without it you count categories alongside lipids."
      - "Lipids attach at THREE depths (3-, 5- and 7-character category IDs), which is why the `+` path is required — a fixed one- or two-hop pattern silently misses whole branches. The tree is four levels deep: 8 categories, 91 main classes, 383 sub classes, 190 deepest-tier — and of the deepest tier, 164 actually hold lipids (the other 26 are empty classes)."
      - "This route is correct for every node EXCEPT `category/6` (Prenol Lipids): there the bare `+` path also follows a spurious edge into FA01 and returns 8,558 instead of 2,739. Use the edge-excluding form in `category_breakdown` (gotcha pr_category_contaminated_by_fa01)."

  - id: category_breakdown
    intent: count lipids per top-level category with COUNT(DISTINCT) over a multi-parent hierarchy
    question: "How are LIPID MAPS structures distributed across the eight lipid categories?"
    complexity: aggregation
    sparql: |
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
      SELECT ?categoryLabel (COUNT(DISTINCT ?lipid) AS ?nLipids)
      WHERE {
        VALUES ?category {
          <https://www.lipidmaps.org/rdf/category/1> <https://www.lipidmaps.org/rdf/category/2>
          <https://www.lipidmaps.org/rdf/category/3> <https://www.lipidmaps.org/rdf/category/4>
          <https://www.lipidmaps.org/rdf/category/5> <https://www.lipidmaps.org/rdf/category/6>
          <https://www.lipidmaps.org/rdf/category/7> <https://www.lipidmaps.org/rdf/category/8>
        }
        ?category rdfs:label ?categoryLabel ;
                  rdfs:subClassOf ?mainClass .
        # Upstream LMSD defect: category/6 (PR) -> category/101 (FA01) is spurious.
        # Drop that ONE edge (gotcha pr_category_contaminated_by_fa01).
        FILTER(!(?category = <https://www.lipidmaps.org/rdf/category/6> &&
                 ?mainClass = <https://www.lipidmaps.org/rdf/category/101>))
        ?mainClass rdfs:subClassOf* ?cat .
        ?lipid rdfs:subClassOf ?cat .
        FILTER(STRSTARTS(STR(?lipid), "https://www.lipidmaps.org/rdf/LM"))
      }
      GROUP BY ?categoryLabel
      ORDER BY DESC(?nLipids)
    verified:
      row_count: 8
      has_values: ["Fatty Acyls [FA]", "Prenol Lipids [PR]", "Saccharolipids [SL]", 11979, 2739, 1353]
      date: "2026-09-15"
      note: >
        8 rows totalling 52,232 against 52,175 distinct lipids: 57 lipids are genuinely classified under
        two top categories. Without the edge filter the PR row reads 8,558 and the total 58,051. That
        excess of 5,876 reconciles exactly: 5,819 assignments come from the spurious edge and 57 are
        genuine (per-lipid top-category counts, 2026-09-15: 46,300 x1 + 5,874 x2 + 1 x3 unfiltered;
        52,118 x1 + 57 x2 filtered).
    teaches: >
      Splitting `rdfs:subClassOf+` into one explicit first hop plus `rdfs:subClassOf*` gives a place to
      drop a single bad edge while keeping the rest of the traversal intact. COUNT(DISTINCT ?lipid) is
      still mandatory in any aggregate (the 57 dual-classified lipids, and the x1.72 label fan-out if
      you also select a name). The category's own classification code (GL0301, SP0601) is embedded in
      its rdfs:label, not in its IRI.
    traps_avoided:
      - "Do NOT read a sum-exceeds-total as evidence of rich multi-classification. The unfiltered form of this query overshoots by 5,876, and 99% of that is one spurious edge. Cross-check any per-category count against the id prefix of its members before quoting it."
      - "Filtering PR members on the `LMPR` id prefix is NOT an equivalent fix: it returns 2,674 and silently drops the 65 other-prefix lipids that PR01-PR04 legitimately hold (farnesyl esters, lanostane, juvenile hormone II), which the edge filter keeps."

  - id: enum_shorthand_isomers
    intent: resolve one lipidomics shorthand name to every structure LIPID MAPS records for it
    question: "Which structures does LIPID MAPS hold for the shorthand species PC 34:1?"
    complexity: intermediate
    sparql: |
      PREFIX lm: <https://www.lipidmaps.org/ontology/>
      SELECT ?lipid ?chains
      WHERE {
        ?lipid lm:abbrev "PC 34:1" .
        OPTIONAL { ?lipid lm:abbrevChains ?chains }
      }
      ORDER BY ?lipid
      LIMIT 25
    verified:
      row_count: 22
      has_values: ["LMGP01010005", "PC 16:0_18:1", "PC 12:0_22:1"]
      date: "2026-09-15"
    teaches: >
      `lm:abbrev` is the species-level lipidomics shorthand (headgroup + total carbons:double bonds)
      and is MANY-TO-ONE: 34,567 lipids collapse onto 6,988 distinct shorthand strings. This is the
      join key for lipidomics result tables, which report exactly this notation. `lm:abbrevChains`
      resolves the individual acyl chains (PC 16:0_18:1) where LIPID MAPS knows them (18,778 lipids).
    traps_avoided:
      - "One shorthand is NOT one lipid: PC 34:1 expands to 22 distinct LM IDs spanning several chain compositions (16:0_18:1, 16:1_18:0, 12:0_22:1, 14:0_20:1 ...). Treating an abbrev as an identifier silently picks one arbitrary isomer."
      - say: "`lm:abbrevChains` must be OPTIONAL — only 18,778 lipids carry it against 34,567 with an `abbrev`, so promoting it to a plain triple pattern silently drops 45.7% of the isomers (for PC 34:1 the row count is unaffected, which is exactly why the habit survives untested elsewhere)."
        check:
          kind: count
          date: "2026-09-15"
          query: |
            SELECT (COUNT(DISTINCT ?s) AS ?n) WHERE {
              ?s <https://www.lipidmaps.org/ontology/abbrevChains> ?o .
            }
          expect: {value: 18778, tolerance: 0.02}

  - id: enum_by_headgroup
    intent: enumerate a lipid class by shorthand head group — the route that survives the label-recall trap
    question: "How many cardiolipins does LIPID MAPS hold, and which shorthand head groups are the largest?"
    complexity: aggregation
    sparql: |
      PREFIX lm: <https://www.lipidmaps.org/ontology/>
      # The head group is everything before the first space in the shorthand: "PC 34:1" -> "PC".
      # STRBEFORE is deliberate: SUBSTR would be 403'd by the WAF (see the gotcha).
      SELECT ?headGroup (COUNT(DISTINCT ?lipid) AS ?nLipids)
      WHERE {
        ?lipid lm:abbrev ?abbrev .
        BIND(STRBEFORE(?abbrev, " ") AS ?headGroup)
        FILTER(?headGroup != "")
      }
      GROUP BY ?headGroup
      ORDER BY DESC(?nLipids)
      LIMIT 15
    verified:
      min_rows: 15
      has_values: ["TG", 6913, "FA", 6206, "CL", 1306]
      date: "2026-09-16"
      note: >
        TG 6,913 / FA 6,206 / ST 2,648 / PC 1,838 / PE 1,474 / CL 1,306 / PG 1,209 / PA 1,191 /
        PS 1,190 / PI 1,189. The CL figure equals category GP1201 exactly — two independent routes,
        same answer.
    teaches: >
      The SECOND way into a lipid class, and the one to reach for when a biologist names the class
      rather than a compound. `lm:abbrev` is the lipidomics shorthand, and `STRBEFORE(?abbrev, " ")`
      splits off the head group that lipidomics result tables actually report. It cross-checks the
      category tree: "CL " gives 1,306 and so does class GP1201, which is how you know neither route is
      quietly dropping rows. Use it to scope a mass search, or to turn a lipidomics table's head-group
      column into LM IDs.
    traps_avoided:
      - "Do NOT reach for `FILTER(CONTAINS(?label, \"cardiolipin\"))` instead — a label keyword search finds only a tiny fraction of the cardiolipins that exist, and looks like a successful answer. The `label_search_low_recall` gotcha owns the measured ratio; do not restate it here, so the two cannot drift apart."
      - say: "This covers only the 34,567 lipids that HAVE a shorthand (66.2%); the other 17,608 have no head group to extract. It is a lipid-CLASS route, not a whole-database census — use the category tree when you need every structure."
        check:
          kind: count
          date: "2026-09-16"
          query: |
            SELECT (COUNT(DISTINCT ?s) AS ?n) WHERE {
              ?s <https://www.lipidmaps.org/ontology/abbrev> ?a .
            }
          expect: {value: 34567, tolerance: 0.02}
      - "Head groups are NOT unique across categories: `PG` is phosphatidylglycerol in the shorthand but also the prefix of every prostaglandin common name (PGE2, PGD2), so `STRSTARTS(?label, \"PG\")` and this head-group split answer different questions."

  - id: mass_window_isobars
    intent: "match an MS peak to candidate lipid species, and see the ambiguity the mass alone leaves"
    question: "Which lipid species have a neutral monoisotopic mass of 759.5778 within 5 ppm?"
    complexity: intermediate
    sparql: |
      PREFIX chebi: <http://purl.obolibrary.org/obo/chebi/>
      PREFIX lm:    <https://www.lipidmaps.org/ontology/>
      # 759.5778 +/- 5 ppm  ->  759.5740 .. 759.5816
      SELECT ?abbrev (COUNT(DISTINCT ?lipid) AS ?nStructures)
      WHERE {
        ?lipid chebi:monoisotopicmass ?mass ;
               lm:abbrev              ?abbrev .
        FILTER(?mass >= 759.5740 && ?mass <= 759.5816)
      }
      GROUP BY ?abbrev
      ORDER BY DESC(?nStructures) ?abbrev
    verified:
      row_count: 2
      has_values: ["PC 34:1", "PE 37:1", 22, 14]
      date: "2026-09-15"
      note: "36 structures across 2 species; the whole window is one formula, C42H82NO8P. 0.8s."
    teaches: >
      The accurate-mass lookup idiom: a numeric window on `chebi:monoisotopicmass`, grouped by
      `lm:abbrev` so the answer comes back as lipid SPECIES rather than as a long list of isomeric
      structures. Widen or narrow the window by changing the two bounds.
    traps_avoided:
      - "Accurate mass does NOT identify a lipid species: this window returns PC 34:1 AND PE 37:1, which share the formula C42H82NO8P exactly and cannot be separated by mass at any resolution. Reporting the top hit as 'the' identification is wrong — carry both forward to MS/MS."
      - "Keep mass a numeric WINDOW, never a GROUP BY key or an equality match: the same formula is stored at two slightly different mass values in 22 cases, and for three deuterated standards the formula itself is wrong while the mass is right (gotcha deuterated_standard_formula_errors)."
      - say: "Requiring `lm:abbrev` restricts the candidate set to the 34,567 lipids that HAVE a shorthand — 66.2% of the database — so in a window where some structures lack one they drop out unannounced. It is NOT costing you anything in THIS window (all 36 structures carry a shorthand, so the abbrev-bearing and unrestricted counts agree exactly), but verify that before trusting the species list on any other mass."
        check:
          kind: ratio
          date: "2026-09-15"
          numerator: |
            SELECT (COUNT(DISTINCT ?lipid) AS ?n) WHERE {
              ?lipid <http://purl.obolibrary.org/obo/chebi/monoisotopicmass> ?mass .
              FILTER(?mass >= 759.5740 && ?mass <= 759.5816)
            }
          denominator: |
            SELECT (COUNT(DISTINCT ?lipid) AS ?n) WHERE {
              ?lipid <http://purl.obolibrary.org/obo/chebi/monoisotopicmass> ?mass ;
                     <https://www.lipidmaps.org/ontology/abbrev> ?a .
              FILTER(?mass >= 759.5740 && ?mass <= 759.5816)
            }
          expect: {ratio: 1.0, tolerance: 0.02}

  - id: enum_by_formula
    intent: enumerate every structure sharing a molecular formula
    question: "How many LIPID MAPS structures have the molecular formula C27H46O?"
    complexity: basic
    sparql: |
      PREFIX chebi: <http://purl.obolibrary.org/obo/chebi/>
      SELECT (COUNT(DISTINCT ?lipid) AS ?n)
      WHERE { ?lipid chebi:formula "C27H46O" . }
    verified: {n: 17, date: "2026-09-15"}
    teaches: >
      `chebi:formula` is a plain Hill-notation string and an exact-match enumeration route in its own
      right (49,849 lipids carry one). Literal matching here is value-based, so the bare `"C27H46O"`
      and `"C27H46O"^^xsd:string` are interchangeable — unlike the Virtuoso-backed endpoints in this
      corpus, where only one form joins.
    traps_avoided:
      - "Formula strings are not normalised for isotopic labelling: deuterated standards appear as separate formulae such as `C42H73D5NO8P`, so an exact match on the unlabelled formula excludes them."
      - "A formula copied from ChEBI or PubChem matches 0 rows for every arsenolipid, because LIPID MAPS writes As last rather than in Hill order (gotcha formula_not_hill_normalised_for_arsenic)."

  - id: xrefs_chebi_swisslipids
    intent: "split the polymorphic owl:equivalentClass into its two target databases"
    question: "What are the ChEBI and SwissLipids equivalents of cholesterol (LMST01010001)?"
    complexity: intermediate
    sparql: |
      PREFIX owl: <http://www.w3.org/2002/07/owl#>
      SELECT ?chebi ?swisslipids
      WHERE {
        VALUES ?lipid { <https://www.lipidmaps.org/rdf/LMST01010001> }
        OPTIONAL { ?lipid owl:equivalentClass ?chebi .
                   FILTER(STRSTARTS(STR(?chebi), "http://purl.obolibrary.org/obo/CHEBI_")) }
        OPTIONAL { ?lipid owl:equivalentClass ?swisslipids .
                   FILTER(STRSTARTS(STR(?swisslipids), "https://swisslipids.org/rdf/SLM_")) }
      }
    verified:
      row_count: 1
      has_values: ["CHEBI_16113", "SLM_000000287"]
      date: "2026-09-15"
    teaches: >
      `owl:equivalentClass` is the ONLY outbound cross-reference predicate and it is POLYMORPHIC —
      it points at ChEBI (14,572 lipids) and SwissLipids (12,559 lipids) with no predicate or
      qualifier distinguishing them. Always filter by target namespace; 3,526 lipids carry both.
    traps_avoided:
      - "An unfiltered `?lipid owl:equivalentClass ?x` returns a mixed bag of ChEBI and SwissLipids IRIs, so downstream code that assumes ChEBI silently receives SLM_ IRIs and finds nothing."
      - "The ChEBI form is the OBO IRI `http://purl.obolibrary.org/obo/CHEBI_16113`, which joins directly to RDF Portal's `chebi` graph. It is NOT the `https://identifiers.org/chebi/CHEBI:16113` form WikiPathways uses — that one needs a rewrite."

  - id: xdb_chebi_labels
    intent: "cross-DB: join LIPID MAPS shorthand to ChEBI names, driven FROM the RDF Portal side"
    question: "What are the ChEBI names of LIPID MAPS lipids that carry a shorthand abbreviation?"
    complexity: cross_db
    endpoint_name: ebi
    sparql: |
      # RUN THIS ON https://rdfportal.org/ebi/sparql (endpoint_name: ebi), NOT on lipidmaps.
      # LIPID MAPS is fetched as the REMOTE side via SERVICE; the ChEBI graph is local to EBI.
      PREFIX owl:  <http://www.w3.org/2002/07/owl#>
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
      SELECT ?lipid ?abbrev ?chebi ?chebiLabel
      WHERE {
        SERVICE <https://lipidmaps.org/sparql> {
          ?lipid owl:equivalentClass ?chebi ;
                 <https://www.lipidmaps.org/ontology/abbrev> ?abbrev .
          FILTER(STRSTARTS(STR(?chebi), "http://purl.obolibrary.org/obo/CHEBI_"))
        }
        GRAPH <http://rdf.ebi.ac.uk/dataset/chebi> { ?chebi rdfs:label ?chebiLabel . }
      }
      ORDER BY ?lipid
      LIMIT 15
    verified:
      min_rows: 15
      has_values: ["LMFA01010001", "FA 16:0", "hexadecanoic acid"]
      date: "2026-09-15"
      note: "15 rows in 9.8s cold from endpoint ebi. LMFA01010001 'FA 16:0' -> CHEBI_15756 'hexadecanoic acid'."
    teaches: >
      Cross-DB work with LIPID MAPS must be driven FROM the RDF Portal endpoint, pulling LIPID MAPS
      in as the remote SERVICE — the reverse direction does not work. `owl:equivalentClass` already
      emits the OBO ChEBI IRI, so the join needs no rewriting, and it is the bridge onward to every
      ChEBI-linked resource on the EBI endpoint.
    traps_avoided:
      - say: "OUTBOUND SERVICE FROM lipidmaps DOES NOT WORK. Every call tried returned HTTP 502 from the Cloudflare gateway after ~60 s — with or without variables bound into the remote block, to RDF Portal (`ebi`) and to IDSM alike — while the same remote pattern answers in under 2 s run directly against that endpoint (2026-09-15). The 502 is the gateway giving up, not a query error; do not debug the SPARQL. Put LIPID MAPS on the SERVICE side, as this example does."
        check:
          kind: error
          date: "2026-09-15"
          expect: {timeout_s: 45}
          query: |
            SELECT ?l WHERE {
              SERVICE <https://rdfportal.org/ebi/sparql> {
                <http://purl.obolibrary.org/obo/CHEBI_16113> <http://www.w3.org/2000/01/rdf-schema#label> ?l
              }
            } LIMIT 1
      - "Running THIS query against the lipidmaps endpoint (instead of ebi) 502s, because it inverts the working direction and the `GRAPH <...chebi>` block matches nothing there."

schema_delta:
  - "`chebi:inchi` (49,882 lipids) holds the full InChI string; `chebi:inchikey` holds the 27-character hashed key and is the practical structure-identity join key to PubChem/ChEBI/MassBank. Both are plain strings; neither is shown in an example that matches on them. The InChIKey is NOT unique: 3 keys are each carried by 2 LM ids (LMPK09000012/13, LMPK12010169/228, LMPK12010142/215, all Polyketides with identical formulas), so a key-to-id lookup can return 2 rows. Use COUNT(DISTINCT) and expect the fan-out."
  - "The category IRI is an opaque number whose digits encode the classification: the FIRST digit is the category (1=FA, 2=GL, 3=GP, 4=SP, 5=ST, 6=PR, 7=SL, 8=PK) and the rest is the LIPID MAPS code, so `category/10103` is FA0103 and `category/81211` is PK1211. The human-readable code appears ONLY inside rdfs:label, as a bracketed suffix ('Unsaturated fatty acids [FA0103]') — there is no separate code predicate to match on. Do NOT extract the digit with SUBSTR: it is blocked by the WAF (gotcha cloudflare_waf_blocks_string_functions). Use a VALUES table of (code, IRI) pairs, matched with STRSTARTS or `=`."
  - "`d<N>` in a label does NOT mean deuterium. A loose `REGEX(?label, \"-d[0-9]\")` over lipids with a formula matches 1,052, of which 907 have no D in the formula at all: 128 phytofuran names (`(9R,12R,15R)-d10-13-PhytoF[13R,16R]`) and sphingoid-base notation (`15-methyl-d16:2`) use the same token. Anchor to `-d[0-9]+$` for genuine deuterated standards: 140 lipids, 139 with D in the formula. The one exception, LMFA03010037, is itself a formula error (gotcha deuterated_standard_formula_errors). 219 lipids carry D in the formula overall."
  - "The two-letter category in the LM id does not always match where the lipid is classified. With the spurious PR->FA01 edge excluded, 57 lipids sit under two top categories, and 19 of those are not under their own id-prefix category at all. Five look like upstream identifier errors rather than dual classification: LMGP01050149-153 carry glycerophospholipid ids but are plain monoacylglycerols with no phosphate (`MG 14:0(13Me)/0:0`, `MG 15:0/0:0`, `MG 18:3(5Y,7Z,17)(2OMe[S],12Me)/0:0`, `MG 13:0(2Me,12Me)/0:0`, `MG 21:1(5Z)(20Me)`) and classify only under GL. Thirteen LMFA ids (juvenile hormone II, gyrinidal, faranal, ingenol mebutate, ...) classify only under PR, and cornudentanone LMFA07010822 only under PK. The other 38 are defensible dual assignments that keep their own category as well (myriocin LMFA01060203 under FA+SP, lanostane LMST01010190 under ST+PR, farnesyl esters under FA+PR). Scope by classification, not by id prefix, when the two disagree."
  - "36 of the 708 category nodes have NO rdfs:label — they are exactly the 36 that have children but no label (607 with children minus 571 labelled-with-children), so the same count holds whichever denominator you start from; see entity_counts, which keeps the three quantities apart. 32 of the 36 still hold lipids (2,592 of them, 5.0%). Joining `?cat rdfs:label ?name` as a plain triple therefore drops those lipids from a classification listing — wrap it in OPTIONAL when the lipids matter more than the category name."

id_join_map:
  stable_anchor: >
    The LIPID MAPS ID, as the IRI `https://www.lipidmaps.org/rdf/LM<CC><NNNNNNNN>` (e.g.
    LMST01010001), where the first two letters after LM are the category (FA/GL/GP/SP/ST/PR/SL/PK).
    The bare accession is the IRI's local name. Secondary keys: `chebi:inchikey` for structure
    identity, and `lm:abbrev` for the lipidomics shorthand — the latter is many-to-one and must not
    be used as an identifier.
  xrefs:
    chebi: >
      `owl:equivalentClass` -> `http://purl.obolibrary.org/obo/CHEBI_<n>` (OBO form, joins directly
      to RDF Portal's `chebi` graph `http://rdf.ebi.ac.uk/dataset/chebi`). 14,572 lipids (27.9% of
      52,175). Namespace-filter it: the same predicate also emits SwissLipids.
      ChEBI IS a TogoMCP database (`database=chebi`, endpoint `ebi`) with its own MIE: read it before
      writing the remote half of any join, and drive the join from `ebi` (see `xdb_chebi_labels`).
      TWO TRAPS. (1) PREDICATE NAMES DO NOT TRANSFER. LIPID MAPS borrows the old ChEBI namespace
      (`chebi:formula`, `chebi:inchikey`, `chebi:monoisotopicmass`), but ChEBI's own RDF on `ebi` moved
      those properties to `chemrof:` (`chemrof:generalized_empirical_formula`,
      `chemrof:inchi_key_string`, `chemrof:monoisotopic_mass`). Writing `chebi:formula` inside the
      `GRAPH <...dataset/chebi>` block returns 0 rows with no error, which is indistinguishable from
      "nothing matched". (2) JOIN ON THE INCHIKEY, NOT THE FORMULA. Over the first 1,500
      equivalentClass pairs by LM id (2026-09-15), the LIPID MAPS `chebi:inchikey` and ChEBI
      `chemrof:inchi_key_string` agree 1,498 times, with 2 stereo-layer disagreements
      (LMFA01020334/CHEBI_139484, LMFA01020332/CHEBI_139485) and 0 skeleton disagreements. Formulas
      disagree systematically for arsenolipids (gotcha formula_not_hill_normalised_for_arsenic).
      FEDERATION-FREE ALTERNATIVE: ChEBI carries the reverse link as a literal,
      `oboInOwl:hasDbXref "lipidmaps:LM<id>"`, on 12,638 terms; that join runs entirely inside `ebi`
      with no SERVICE call. The 14,572 vs 12,638 asymmetry between the two directions is unexplained,
      so check coverage before relying on either as complete.
    swisslipids: >
      `owl:equivalentClass` -> `https://swisslipids.org/rdf/SLM_<n>`. 12,559 lipids (24.1%).
      SwissLipids is NOT on RDF Portal, but it IS a queryable TogoMCP database as of 2026-09-15
      (`database=swisslipids`, https://beta.sparql.swisslipids.org/sparql), so this IRI is a real
      join target: it is byte-identical to that database's own subject IRIs and needs no rewrite.
      The link is near-symmetric but not equal — SwissLipids points back at 12,117 LIPID MAPS IRIs
      via `oboInOwl:hasDbXref` (NOT `owl:equivalentClass`, and NOT `rdfs:seeAlso`, which is
      Wikidata-only there). Cross-endpoint, so it needs SERVICE or two calls, not a GRAPH join.
    wikipathways: >
      NOT emitted by LIPID MAPS — the link exists only in the OTHER direction. WikiPathways carries
      `owl:sameAs https://www.lipidmaps.org/rdf/LM<id>` on its metabolite nodes (plus
      `wp:bdbLipidMaps -> https://identifiers.org/lipidmaps/LM<id>`, 2,466 triples), so join from a
      WikiPathways query. Its pathway titles use `dc:title`
      (http://purl.org/dc/elements/1.1/title), NOT `dcterms:title` — the dcterms form returns 0 rows.
  bridged_via_togoid:
    - "pubchem, hmdb, kegg and chemspider carry no equivalentClass link here; bridge them with togoid_convertId from the LIPID MAPS accession, or via the InChIKey."
