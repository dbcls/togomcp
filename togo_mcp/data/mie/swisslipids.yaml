mie_spec: 3
database: swisslipids

discovery:
  title: SwissLipids
  description: >
    Expert-curated lipid reference knowledge base of ~778,000 lipids arranged in a six-level
    classification hierarchy, with molecular formula, charge, SMILES/InChI, fatty-acid
    composition by sn-position, and cross-references to ChEBI, LIPID MAPS, HMDB and MetaNetX.
  keywords:
    - lipid
    - lipidomics
    - fatty acid
    - glycerophospholipid
    - sphingolipid
    - sterol
    - metabolite
    - molecular formula
    - smiles
    - inchikey
    - sn-position
    - lipid hierarchy
    - mass spectrometry
  categories:
    - compound
    - ontology

endpoint: https://beta.sparql.swisslipids.org/sparql
base_uri: https://swisslipids.org/rdf/

graphs:
  primary: https://sparql.swisslipids.org/swisslipids
  supporting: []
  co_hosted:
    probed_clean: >
      2g probe run 2026-09-15 — NO re-declaration found. Reverse probe (?p unbound, no type
      filter) over 12 IRIs covering all legs: two representative lipids, the rank vocabulary
      terms (SLM_Class, SLM_Isomeric_Subspecies), the sn1 position term, and every outbound hub
      (ChEBI, HMDB, MetaNetX, LIPID MAPS, PubMed, Wikidata). All 25 predicate/graph rows landed
      in `swisslipids`; zero triples in either `.well-known` graph for any probed node. No other
      DATABASE shares this endpoint, so there is no co-tenant to defend against.
    .well-known/void: >
      1,171 triples of VoID service description. NOT a data graph, but it is unioned into an
      unpinned query — and its VoID triple total (25,999,422) DISAGREES with the sum of the
      actual graph counts (25,999,926), so do not quote it as the database size.
    .well-known/sparql-examples: >
      386 triples — the maintainers' 24 curated SHACL-wrapped example queries. Useful to read
      (`sh:select` / `rdfs:comment`), but 19 of its triples are `rdfs:label`, so an UNPINNED
      `?s rdfs:label ?l` returns 780,408 rows against 780,389 pinned: +19 foreign rows of
      query metadata, every one well-formed, so DISTINCT cannot spot them. Scope bleed, not
      duplication — pin the data graph.

