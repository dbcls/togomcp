global_gotchas:
  - id: anytime_timeout_truncates_silently
    say: >
      Queries are cut off at 30 s, and a plain SELECT that hits the limit returns a PARTIAL result
      with HTTP 200, no error and no marker header: the same co-expression triangle SELECT returned
      291,381 rows and then 292,993 on a re-run, both stopping part-way through the Mp1g genes. An
      aggregate over the same join fails loudly instead (HTTP 500, "S1TAT ... ANYTIME timeout").
      Rows cap at 1,000,000 (flagged only by an X-SPARQL-MaxRows header), above every entity class
      here; the 10,000-row cap of earlier versions is gone. FIX: a SELECT that takes ~30 s is
      truncated, not complete — anchor it on an IRI, or run the COUNT first, which fails rather
      than undercounts.
    check:
      kind: error
      date: "2026-11-09"
      expect: {timeout_s: 60}
      query: |
        PREFIX mpo: <http://marchantia.info/ontology/>
        SELECT (COUNT(*) AS ?n)
        FROM <http://marchantia.info/rdf/graph/MpTak_v7.1r2/function>
        WHERE { ?e1 mpo:gene1 ?a ; mpo:gene2 ?b .
                ?e2 mpo:gene1 ?b ; mpo:gene2 ?c .
                ?e3 mpo:gene1 ?a ; mpo:gene2 ?c }

  - id: aggregate_plus_order_by_regroups
    say: >
      Adding ORDER BY to an aggregate that has no GROUP BY silently changes the question: Virtuoso
      implicitly groups by the ORDER BY variable. `SELECT (COUNT(DISTINCT ?g) AS ?n) WHERE { ?g a
      mpo:Gene }` returns 1 row of 18,010; the same query plus `ORDER BY ?g` returns one row per
      gene, each reading 1, so the first row says 1 instead of 18,010 — no error. FIX: never put
      ORDER BY on an ungrouped aggregate; for per-group counts, write the GROUP BY explicitly.
    check:
      kind: count
      date: "2026-11-09"
      query: |
        PREFIX mpo: <http://marchantia.info/ontology/>
        SELECT (COUNT(DISTINCT ?g) AS ?n)
        FROM <http://marchantia.info/rdf/graph/MpTak_v7.1r2/function>
        WHERE { ?g a mpo:Gene }
        ORDER BY ?g
        LIMIT 1
      expect: {value: 1, tolerance: 0.001}

  - id: mandatory_single_graph_pin
    say: >
      This endpoint serves ONE database, yet its function and annotation graphs re-declare
      dcterms:identifier, rdfs:label, skos:prefLabel, skos:altLabel and the gene web page on the
      SAME gene IRIs. The canonical lookup `?g a mpo:Gene ; dcterms:identifier ?id` returns 36,018
      rows unpinned versus 18,010 pinned (x2.00) in under a second, so nothing signals the error; an
      unpinned query also drags in Virtuoso's system graphs (virtrdf#, DAV). FIX: pin exactly ONE
      graph with FROM/GRAPH — the function graph for gene/function/orthology/expression/literature,
      the annotation graph for coordinates, exons, CDS, transcripts and proteins. SELECT DISTINCT
      only masks the row count and also collapses genuinely multi-valued predicates such as
      mpo:hasGOTerm.
    check:
      kind: ratio
      date: "2026-11-09"
      unpinned: |
        PREFIX mpo: <http://marchantia.info/ontology/>
        PREFIX dcterms: <http://purl.org/dc/terms/>
        SELECT (COUNT(*) AS ?n) WHERE { ?gene a mpo:Gene ; dcterms:identifier ?id }
      pinned: |
        PREFIX mpo: <http://marchantia.info/ontology/>
        PREFIX dcterms: <http://purl.org/dc/terms/>
        SELECT (COUNT(*) AS ?n)
        FROM <http://marchantia.info/rdf/graph/MpTak_v7.1r2/function>
        WHERE { ?gene a mpo:Gene ; dcterms:identifier ?id }
      expect: {ratio: 2.0, tolerance: 0.05}

  - id: labels_are_en_identifiers_are_plain
    say: >
      Two OPPOSITE literal forms sit on the same subject in the same graph, and both fail silently.
      Label-family literals — rdfs:label, skos:prefLabel, skos:altLabel — are @en langStrings:
      `skos:prefLabel "MpCEN1"` and `"MpCEN1"^^xsd:string` both return 0 rows; only `"MpCEN1"@en`
      matches. Identifier-family literals — dcterms:identifier, mpo:v3Identifier, mpo:pmid — are
      PLAIN: `dcterms:identifier "Mp1g00710"^^xsd:string` returns 0 rows and only the bare
      `"Mp1g00710"` matches, even though DATATYPE() reports xsd:string for it. The two families do
      not join to each other either: an @en altLabel never equals the plain v3Identifier holding the
      same string. FIX: `@en` for labels, bare for identifiers, and FILTER(STR(?x) = STR(?y))
      whenever the two families meet.
    check:
      kind: zero_rows
      date: "2026-11-09"
      query: |
        PREFIX skos: <http://www.w3.org/2004/02/skos/core#>
        SELECT ?g FROM <http://marchantia.info/rdf/graph/MpTak_v7.1r2/function>
        WHERE { ?g skos:prefLabel "MpCEN1" } LIMIT 1

  - id: numeric_order_by_sorts_lexically
    say: >
      ORDER BY on a numeric literal sorts it as a STRING, silently. Every ranking predicate is
      affected — mpo:pcc, mpo:mr, mpo:meanTPM, mpo:foldVsMedian (xsd:double) and mpo:hrr
      (xsd:integer). `ORDER BY DESC(?fold)` puts 999.9972 on top while the true maximum is
      93207.1047, and `ORDER BY DESC(?hrr)` tops out at 99 when the real ceiling is 200. It is
      invisible on mpo:pcc, whose values are all 0.x and sort the same either way. MAX()/MIN()/AVG()
      are NOT affected. FIX: cast in the sort key — `ORDER BY DESC(xsd:double(?fold))`, `ORDER BY
      xsd:integer(?hrr)`. A cast inside FILTER stays valid when ORDER BY is added.
    check:
      kind: count
      date: "2026-11-09"
      query: |
        PREFIX mpo: <http://marchantia.info/ontology/>
        SELECT ?f FROM <http://marchantia.info/rdf/graph/MpTak_v7.1r2/function>
        WHERE { ?e mpo:foldVsMedian ?f } ORDER BY DESC(?f) LIMIT 1
      expect: {value: 999.9972, tolerance: 0.001}

  - id: service_federation_refused
    say: >
      SERVICE is refused outright with HTTP 500 and "Virtuoso 42000 Error SQ070:SECURITY: Must have
      select privileges on view DB.DBA.SPARQL_SINV_2" — a permissions decision, so retrying never
      helps and a federated query CANNOT be written from here. FIX: take the IRIs this endpoint
      emits (UniProt accessions, PMIDs, GO/Pfam/KEGG terms, PO/PECO terms) into a SECOND, separate
      run_sparql call against the other database.
    check:
      kind: error
      date: "2026-11-09"
      expect: {timeout_s: 60}
      query: |
        SELECT * WHERE {
          SERVICE <https://rdfportal.org/sib/sparql> { ?s ?p ?o }
        } LIMIT 1

  - id: external_term_names_not_rdfs_label
    say: >
      External terms DO carry a name locally, but never on rdfs:label, so a label lookup returns 0
      rows and reads as "unnamed". GO terms carry it on dcterms:description (plain, "protein kinase
      activity") with a CURIE dcterms:identifier ("GO:0004672"); Pfam, KEGG Orthology and KOG IRIs
      on skos:prefLabel @en. rdfs:label is used only by the PO/PECO terms reached by skos:exactMatch
      (obo:PO_0025126 -> "archegonium"), their OBO ancestors, and mpo:Genome nodes.
    check:
      kind: absent
      date: "2026-11-09"
      query: |
        PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
        SELECT ?s WHERE {
          GRAPH ?g { ?s rdfs:label ?l }
          FILTER(STRSTARTS(STR(?s), "http://purl.obolibrary.org/obo/GO_")
                 || STRSTARTS(STR(?s), "http://identifiers.org/"))
        } LIMIT 1

examples:
  - id: gene_by_symbol
    intent: resolve a gene symbol — primary OR secondary — to its gene IRI and functional summary
    question: "What is the MpCEN1 gene — its gene ID, product and what is known about it?"
    complexity: basic
    sparql: |
      PREFIX mpo: <http://marchantia.info/ontology/>
      PREFIX skos: <http://www.w3.org/2004/02/skos/core#>
      PREFIX dcterms: <http://purl.org/dc/terms/>
      SELECT DISTINCT ?gene ?id ?symbol ?v3id ?product ?summary
      FROM <http://marchantia.info/rdf/graph/MpTak_v7.1r2/function>
      WHERE {
        { ?gene skos:prefLabel "MpCEN1"@en } UNION { ?gene skos:altLabel "MpCEN1"@en }
        ?gene a mpo:Gene ; dcterms:identifier ?id .
        OPTIONAL { ?gene skos:prefLabel     ?symbol }
        OPTIONAL { ?gene mpo:v3Identifier   ?v3id }
        OPTIONAL { ?gene mpo:product        ?product }
        OPTIONAL { ?gene mpo:functionSummary ?summary }
      }
    verified:
      row_count: 1
      date: "2026-11-09"
      has_values: ["Mp1g00710", "MpCEN1", "centrin"]
    teaches: >
      Search a symbol across BOTH skos:prefLabel and skos:altLabel (@en); the stable gene IRI is
      http://marchantia.info/rdf/gene/<id> and dcterms:identifier repeats the id as a PLAIN literal.
    traps_avoided:
      - say: >
          Searching prefLabel alone misses the 117 genes whose name you have is their SECOND symbol —
          "MpHD9" returns nothing on prefLabel but resolves to Mp1g01010 (prefLabel MpPINTOX) on
          altLabel. altLabel also carries the legacy v3 Mapoly id for 17,210 genes, so a symbol
          search over it can match Mapoly ids too (harmless).
        check:
          kind: zero_rows
          date: "2026-11-09"
          query: |
            PREFIX skos: <http://www.w3.org/2004/02/skos/core#>
            SELECT ?g FROM <http://marchantia.info/rdf/graph/MpTak_v7.1r2/function>
            WHERE { ?g skos:prefLabel "MpHD9"@en } LIMIT 1
      - say: >
          skos:prefLabel is POLYMORPHIC. Of its 15,941 subjects in the function graph only 3,237 are
          genes; the rest are Pfam (4,438), KEGG Orthology (4,064) and KOG (3,780) IRIs whose
          prefLabel is a functional DESCRIPTION ("EF-hand domain pair"), plus 422 vocabulary
          concepts and schemes. An unconstrained `?s skos:prefLabel ?sym` mixes gene symbols with
          domain names. FIX: constrain with `?gene a mpo:Gene`, as above.
        check:
          kind: count
          date: "2026-11-09"
          query: |
            PREFIX mpo: <http://marchantia.info/ontology/>
            PREFIX skos: <http://www.w3.org/2004/02/skos/core#>
            SELECT (COUNT(DISTINCT ?s) AS ?n)
            FROM <http://marchantia.info/rdf/graph/MpTak_v7.1r2/function>
            WHERE { ?s a mpo:Gene ; skos:prefLabel ?l }
          expect: {value: 3237, tolerance: 0.02}
      - "Do not use rdfs:label for a symbol: in the annotation graph it holds the symbol when there is one and the bare gene ID otherwise (Mp1g00710 -> \"MpCEN1\", Mp1g00070 -> \"Mp1g00070\"), so it is neither a reliable symbol nor identifier."

  - id: gene_location
    intent: read a gene's chromosome, coordinates and strand out of the FALDO scaffold
    question: "Where on the genome is MpCEN1 (Mp1g00710), and on which strand?"
    complexity: intermediate
    sparql: |
      PREFIX mpo: <http://marchantia.info/ontology/>
      PREFIX faldo: <http://biohackathon.org/resource/faldo#>
      PREFIX obo: <http://purl.obolibrary.org/obo/>
      PREFIX dcterms: <http://purl.org/dc/terms/>
      SELECT ?id ?chr ?min ?max ?strand
      FROM <http://marchantia.info/rdf/graph/MpTak_v7.1r2/annotation>
      WHERE {
        ?gene a obo:SO_0001217 ;
              dcterms:identifier ?id ;
              faldo:location ?region .
        ?region faldo:reference/dcterms:identifier ?chr ;
                mpo:minPosition ?min ;
                mpo:maxPosition ?max ;
                faldo:begin ?beginPos .
        BIND(IF(EXISTS { ?beginPos a faldo:ReverseStrandPosition }, "-", "+") AS ?strand)
        VALUES ?id { "Mp1g00710" }
      }
    verified:
      row_count: 1
      date: "2026-11-09"
      has_values: ["Mp1g00710", "chr1", 635664, 638217, "-"]
    teaches: >
      Coordinates come from mpo:minPosition / mpo:maxPosition on the faldo:Region —
      strand-independent integers — and strand is a TYPE on the position node
      (faldo:ReverseStrandPosition), read with the EXISTS test above rather than a property value.
    traps_avoided:
      - say: "Coordinates exist ONLY in the annotation graph. Pinning the function graph here returns 0 rows — the gene IRI is the same, the location triples are not."
        check:
          kind: zero_rows
          date: "2026-11-09"
          query: |
            PREFIX faldo: <http://biohackathon.org/resource/faldo#>
            PREFIX obo: <http://purl.obolibrary.org/obo/>
            SELECT ?region FROM <http://marchantia.info/rdf/graph/MpTak_v7.1r2/function>
            WHERE { ?gene a obo:SO_0001217 ; faldo:location ?region } LIMIT 1
      - "Every faldo:Region and faldo:Position is a real IRI, not a blank node — select and join them directly."
      - "A position node carries TWO rdf:type values (faldo:ExactPosition plus the strand class), so binding `?pos a ?type` instead of the EXISTS test above returns each gene twice."

  - id: genes_in_window
    intent: find every feature overlapping a genomic interval, including minus-strand ones
    question: "Which protein-coding genes overlap chr1:630,000-640,000?"
    complexity: intermediate
    sparql: |
      PREFIX mpo: <http://marchantia.info/ontology/>
      PREFIX faldo: <http://biohackathon.org/resource/faldo#>
      PREFIX obo: <http://purl.obolibrary.org/obo/>
      PREFIX dcterms: <http://purl.org/dc/terms/>
      SELECT ?id ?min ?max ?strand
      FROM <http://marchantia.info/rdf/graph/MpTak_v7.1r2/annotation>
      WHERE {
        ?gene a obo:SO_0001217 ;
              dcterms:identifier ?id ;
              faldo:location ?region .
        ?region faldo:reference <http://marchantia.info/rdf/MpTak_v7.1r2/sequence/chr1> ;
                mpo:minPosition ?min ;
                mpo:maxPosition ?max ;
                faldo:begin ?beginPos .
        BIND(IF(EXISTS { ?beginPos a faldo:ReverseStrandPosition }, "-", "+") AS ?strand)
        FILTER(?min <= 640000 && ?max >= 630000)
      }
      ORDER BY ?min
    verified:
      row_count: 3
      date: "2026-11-09"
      has_values: ["Mp1g00700", "Mp1g00710", "Mp1g00720"]
    teaches: >
      Overlap is `?min <= windowEnd && ?max >= windowStart` against mpo:minPosition /
      mpo:maxPosition. Chromosome IRIs are the fixed set
      http://marchantia.info/rdf/MpTak_v7.1r2/sequence/chr1-chr8, chrU, chrV — the assembly version
      is IN the IRI, so a query written for an older release finds nothing. Bind the chromosome on
      the REGION, since faldo:reference is asserted on the position nodes too.
    traps_avoided:
      - say: >
          Writing the range against faldo:begin / faldo:end instead silently loses minus-strand
          features. FALDO puts begin at the 5' end, so on the minus strand begin > end — MpCEN1 has
          begin 638217, end 635664 — and `?begin <= X && ?end >= Y` can never hold for a point there
          and drops every boundary-straddling gene for a window. 9,024 of the 18,008 genes (50.1%)
          are on the minus strand. On this window: min/max finds 3 genes, begin/end finds 2.
        check:
          kind: zero_rows
          date: "2026-11-09"
          query: |
            PREFIX faldo: <http://biohackathon.org/resource/faldo#>
            SELECT ?gene FROM <http://marchantia.info/rdf/graph/MpTak_v7.1r2/annotation>
            WHERE {
              BIND(<http://marchantia.info/rdf/gene/Mp1g00710> AS ?gene)
              ?gene faldo:location ?r .
              ?r faldo:begin/faldo:position ?b ; faldo:end/faldo:position ?e .
              FILTER(?b <= 636000 && ?e >= 636000)
            } LIMIT 1
      - "Comparison operators DO work numerically on these xsd:integer values, so the FILTER range above is safe; `ORDER BY ?min` is not once coordinates differ in digit count (see numeric_order_by_sorts_lexically) — cast the sort key if the ordering matters."

  - id: transcript_structure
    intent: reconstruct a transcript's exons, CDS segments and UTRs in 5'->3' order
    question: "What is the exon and CDS structure of transcript Mp1g00710.1, with reading-frame phases?"
    complexity: advanced
    sparql: |
      PREFIX mpo: <http://marchantia.info/ontology/>
      PREFIX so:  <http://purl.obolibrary.org/obo/so#>
      PREFIX sio: <http://semanticscience.org/resource/>
      PREFIX obo: <http://purl.obolibrary.org/obo/>
      PREFIX faldo: <http://biohackathon.org/resource/faldo#>
      PREFIX dcterms: <http://purl.org/dc/terms/>
      SELECT ?part ?rank ?id ?min ?max ?phase
      FROM <http://marchantia.info/rdf/graph/MpTak_v7.1r2/annotation>
      WHERE {
        ?tx so:transcribed_from <http://marchantia.info/rdf/gene/Mp1g00710> ;
            dcterms:identifier "Mp1g00710.1" .
        {
          ?tx sio:SIO_000974 ?item .
          ?item sio:SIO_000628 ?seg ; sio:SIO_000300 ?rank .
          BIND("exon" AS ?part)
        } UNION {
          ?tx mpo:hasCds ?cds .
          ?cds sio:SIO_000974 ?item2 .
          ?item2 sio:SIO_000628 ?seg ; sio:SIO_000300 ?rank .
          ?seg mpo:phase ?phase .
          BIND("cds_segment" AS ?part)
        } UNION {
          ?tx mpo:hasUtrSegment ?seg .
          ?seg a ?utrType .
          BIND(IF(?utrType = obo:SO_0000204, "utr_5prime", "utr_3prime") AS ?part)
        }
        ?seg dcterms:identifier ?id ; faldo:location ?r .
        ?r mpo:minPosition ?min ; mpo:maxPosition ?max .
      }
      ORDER BY ?part ?rank
    verified:
      row_count: 16
      date: "2026-11-09"
      has_values: ["Mp1g00710.1.exon1", "Mp1g00710.1.cds1"]
    teaches: >
      The three component series hang off the transcript by THREE DIFFERENT predicates — exons by
      obo:BFO_0000051, CDS by mpo:hasCds, UTRs by mpo:hasUtrSegment — and rank comes from an
      intermediate SIO node (mpo/sio:SIO_000974 -> SIO_001261 item -> SIO_000628 target +
      SIO_000300 integer rank), needed because SIO_000300 is an owl:FunctionalProperty.
    traps_avoided:
      - say: >
          Do not walk all three series with obo:BFO_0000051: on the transcript that predicate
          reaches EXONS ONLY (7 for Mp1g00710.1, all obo:SO_0000147). CDS (mpo:cdsOf / hasCds) and
          UTRs (mpo:utrSegmentOf / hasUtrSegment) have their own predicates so that the three
          overlapping partitions of the same span are not double- or triple-counted.
        check:
          kind: count
          date: "2026-11-09"
          query: |
            PREFIX obo: <http://purl.obolibrary.org/obo/>
            SELECT (COUNT(DISTINCT ?type) AS ?n)
            FROM <http://marchantia.info/rdf/graph/MpTak_v7.1r2/annotation>
            WHERE { <http://marchantia.info/rdf/transcript/Mp1g00710.1> obo:BFO_0000051 ?part .
                    ?part a ?type }
          expect: {value: 1, tolerance: 0.001}
      - "Rank is transcript order (5'->3'), NOT coordinate order: MpCEN1 is minus-strand, so its exon 1 sits at the HIGHEST coordinates (637779-638217) and exon 7 at the lowest (635664-636193). Sorting by ?min reverses the biological order on half the genome."
      - "mpo:phase is the GFF3 column-8 value, offset by one from INSDC /codon_start (codon_start = phase + 1) — do not pass it straight into a tool that expects the INSDC convention."
      - say: "obo:SO_0000316 (22,249) is the whole CDS; obo:SO_0000851 CDS_region (123,468) is the per-exon segment that carries mpo:phase. Counting SO_0000851 is not counting coding genes."
        check:
          kind: count
          date: "2026-11-09"
          query: |
            PREFIX obo: <http://purl.obolibrary.org/obo/>
            SELECT (COUNT(DISTINCT ?s) AS ?n)
            FROM <http://marchantia.info/rdf/graph/MpTak_v7.1r2/annotation>
            WHERE { ?s a obo:SO_0000851 }
          expect: {value: 123468, tolerance: 0.02}

  - id: coexpression_partners
    intent: retrieve a gene's co-expression neighbours from a ONE-DIRECTIONAL edge table
    question: "Which genes are co-expressed with MpCEN1, and how strongly?"
    complexity: intermediate
    sparql: |
      PREFIX mpo: <http://marchantia.info/ontology/>
      PREFIX skos: <http://www.w3.org/2004/02/skos/core#>
      PREFIX dcterms: <http://purl.org/dc/terms/>
      PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>
      SELECT ?partnerId ?partnerSymbol ?pcc ?hrr
      FROM <http://marchantia.info/rdf/graph/MpTak_v7.1r2/function>
      WHERE {
        BIND(<http://marchantia.info/rdf/gene/Mp1g00710> AS ?gene)
        { ?edge mpo:gene1 ?gene ; mpo:gene2 ?partner }
        UNION
        { ?edge mpo:gene2 ?gene ; mpo:gene1 ?partner }
        ?edge mpo:pcc ?pcc ; mpo:hrr ?hrr .
        ?partner dcterms:identifier ?partnerId .
        OPTIONAL { ?partner skos:prefLabel ?partnerSymbol }
      }
      ORDER BY xsd:integer(?hrr)
      LIMIT 10
    verified:
      min_rows: 10
      date: "2026-11-09"
      has_values: ["Mp1g26930"]
    teaches: >
      Each mpo:CoexpressionEdge is stored ONCE, with the two genes sorted into mpo:gene1 / mpo:gene2
      by identifier, so every neighbour query needs both directions — UNION with the gene bound to an
      IRI, or the alternation `mpo:gene1|mpo:gene2` when you only need the edge and not the partner.
    traps_avoided:
      - say: >
          Querying only mpo:gene1 silently returns a fraction of the neighbourhood: MpPWWP3 has 200
          edges of which just 5 have it as gene1, a 97.5% loss, and 780 of the 17,445 genes that
          carry any edge appear ONLY as gene2, so for those the naive query returns exactly 0 and
          reads as "not co-expressed with anything".
        check:
          kind: ratio
          date: "2026-11-09"
          numerator: |
            PREFIX mpo: <http://marchantia.info/ontology/>
            PREFIX skos: <http://www.w3.org/2004/02/skos/core#>
            SELECT (COUNT(*) AS ?n)
            FROM <http://marchantia.info/rdf/graph/MpTak_v7.1r2/function>
            WHERE { ?g skos:prefLabel "MpPWWP3"@en . ?e mpo:gene1 ?g }
          denominator: |
            PREFIX mpo: <http://marchantia.info/ontology/>
            PREFIX skos: <http://www.w3.org/2004/02/skos/core#>
            SELECT (COUNT(*) AS ?n)
            FROM <http://marchantia.info/rdf/graph/MpTak_v7.1r2/function>
            WHERE { ?g skos:prefLabel "MpPWWP3"@en . ?e mpo:gene1|mpo:gene2 ?g }
          expect: {ratio: 0.025, tolerance: 0.35}
      - say: "The UNION form is NOT slow: 0.02s with the gene bound (twice), and the unanchored COUNT checked here returns 1,273,634 (each edge once per direction) in 0.08s. The metadata graph's note that UNION is \"extremely slow\" does not reproduce."
        check:
          kind: count
          date: "2026-11-09"
          query: |
            PREFIX mpo: <http://marchantia.info/ontology/>
            SELECT (COUNT(*) AS ?n)
            FROM <http://marchantia.info/rdf/graph/MpTak_v7.1r2/function>
            WHERE { { ?e mpo:gene1 ?a ; mpo:gene2 ?b } UNION { ?e mpo:gene2 ?a ; mpo:gene1 ?b } }
          expect: {value: 1273634, tolerance: 0.02}
      - "The edge table is PRUNED, not complete: only pairs with HRR <= 200 and both ends on known genes are stored, so an absent edge means \"not in the top 200 mutual ranks\", never \"correlation measured as low\"."
      - "The xsd:integer() cast in ORDER BY is load-bearing — see numeric_order_by_sorts_lexically."

  - id: enum_tissue_enriched
    intent: enumerate ALL genes enriched in a tissue via the controlled-vocabulary IRI
    question: "Which genes are enriched in archegonia?"
    complexity: basic
    sparql: |
      PREFIX mpo: <http://marchantia.info/ontology/>
      SELECT (COUNT(DISTINCT ?gene) AS ?n)
      FROM <http://marchantia.info/rdf/graph/MpTak_v7.1r2/function>
      WHERE {
        ?cond mpo:tissue <http://marchantia.info/rdf/vocab/tissue/archegonia> .
        ?enr  mpo:refCondition ?cond ;
              mpo:refGene ?gene .
      }
    verified: {n: 2965, date: "2026-11-09"}
    teaches: >
      Expression enrichment is reached through the CONDITION, not the gene: pick a vocabulary IRI
      (mpo:tissue / strain / sex / stage / mutation / administration / infection), collect the
      conditions carrying it, then follow mpo:refCondition <- mpo:ConditionEnrichedGene -> mpo:refGene.
      Discover the IRIs with `?c skos:inScheme <http://marchantia.info/rdf/vocab/scheme/tissue>` —
      407 concepts across mutation (206), stage (61), administration (47), tissue (36), strain (29),
      infection (13), growth_protocol (12) and sex (3).
    traps_avoided:
      - say: >
          COUNT(DISTINCT ?gene) is mandatory: a tissue term maps to SEVERAL conditions (archegonia
          has 4), so the same gene returns once per condition — 7,058 raw rows against 2,965 real
          genes, a x2.38 overcount.
        check:
          kind: ratio
          date: "2026-11-09"
          numerator: |
            PREFIX mpo: <http://marchantia.info/ontology/>
            SELECT (COUNT(*) AS ?n)
            FROM <http://marchantia.info/rdf/graph/MpTak_v7.1r2/function>
            WHERE { ?c mpo:tissue <http://marchantia.info/rdf/vocab/tissue/archegonia> .
                    ?e mpo:refCondition ?c ; mpo:refGene ?g }
          denominator: |
            PREFIX mpo: <http://marchantia.info/ontology/>
            SELECT (COUNT(DISTINCT ?g) AS ?n)
            FROM <http://marchantia.info/rdf/graph/MpTak_v7.1r2/function>
            WHERE { ?c mpo:tissue <http://marchantia.info/rdf/vocab/tissue/archegonia> .
                    ?e mpo:refCondition ?c ; mpo:refGene ?g }
          expect: {ratio: 2.38, tolerance: 0.05}
      - "Do not text-match on mpo:tissueLabel or the condition's dcterms:title: those are the source studies' free-text descriptions, whereas the mpo:tissue IRI is the normalised term."
      - "The table is SPARSE by design — only (condition, gene) pairs that passed the enrichment threshold are stored (mean TPM >= 10 and >= 4x the cross-condition median, readable from prov:wasGeneratedBy). There is no dense expression matrix, so absence is not evidence of low expression."
      - say: "48 of the 850 conditions rest on a single sequencing experiment (mpo:runCount 1), so their enrichment has no replicate behind it — check runCount before quoting a fold."
        check:
          kind: count
          date: "2026-11-09"
          query: |
            PREFIX mpo: <http://marchantia.info/ontology/>
            SELECT (COUNT(DISTINCT ?c) AS ?n)
            FROM <http://marchantia.info/rdf/graph/MpTak_v7.1r2/function>
            WHERE { ?c a mpo:Condition ; mpo:runCount 1 }
          expect: {value: 48, tolerance: 0.02}

  - id: enum_po_term
    intent: enumerate enriched genes by a Plant Ontology / PECO term instead of a local IRI
    question: "Which genes are enriched in the archegonium (PO:0025126)?"
    complexity: basic
    sparql: |
      PREFIX mpo: <http://marchantia.info/ontology/>
      PREFIX skos: <http://www.w3.org/2004/02/skos/core#>
      SELECT (COUNT(DISTINCT ?gene) AS ?n)
      FROM <http://marchantia.info/rdf/graph/MpTak_v7.1r2/function>
      WHERE {
        ?concept skos:exactMatch <http://purl.obolibrary.org/obo/PO_0025126> .
        ?cond mpo:tissue ?concept .
        ?enr  mpo:refCondition ?cond ;
              mpo:refGene ?gene .
      }
    verified: {n: 2965, date: "2026-11-09"}
    teaches: >
      skos:exactMatch bridges the local condition vocabulary to Plant Ontology and PECO, so a
      question posed in ontology terms needs no MarpolBase IRIs — and the answer agrees exactly with
      the local-IRI route (2,965 both ways).
    traps_avoided:
      - say: >
          Coverage is partial and silent: only 76 of the 407 vocabulary concepts carry a
          skos:exactMatch (47 PECO + 29 PO), so an ontology-term query returns 0 rows for most
          attributes, indistinguishable from "no genes". Check the mapping exists first, and fall
          back to the mpo:tissue IRI route.
        check:
          kind: count
          date: "2026-11-09"
          query: |
            PREFIX skos: <http://www.w3.org/2004/02/skos/core#>
            SELECT (COUNT(DISTINCT ?c) AS ?n)
            FROM <http://marchantia.info/rdf/graph/MpTak_v7.1r2/function>
            WHERE { ?c a skos:Concept ; skos:exactMatch ?m }
          expect: {value: 76, tolerance: 0.02}
      - say: "The growth_protocol scheme (12 concepts, 9 of them mapped to PECO) is referenced by NO condition — there is no condition predicate for it — so a PECO growth-protocol term returns 0 genes however it is written."
        check:
          kind: zero_rows
          date: "2026-11-09"
          query: |
            PREFIX skos: <http://www.w3.org/2004/02/skos/core#>
            SELECT ?s FROM <http://marchantia.info/rdf/graph/MpTak_v7.1r2/function>
            WHERE { ?c skos:inScheme <http://marchantia.info/rdf/vocab/scheme/growth_protocol> .
                    ?s ?p ?c } LIMIT 1
      - "`?c a skos:Concept` alone is not the vocabulary: 522 subjects carry that type, of which 407 are condition-attribute terms, 7 belong to the GeneRole/EvidenceType schemes and 108 are the PO/PECO targets plus imported OBO/BFO ancestors. Constrain with skos:inScheme <.../vocab/scheme/*> to get the vocabulary itself."

  - id: enum_go_term
    intent: enumerate ALL genes carrying a GO term, with their symbols and the term's name
    question: "Which Marchantia genes have protein kinase activity (GO:0004672)?"
    complexity: basic
    sparql: |
      PREFIX mpo: <http://marchantia.info/ontology/>
      PREFIX obo: <http://purl.obolibrary.org/obo/>
      PREFIX skos: <http://www.w3.org/2004/02/skos/core#>
      PREFIX dcterms: <http://purl.org/dc/terms/>
      SELECT ?id ?symbol ?goName
      FROM <http://marchantia.info/rdf/graph/MpTak_v7.1r2/function>
      WHERE {
        ?gene mpo:hasGOTerm obo:GO_0004672 ;
              dcterms:identifier ?id .
        obo:GO_0004672 dcterms:description ?goName .
        OPTIONAL { ?gene skos:prefLabel ?symbol }
      }
      ORDER BY ?id
      LIMIT 25
    verified:
      min_rows: 25
      date: "2026-11-09"
      has_values: ["Mp1g00210", "protein kinase activity"]
    teaches: >
      mpo:hasGOTerm points straight at the bare obo:GO_NNNNNNN IRI, so GO enumeration is a one-hop
      typed-predicate query — no text search and no ontology join. The term's name rides along on
      dcterms:description (see external_term_names_not_rdfs_label).
    traps_avoided:
      - say: >
          The GO annotation is FLAT: no subClassOf closure is loaded for GO, so obo:GO_0004672
          returns only genes annotated to that exact term, never to its descendants. To enumerate a
          GO subtree, expand the term set elsewhere (OLS4, or run_sparql against database=go) and
          feed it back as a VALUES block. SO, by contrast, IS traversable here with
          rdfs:subClassOf*.
        check:
          kind: absent
          date: "2026-11-09"
          query: |
            PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
            PREFIX obo: <http://purl.obolibrary.org/obo/>
            SELECT ?sub WHERE {
              GRAPH ?g { ?sub rdfs:subClassOf obo:GO_0004672 }
            } LIMIT 1
      - say: >
          Only 10,367 of 18,010 genes carry any GO term, so a GO-based enumeration silently excludes
          42% of the gene set — say so when reporting a count as a proportion.
        check:
          kind: count
          date: "2026-11-09"
          query: |
            PREFIX mpo: <http://marchantia.info/ontology/>
            SELECT (COUNT(DISTINCT ?g) AS ?n)
            FROM <http://marchantia.info/rdf/graph/MpTak_v7.1r2/function>
            WHERE { ?g mpo:hasGOTerm ?go }
          expect: {value: 10367, tolerance: 0.02}

  - id: gene_literature
    intent: retrieve curated, per-gene literature assertions with their evidence typing
    question: "What has been published about MpCEN1, and what role did the gene play in each study?"
    complexity: intermediate
    sparql: |
      PREFIX mpo: <http://marchantia.info/ontology/>
      PREFIX dcterms: <http://purl.org/dc/terms/>
      SELECT ?pmid ?year ?title ?role ?evidence ?core ?statement
      FROM <http://marchantia.info/rdf/graph/MpTak_v7.1r2/function>
      WHERE {
        ?assertion mpo:aboutGene <http://marchantia.info/rdf/gene/Mp1g00710> ;
                   mpo:fromPaper ?paper ;
                   mpo:geneRole ?role ;
                   mpo:evidenceType ?evidence ;
                   mpo:isCoreReference ?core ;
                   dcterms:description ?statement .
        ?paper dcterms:title ?title .
        OPTIONAL { ?paper mpo:pmid ?pmid }
        OPTIONAL { ?paper dcterms:date ?year }
      }
      ORDER BY ?pmid
    verified:
      row_count: 3
      date: "2026-11-09"
      has_values: ["30538242"]
    teaches: >
      mpo:GeneLiteratureAssertion is a reified gene-paper link carrying a hand-written
      dcterms:description of what that paper says about that gene — the highest-value free text in
      this database. mpo:isCoreReference is the stored shorthand for evidenceType=Experimental AND
      geneRole=Subject.
    traps_avoided:
      - say: >
          Do not anchor the paper on `?paper a fabio:ResearchPaper`: the 529 papers are split across
          fabio:ResearchPaper (491), fabio:ReviewArticle (26) and fabio:Expression (12), so the type
          filter drops 38 of them (7.2%). Anchor on mpo:fromPaper, which reaches all three.
        check:
          kind: count
          date: "2026-11-09"
          query: |
            PREFIX fabio: <http://purl.org/spar/fabio/>
            SELECT (COUNT(DISTINCT ?p) AS ?n)
            FROM <http://marchantia.info/rdf/graph/MpTak_v7.1r2/function>
            WHERE { ?p a fabio:ResearchPaper }
          expect: {value: 491, tolerance: 0.02}
      - say: >
          9 of the 529 papers are joined to NO gene at all — titled, with PMIDs, but the gene they
          discuss could not be resolved to a gene ID. A gene-anchored literature query cannot see
          them, and a paper count taken through mpo:fromPaper undercounts by 9. They sit in the
          function graph, reachable only as `FILTER NOT EXISTS { ?a mpo:fromPaper ?paper }`.
        check:
          kind: count
          date: "2026-11-09"
          query: |
            PREFIX mpo: <http://marchantia.info/ontology/>
            PREFIX dcterms: <http://purl.org/dc/terms/>
            SELECT (COUNT(DISTINCT ?p) AS ?n)
            FROM <http://marchantia.info/rdf/graph/MpTak_v7.1r2/function>
            WHERE { ?p dcterms:title ?t .
                    FILTER(STRSTARTS(STR(?p), "http://marchantia.info/rdf/paper/"))
                    FILTER NOT EXISTS { ?a mpo:fromPaper ?p } }
          expect: {value: 9, tolerance: 0.02}
      - say: >
          dcterms:date is a STRING and 46 of the 529 values carry a disambiguation suffix ("2024a",
          "2019b"). `FILTER(xsd:integer(?year) > 0)` silently drops 45 papers, as does any numeric
          year comparison. Filter on STR/REGEX, or accept the loss knowingly.
        check:
          kind: ratio
          date: "2026-11-09"
          numerator: |
            PREFIX dcterms: <http://purl.org/dc/terms/>
            PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>
            SELECT (COUNT(*) AS ?n)
            FROM <http://marchantia.info/rdf/graph/MpTak_v7.1r2/function>
            WHERE { ?p dcterms:date ?y .
                    FILTER(STRSTARTS(STR(?p), "http://marchantia.info/rdf/paper/"))
                    FILTER(xsd:integer(?y) > 0) }
          denominator: |
            PREFIX dcterms: <http://purl.org/dc/terms/>
            SELECT (COUNT(*) AS ?n)
            FROM <http://marchantia.info/rdf/graph/MpTak_v7.1r2/function>
            WHERE { ?p dcterms:date ?y .
                    FILTER(STRSTARTS(STR(?p), "http://marchantia.info/rdf/paper/")) }
          expect: {ratio: 0.915, tolerance: 0.02}
      - say: "mpo:geneRole distinguishes Subject (1,008) / Background (1,052) / Comparator (421) / Tool (376) and mpo:evidenceType distinguishes Experimental (2,052) / Citation (526) / Sequence (279). \"Papers about gene X\" almost always means mpo:isCoreReference true (947 assertions); without that filter, background mentions dominate."
        check:
          kind: count
          date: "2026-11-09"
          query: |
            PREFIX mpo: <http://marchantia.info/ontology/>
            SELECT (COUNT(*) AS ?n)
            FROM <http://marchantia.info/rdf/graph/MpTak_v7.1r2/function>
            WHERE { ?a mpo:geneRole mpo:Subject }
          expect: {value: 1008, tolerance: 0.02}

  - id: gene_orthologs
    intent: a gene's orthologs in other genomes, typed by relationship, via its genome copies
    question: "What are the orthologs of MpCEN1 in other plants, and are they one-to-one?"
    complexity: intermediate
    sparql: |
      PREFIX mpo: <http://marchantia.info/ontology/>
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
      PREFIX dcterms: <http://purl.org/dc/terms/>
      SELECT DISTINCT ?species ?relation ?orthologId
      FROM <http://marchantia.info/rdf/graph/MpTak_v7.1r2/function>
      WHERE {
        <http://marchantia.info/rdf/gene/Mp1g00710> mpo:hasGenomeGene ?copy .
        ?copy ?relation ?ortholog .
        ?relation rdfs:subPropertyOf mpo:hasOrtholog .
        ?ortholog mpo:genome/rdfs:label ?species ;
                  dcterms:identifier ?orthologId .
      }
      ORDER BY ?species ?orthologId
    verified:
      row_count: 8
      date: "2026-11-09"
      has_values: ["Physcomitrium patens", "Pp3c12_14390", "orthologOneToOne", "AnagrOXF.S4G316600"]
    teaches: >
      Orthology (OrthoFinder, 13 genomes) lives on mpo:GenomeGene nodes, rdf/gene/<GENOME>/<id>
      (gene/MPTAK1/Mp1g00710, gene/PPATE/Pp3c12_14390). The standard gene reaches its Tak-1/Tak-2
      copies by mpo:hasGenomeGene; each copy points at partners by FOUR predicates
      (orthologOneToOne / OneToMany / ManyToOne / ManyToMany), collected via
      `rdfs:subPropertyOf mpo:hasOrtholog`. Species: mpo:genome -> mpo:Genome (rdfs:label, mpo:clade).
    traps_avoided:
      - say: "The ortholog predicates are NOT on the standard gene IRI: `<gene/Mp1g00710> ?rel ?o` with ?rel an ortholog predicate returns 0 rows. Hop through mpo:hasGenomeGene first."
        check:
          kind: zero_rows
          date: "2026-11-09"
          query: |
            PREFIX mpo: <http://marchantia.info/ontology/>
            PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
            SELECT ?o FROM <http://marchantia.info/rdf/graph/MpTak_v7.1r2/function>
            WHERE { <http://marchantia.info/rdf/gene/Mp1g00710> ?rel ?o .
                    ?rel rdfs:subPropertyOf mpo:hasOrtholog } LIMIT 1
      - say: "mpo:hasOrtholog itself is never asserted (no inference on this endpoint), so `?copy mpo:hasOrtholog ?o` returns 0 rows. Use the subPropertyOf hop above or list the four predicates in VALUES."
        check:
          kind: zero_rows
          date: "2026-11-09"
          query: |
            PREFIX mpo: <http://marchantia.info/ontology/>
            SELECT ?o FROM <http://marchantia.info/rdf/graph/MpTak_v7.1r2/function>
            WHERE { ?copy mpo:hasOrtholog ?o } LIMIT 1
      - say: >
          DISTINCT is load-bearing: the Tak-1 and Tak-2 copies usually carry the same orthologs, so
          without it every partner comes back twice (16 rows for MpCEN1's 8). Do not "fix" that by
          pinning the MPTAK1 copy — 65 genes exist only on Tak-2 and would silently lose all their
          orthologs.
        check:
          kind: ratio
          date: "2026-11-09"
          numerator: |
            PREFIX mpo: <http://marchantia.info/ontology/>
            PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
            SELECT (COUNT(*) AS ?n) FROM <http://marchantia.info/rdf/graph/MpTak_v7.1r2/function>
            WHERE { <http://marchantia.info/rdf/gene/Mp1g00710> mpo:hasGenomeGene ?c .
                    ?c ?rel ?o . ?rel rdfs:subPropertyOf mpo:hasOrtholog }
          denominator: |
            PREFIX mpo: <http://marchantia.info/ontology/>
            PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
            SELECT (COUNT(DISTINCT ?o) AS ?n) FROM <http://marchantia.info/rdf/graph/MpTak_v7.1r2/function>
            WHERE { <http://marchantia.info/rdf/gene/Mp1g00710> mpo:hasGenomeGene ?c .
                    ?c ?rel ?o . ?rel rdfs:subPropertyOf mpo:hasOrtholog }
          expect: {ratio: 2.0, tolerance: 0.02}
      - "Only the Tak-1 and Tak-2 copies are ortholog SOURCES; the other 11 genomes' GenomeGenes appear only as targets and as orthogroup members. Tak-1 <-> Tak-2 allele pairs are a separate relation (mpo:hasAllele; see schema_delta), not orthologs."

  - id: orthogroup_members
    intent: everything in a gene's orthogroup, counted per genome — membership is NOT orthology
    question: "How many genes from each species share an orthogroup with MpCEN1?"
    complexity: aggregation
    sparql: |
      PREFIX mpo: <http://marchantia.info/ontology/>
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
      SELECT ?species (COUNT(DISTINCT ?member) AS ?members)
      FROM <http://marchantia.info/rdf/graph/MpTak_v7.1r2/function>
      WHERE {
        <http://marchantia.info/rdf/gene/Mp1g00710> mpo:inOrthoGroup ?og .
        ?member mpo:inOrthoGroup ?og ;
                mpo:genome/rdfs:label ?species .
      }
      GROUP BY ?species
      ORDER BY ?species
    verified:
      row_count: 13
      date: "2026-11-09"
      has_values: ["Arabidopsis thaliana", 45, "Oryza sativa", 42]
    teaches: >
      Members of any species are mpo:GenomeGenes pointing to the group with mpo:inOrthoGroup;
      mpo:inHog gives the finer HOG (dcterms:isPartOf -> its OrthoGroup). Group IRIs embed the run
      id (rdf/orthogroup/core13v71r3-20261017T014356Z/OG0000038) and numbers change between runs —
      reach a group from a gene, never hard-code its IRI.
    traps_avoided:
      - say: >
          Orthogroup membership is not orthology. MpCEN1's group holds 45 Arabidopsis genes
          (AT3G50360 among them) yet MpCEN1 has NO Arabidopsis ortholog — OrthoFinder assigns
          ortholog pairs within the group. "Orthologs of X" is gene_orthologs, not this query.
        check:
          kind: zero_rows
          date: "2026-11-09"
          query: |
            PREFIX mpo: <http://marchantia.info/ontology/>
            PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
            SELECT ?o FROM <http://marchantia.info/rdf/graph/MpTak_v7.1r2/function>
            WHERE { <http://marchantia.info/rdf/gene/Mp1g00710> mpo:hasGenomeGene ?c .
                    ?c ?rel ?o . ?rel rdfs:subPropertyOf mpo:hasOrtholog .
                    ?o mpo:genome <http://marchantia.info/rdf/genome/ATHAL> } LIMIT 1
      - say: >
          Keep the mpo:genome constraint. The standard mpo:Gene ALSO carries mpo:inOrthoGroup, so
          without it each Tak gene is counted up to three times (standard + Tak-1 + Tak-2 copy):
          273 members instead of 257 for this group.
        check:
          kind: ratio
          date: "2026-11-09"
          numerator: |
            PREFIX mpo: <http://marchantia.info/ontology/>
            SELECT (COUNT(DISTINCT ?m) AS ?n) FROM <http://marchantia.info/rdf/graph/MpTak_v7.1r2/function>
            WHERE { <http://marchantia.info/rdf/gene/Mp1g00710> mpo:inOrthoGroup ?og . ?m mpo:inOrthoGroup ?og }
          denominator: |
            PREFIX mpo: <http://marchantia.info/ontology/>
            SELECT (COUNT(DISTINCT ?m) AS ?n) FROM <http://marchantia.info/rdf/graph/MpTak_v7.1r2/function>
            WHERE { <http://marchantia.info/rdf/gene/Mp1g00710> mpo:inOrthoGroup ?og .
                    ?m mpo:inOrthoGroup ?og ; mpo:genome ?g }
          expect: {ratio: 1.062, tolerance: 0.02}
      - say: "mpo:hasMember (group -> member as a plain string) is RETIRED: still declared in the vocabulary as owl:deprecated, but carried by 0 triples. Queries written against it return nothing."
        check:
          kind: absent
          date: "2026-11-09"
          query: |
            PREFIX mpo: <http://marchantia.info/ontology/>
            SELECT ?s WHERE { ?s mpo:hasMember ?o } LIMIT 1

  - id: count_genes
    intent: the un-inflated gene total, with the graph pin that makes it correct
    question: "How many genes does MarpolBase contain?"
    complexity: aggregation
    sparql: |
      PREFIX mpo: <http://marchantia.info/ontology/>
      SELECT (COUNT(DISTINCT ?gene) AS ?genes)
      FROM <http://marchantia.info/rdf/graph/MpTak_v7.1r2/function>
      WHERE { ?gene a mpo:Gene }
    verified: {n: 18010, date: "2026-11-09"}
    teaches: "COUNT(DISTINCT) plus a single-graph FROM gives the true total. Never count mpo:GenomeGene (232,072 orthology members of 13 species) as genes."
    traps_avoided:
      - say: >
          The annotation graph answers this question DIFFERENTLY and both answers are correct for
          their own graph: obo:SO_0001217 returns 18,008 protein-coding genes there, while mpo:Gene
          returns 18,010 here. The sets differ both ways: 2 mpo:Genes exist only on Tak-2
          (Mp6g11775, Mp6g11776 — no coordinates, no UniProt link), and the one lncRNA gene,
          Mp1g17205 (MpSUF, obo:SO_0002127), has structure but no mpo:Gene. Any query joining the
          two graphs silently drops them; say which graph a gene count came from.
        check:
          kind: count
          date: "2026-11-09"
          query: |
            PREFIX obo: <http://purl.obolibrary.org/obo/>
            SELECT (COUNT(DISTINCT ?g) AS ?n)
            FROM <http://marchantia.info/rdf/graph/MpTak_v7.1r2/annotation>
            WHERE { ?g a obo:SO_0001217 }
          expect: {value: 18008, tolerance: 0.02}

  - id: xdb_uniprot
    intent: "cross-DB: MarpolBase gene -> its protein -> UniProtKB accession"
    question: "Which UniProt entry corresponds to the MpCEN1 gene product?"
    complexity: cross_db
    endpoint_name: marpolbase
    sparql: |
      PREFIX mpo: <http://marchantia.info/ontology/>
      PREFIX so:  <http://purl.obolibrary.org/obo/so#>
      PREFIX skos: <http://www.w3.org/2004/02/skos/core#>
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
      PREFIX dcterms: <http://purl.org/dc/terms/>
      SELECT DISTINCT ?geneId ?protein ?productName ?uniprot
      WHERE {
        GRAPH <http://marchantia.info/rdf/graph/MpTak_v7.1r2/function> {
          ?gene skos:prefLabel "MpCEN1"@en ;
                dcterms:identifier ?geneId .
        }
        GRAPH <http://marchantia.info/rdf/graph/MpTak_v7.1r2/annotation> {
          ?transcript so:transcribed_from ?gene ;
                      mpo:hasCds ?cds .
          ?cds so:translates_to ?protein .
          OPTIONAL { ?protein rdfs:label ?productName }
        }
        GRAPH <http://marchantia.info/rdf/graph/xref/uniprot> {
          ?protein rdfs:seeAlso ?uniprot .
        }
      }
    verified:
      row_count: 2
      date: "2026-11-09"
      has_values: ["Mp1g00710", "A0A2R6WDW7"]
    teaches: >
      The bridge to UniProt is gene -> (so:transcribed_from) transcript -> (mpo:hasCds) CDS ->
      (so:translates_to) protein -> (rdfs:seeAlso) http://purl.uniprot.org/uniprot/ACC, spanning
      three graphs. The emitted IRI is UniProt's own canonical form, so it drops straight into a
      second run_sparql call against database=uniprot with no ID conversion (A0A2R6WDW7 resolves as
      up:Protein of taxon 3197 there).
    traps_avoided:
      - "The predicate IRIs are http://purl.obolibrary.org/obo/so#transcribed_from — note the `#`. Writing `obo:so#transcribed_from` is a SPARQL SYNTAX ERROR, because `#` cannot appear in a prefixed local name. Declare a separate `PREFIX so: <http://purl.obolibrary.org/obo/so#>` as above, or write the full IRI."
      - "The xref graph is keyed on PROTEIN IRIs, so `?gene rdfs:seeAlso ?uniprot` inside it returns nothing — the transcript/CDS hop is not optional. Several transcripts of one gene can map to the SAME accession (MpCEN1 gives 2 rows, both A0A2R6WDW7), so DISTINCT on the accession if you want entries rather than isoform rows."
      - say: >
          This mapping is BLAST top-hit inference (blastp, e-value 1e-5, UniProt release 2026_03),
          hence rdfs:seeAlso and not owl:sameAs: 21,921 of 22,249 proteins (98.5%) carry a mapping
          onto 19,245 distinct accessions, and 313 genes have no link at all. Per the dataset's own
          metadata graph, 20% had tied top hits and 104 were resolved by alphabetical accession
          order alone (that note still quotes the pre-r2 total of 21,978). Treat it as a strong
          lead, not an identity claim.
        check:
          kind: count
          date: "2026-11-09"
          query: |
            PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
            SELECT (COUNT(DISTINCT ?s) AS ?n)
            FROM <http://marchantia.info/rdf/graph/xref/uniprot>
            WHERE { ?s rdfs:seeAlso ?u }
          expect: {value: 21921, tolerance: 0.02}
      - "SERVICE is refused here (see service_federation_refused), so the UniProt half has to be a second, separate query."

schema_delta:
  - "The dataset ships FIVE example queries as data: `<http://marchantia.info/rdf/dataset/marpolbase> mpo:hasExampleQuery ?q . ?q mpo:sparql ?text` gives runnable SPARQL for gene-to-literature, paper-to-genes, paper-to-coexpressed, condition-to-literature and peco-to-conditions (dcterms:title in Japanese). They do not pin a graph — add the FROM before running them."
  - "Conditions (rdf/condition/<BioProject>_G<n>) also carry dcterms:title (free text), mpo:runCount, mpo:referenceLabel and dcterms:source -> Paper. mpo:hasExperiment -> rdf/experiment/<SRX|DRX|ERX> carries mpo:representativeRun (plain run accession), mpo:bioSample / mpo:bioProject, mpo:instrumentModel, mpo:sampleTitle."
  - "Tak-1 <-> Tak-2 alleles: mpo:hasAllele links the two GenomeGene copies directly; an mpo:AllelePair node (mpo:pairMember x2) adds mpo:proteinIdentical, mpo:lengthRatio and mpo:pairingEvidence (17,765 pairs). Sex-chromosome gametologs use mpo:hasGametolog / mpo:GametologPair (59). GenomeGenes also carry mpo:chromosomeClass (autosome / U / V / unplaced, a plain string)."
  - "307 vocabulary concepts carry a Japanese skos:note (`FILTER(LANG(?note) = \"ja\")`); skos:broader holds the imported PO/PECO ancestry of the mapped terms."
  - "Chromosomes carry insdc_ontology:sequence_length (`<http://ddbj.nig.ac.jp/ontologies/nucleotide/sequence_length>`) and sit under obo:BFO_0000050 -> the obo:SO_0000353 assembly `rdf/assembly/MpTak_v7.1r2`."
  - "foaf:page (annotation graph) and rdfs:seeAlso (function graph) give a gene's MarpolBase page, e.g. https://marchantia.info/MpTak_v7.1r2/Mp1g00710/ — cite it rather than constructing a URL; GenomeGenes carry their own species pages on rdfs:seeAlso."
  - "The retired namespace `mpbo: <http://marchantia.info/rdf/ontology/>` was replaced by `mpo: <http://marchantia.info/ontology/>`; queries still using it return 0 rows with no error."

id_join_map:
  stable_anchor: >
    Gene IRI http://marchantia.info/rdf/gene/<MpNgNNNNN> (e.g. Mp1g00710) — shared verbatim by both
    main graphs and the anchor for everything. Derived IRIs are predictable:
    rdf/transcript/<gene>.<n>, rdf/cds/<gene>.<n>, rdf/protein/<gene>.<n>; per-genome copies are
    rdf/gene/<GENOME>/<id> (see gene_orthologs). Legacy v3.1 ids (Mapoly...) live on
    mpo:v3Identifier (plain) and skos:altLabel (@en). Literal forms: see
    global_gotchas.labels_are_en_identifiers_are_plain; symbol lookup: see gene_by_symbol.
  same_endpoint_joins:
    annotation_graph: "Same gene IRI, different graph — pin GRAPH <http://marchantia.info/rdf/graph/MpTak_v7.1r2/annotation> for coordinates/exons/CDS/transcripts/proteins; the two graphs' gene sets differ by 3 (see count_genes)."
    uniprot_xref_graph: "Keyed on the PROTEIN IRI, reached via so:transcribed_from / mpo:hasCds / so:translates_to — see the xdb_uniprot example."
    ontology_graphs: "SO, SIO and FALDO are loaded as graphs, so obo:SO_* types can be generalised with rdfs:subClassOf* in the same query (SO_0001217 -> SO_0000704 gene); GO, Pfam and KEGG are not."
  xrefs:
    uniprot: "rdfs:seeAlso -> http://purl.uniprot.org/uniprot/<ACC> in the xref/uniprot graph, on protein IRIs; coverage (98.5%) and the BLAST-inference caveat are in xdb_uniprot. The https://www.uniprot.org/uniprotkb?query=gene:... links on Arabidopsis GenomeGenes are search URLs, not accessions."
    pubmed: "mpo:pmid (plain literal) and rdfs:seeAlso -> https://pubmed.ncbi.nlm.nih.gov/<pmid> on rdf/paper/pmid/<pmid>; also mpo:pmcid and mpo:doi. 526 pubmed links over 529 papers."
    go: "mpo:hasGOTerm -> http://purl.obolibrary.org/obo/GO_NNNNNNN; no subClassOf closure (see enum_go_term)."
    pfam: "mpo:hasPfam -> http://identifiers.org/pfam/PF#####."
    kegg: "mpo:hasKEGG -> http://identifiers.org/kegg.orthology/K#####."
    plant_ontology_peco: "skos:exactMatch on condition-vocabulary concepts -> obo:PO_* and obo:PECO_* (51 distinct terms), labelled locally."
    insdc_sra: "mpo:hasExperiment -> http://marchantia.info/rdf/experiment/<SRX|DRX|ERX>; the local name IS the INSDC experiment accession; mpo:bioSample / mpo:bioProject are identifiers.org IRIs."
    ncbi_taxonomy: "obo:RO_0002162 -> obo:NCBITaxon_3197 on the assembly and each chromosome (the form to join on), with a parallel rdfs:seeAlso -> identifiers.org/taxonomy/3197."
    other_species_genes: "mpo:GenomeGene rdf/gene/<GENOME>/<id> for 13 genomes; dcterms:identifier is the species' own gene id (TAIR AGI, RAP-DB, Phypa V3 ...), the string to hand to TogoID."
  bridged_via_togoid:
    - "UniProt and PubMed need no bridge — both are emitted as native IRIs, and a UniProt accession is the shortest route onward (uniprot -> pdb / chembl_target)."
    - >
      For Arabidopsis orthologs (or orthogroup members), take dcterms:identifier of a GenomeGene
      whose mpo:genome is <http://marchantia.info/rdf/genome/ATHAL> and convert it with
      togoid_convertId. The dataset key is `tair` — NOT "AGI", which is not a dataset key. There is
      no tair <> ensembl_gene or tair <> uniprot relation, so the working route is
      `tair,ncbigene,uniprot` (AT3G50360 -> O82659). `tair` is TogoID's only plant-gene dataset, so
      the rice, Physcomitrium, Anthoceros and algal genes cannot be bridged this way.
    - >
      For anything keyed on the legacy Mapoly (v3.1) identifiers, join on mpo:v3Identifier rather
      than the MpTak id. This is a LOCAL string join, not a TogoID hop: TogoID carries no
      Marchantia or Mapoly dataset.
