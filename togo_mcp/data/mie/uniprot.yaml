# MIE v3 — UniProt. Hand-authored 2026-07-21; revised 2026-07-29 (full live re-verification).
# Format: togo_mcp/data/docs/MIE_v3_spec.md (header · examples · schema_delta · id_join_map).
# Every `verified:` count/result was re-run live against the SIB endpoint on the stated date.
# 2026-07-29 revision: a UniProt release landed since 2026-07-21 — every count moved. Also added the
# six UniProt-owned graphs and the co-hosted ontology suite that Phase-2a discovery found missing, and
# a new `go_label_duplication` gotcha (rdfportal.org/ontology/go duplicates GO labels ×2).
# 2026-08-26 revision (header only; examples untouched): the header was cross-checked against the live
# endpoint after the 2026-08-25 sib-swiss/sparql-examples replay, and four claims were WRONG —
# `reviewed_filter` prescribed the reverse of the portable literal form, `flat_lineage` and the
# `xdb_rhea` trap both blamed a timeout that does not happen, `schema_delta` called dcterms:identifier
# absent from UniProt when six graphs carry it, and the OMA re-typing was understated 52x. Every
# falsifiable claim in `global_gotchas` now carries a machine-runnable `check:` (spec §3.6) so the same
# class of rot cannot sit unnoticed again: `uv run python scripts/check_mie_gotchas.py uniprot`.
# Also added `graphs.absent_here` — the graphs this endpoint does NOT have, declared positively.
mie_spec: 3                        # format version — see MIE_v3_spec.md §2
database: uniprot

# ── discovery: the four fields a build-time generator rolls into the Usage Guide catalog (spec §1.1).
#    Keep SMALL and uniform — multiplied across the whole catalog. NOT served per-request. ──
discovery:
  title: UniProt RDF
  description: >
    Curated (Swiss-Prot) and automatic (TrEMBL) protein sequence + functional annotation:
    sequences, domains, PTMs, isoforms, natural variants, disease links, GO terms, EC/enzyme
    activity, catalysed Rhea reactions, and 200+ cross-references.
  keywords: [protein, sequence, swiss-prot, trembl, reviewed, function, domain, isoform,
             enzyme, ec number, natural variant, disease, gene ontology, cross-reference]
  categories: [protein, annotation]

# ── provenance + database-wide truths (get_MIE_file only) ──
endpoint: https://rdfportal.org/sib/sparql
base_uri: http://purl.uniprot.org/
# SIB co-hosts UniProt + Rhea + OMA + MeSH + Bgee in the default-graph union: the source of BOTH the
# count-inflation traps (gotcha `union_inflation`/`taxon_multiplication`) AND the direct cross-DB joins
# (examples `xdb_*`) — no TogoID bridge needed for those four. PDB/ChEMBL/Ensembl still bridge via TogoID.
graphs:
  primary: http://sparql.uniprot.org/uniprot
  # All sparql.uniprot.org/* — UniProt-owned. `obsolete` matters most: it holds the 14,454 DELETED
  # reviewed entries that a bare COUNT(DISTINCT) silently includes (see gotcha union_inflation).
  supporting: [taxonomy, go, diseases, enzyme, keywords, pathways, locations, citations, core,
               obsolete, citationmapping, databases, journal, proteomes, tissues]
  co_hosted:                       # NOT UniProt-owned; live in the same union. 68 graphs total (2026-08-26).
    oma:  "584M triples; re-types 17,544,694 UniProt protein IRIs as up:Protein — 335,971 of them CURRENT reviewed (count-inflation source, gotcha union_inflation); reverse-join via lscr:xrefSwissProt"
    mesh: "3 graphs (id.nlm.nih.gov/mesh + /vocab + /void); join target for up:Disease rdfs:seeAlso -> id.nlm.nih.gov/mesh/"
    bgee: "expression; join via rdfs:seeAlso purl.uniprot.org/bgee/<ENSG> + IRI transform. Also re-declares up:scientificName/rank/commonName on 52 taxon nodes (gotcha taxon_multiplication)"
    rhea: "reactions; join via up:enzyme EC IRI == rhea:ec (same namespace). Its graph IRI here is rdfportal.org/dataset/rhea — see absent_here"
    goa:  "EMPTY STUB (151 triples), purl.jp/bio/11/goa — NOT real GOA data; ignore it"
    ontology_go: "rdfportal.org/ontology/go DUPLICATES GO term rdfs:label and rdfs:subClassOf against UniProt's OWN sparql.uniprot.org/go graph — same label, so ×2 rows on any unpinned GO-label join (see gotcha go_label_duplication)"
    cellosaurus: >
      rdfportal.org/dataset/cellosaurus — cell lines. No UniProt IRI overlap, but it OWNS the label
      namespace: an unpinned `?s rdfs:label \"TP53\"` returns 17,102 rows of which 16,879 (98.7%) are
      Cellosaurus cell lines and 5 are UniProt (measured 2026-08-26). Any unpinned label text-match on
      a gene/protein symbol is answered by Cellosaurus, not by UniProt. Pin the graph.
    ontology_suite: "37 more rdfportal.org/ontology/* graphs (so, eco, efo, mondo, uberon, cl, hp, fma, faldo, taxonomy, …), counted 2026-08-26. Only ontology/go was found to collide with a UniProt-owned graph; the rest supply vocabulary UniProt does not re-declare."
  # ── DECLARED ABSENCES. Stated positively because a graph that is merely missing from the lists
  #    above is indistinguishable from one nobody wrote down — and a query naming a graph IRI that
  #    does not exist here returns 0 rows with NO error. These were the single largest source of
  #    silent 0-row failures when upstream sib-swiss/sparql-examples queries were replayed here
  #    (2026-08-25: 13 examples died on the missing graphs, 6 more on the Rhea IRI alone).
  absent_here:                     # verified 0 triples on this endpoint, 2026-08-26
    uniparc: "http://sparql.uniprot.org/uniparc — NOT here (188 billion triples on UniProt's own endpoint). No UniParc data at all; do not write the GRAPH clause."
    uniref:  "http://sparql.uniprot.org/uniref — NOT here (5.4 billion triples upstream). No UniRef clusters."
    chebi:   "http://sparql.uniprot.org/chebi — NOT here (5.2M triples upstream). For ChEBI use the separate `chebi` database, or Rhea's own rhea:name."
    renamed_enzymes: "This endpoint's EC graph is <http://sparql.uniprot.org/enzyme> (SINGULAR, 182,276 triples). UniProt's own endpoint calls the same content `enzymes`. Same data, different IRI."
    renamed_database: "This endpoint's DB-registry graph is <http://sparql.uniprot.org/databases> (PLURAL, 2,376 triples). UniProt's own endpoint calls it `database`. Same data, different IRI."
    renamed_rhea: "Rhea is at <http://rdfportal.org/dataset/rhea> here. The upstream IRI <https://sparql.rhea-db.org/rhea> has 0 triples on this endpoint — the single most common way a copied UniProt/Rhea example silently returns nothing."

entity_counts:                     # COUNT(DISTINCT), graph-pinned unless noted; verified 2026-07-29
  reviewed_current:      575503    # Swiss-Prot, current (FROM <.../uniprot>)  — the usual "how big is Swiss-Prot" answer
  reviewed_with_deleted: 589957    # + 14,454 in the `obsolete` graph; "current + historical", rarely wanted
  union_raw_countstar:   928116    # unpinned COUNT(*) — INFLATED, never report (see gotcha union_inflation)
  trembl_approx:         244000000
  gene_symbol_coverage:  "504,474 / 575,503 reviewed carry a gene symbol (87.7%); 550,744 have a gene node (95.7%)"

global_gotchas:                    # the few that bite ANY query — verified 2026-07-29
  - id: reviewed_filter
    say: >
      ALWAYS filter on up:reviewed — omitting it queries ~244M TrEMBL rows and times out. The LITERAL
      FORM does not matter HERE: this Virtuoso treats `up:reviewed 1` and `up:reviewed true` as the same
      value (589,957 either way, 2026-08-26), so both work and the examples below use `1`.
      PORTABILITY, and the reason not to state a rule about the form: on UniProt's OWN endpoint
      (sparql.uniprot.org) it is exactly reversed — `up:reviewed 1` returns 0 rows there and only
      `true` matches. If a query may be moved or was copied from upstream (sib-swiss/sparql-examples
      uses `true`), write `true`: it is the form that works on both. Until 2026-08-26 this entry
      prescribed integer `1` and said `true` returns 0 rows, which is the reverse of the portable truth.
    check:
      kind: ratio            # the two literal forms must stay interchangeable ON THIS ENDPOINT
      date: "2026-08-26"
      numerator: |
        PREFIX up: <http://purl.uniprot.org/core/>
        SELECT (COUNT(DISTINCT ?p) AS ?n) WHERE { ?p a up:Protein ; up:reviewed true . }
      denominator: |
        PREFIX up: <http://purl.uniprot.org/core/>
        SELECT (COUNT(DISTINCT ?p) AS ?n) WHERE { ?p a up:Protein ; up:reviewed 1 . }
      expect: {ratio: 1.0, tolerance: 0.001}
  - id: union_inflation
    say: >
      `a up:Protein ; up:reviewed 1` inflates from TWO independent causes -> unpinned COUNT(*) = 928,116.
      (a) the `a up:Protein` LEG matches in three graphs — uniprot, obsolete, AND co-hosted OMA, which re-types
      335,971 of the SAME reviewed IRIs; (b) the `up:reviewed 1` leg is UniProt-only (uniprot 575,503 + obsolete 14,454
      = 589,957 distinct IRIs, disjoint sets). Two INDEPENDENT fixes: (1) COUNT(DISTINCT ?p) collapses the OMA
      same-IRI re-typings -> 589,957; (2) to drop the 14,454 DELETED entries too, pin
      `FROM <http://sparql.uniprot.org/uniprot>` OR `FILTER NOT EXISTS { ?p up:obsolete 1 }` -> 575,503 (current Swiss-Prot).
      A ROW query doubles the same way -> use SELECT DISTINCT or pin the graph. Nothing signals the inflation; it is worse than an empty result.
      NOTE the re-typing is a SUBSET (335,971 of 589,957), so spot-checking one protein can look clean — TP53/P04637 has
      NO triples in the OMA graph. Never conclude "no inflation" from a single-entity probe; count per graph.
      SCOPE (measured 2026-08-26, and the reason this trap is narrower than it reads): OMA re-declares
      17,544,694 UniProt protein IRIs as `a up:Protein` in total — 335,971 is only the slice overlapping
      CURRENT reviewed, not the size of the re-typing. But the contamination is essentially ONE predicate.
      Per-predicate triples in the co-hosted OMA / Bgee graphs: `a up:Protein` 17,544,694 / 0;
      up:scientificName 2,927 / 52; up:rank 2,927 / 52; up:mnemonic 1,555 / 0; and up:organism, up:reviewed,
      up:encodedBy, up:classifiedWith, up:sequence, up:enzyme, up:annotation are ALL exactly 0 in both.
      So the ENTRY pattern (`a up:Protein`) and the taxon nodes are polluted; every core annotation
      predicate is untouched. Once your query is anchored on any of those, the union cannot inflate it.
    check:
      kind: ratio            # unpinned COUNT(*) 928,116 vs the graph-pinned current-Swiss-Prot 575,503
      date: "2026-08-26"
      unpinned: |
        PREFIX up: <http://purl.uniprot.org/core/>
        SELECT (COUNT(*) AS ?n) WHERE { ?p a up:Protein ; up:reviewed 1 . }
      pinned: |
        PREFIX up: <http://purl.uniprot.org/core/>
        SELECT (COUNT(DISTINCT ?p) AS ?n) FROM <http://sparql.uniprot.org/uniprot>
        WHERE { ?p a up:Protein ; up:reviewed 1 . }
      expect: {ratio: 1.61, tolerance: 0.03}
  - id: taxon_multiplication
    say: >
      OMA and Bgee RE-DECLARE some taxon nodes (purl.uniprot.org/taxonomy/N) with their own copies of
      up:scientificName/rank/commonName/mnemonic, so a protein->organism->scientificName join can return
      3 rows PER protein and silently triple an aggregate. THE MULTIPLIER IS NOT UNIFORM, which is what
      makes it hard to spot: OMA carries scientificName for its 2,927 sequenced species and Bgee for its
      52, against UniProt taxonomy's 2,719,973 — so only ~0.11% of taxa are affected, and they are the
      MODEL ORGANISMS you are most likely to query. Measured 2026-08-26: taxon 9606 (human) -> 3 rows,
      taxon 623 (Shigella flexneri) -> 1 row. You cannot divide the inflation out, and a spot-check on a
      non-model taxon will show it clean. Two values genuinely CONFLICT rather than duplicate, so DISTINCT
      cannot mask them: up:rank is up:Taxonomic_Rank_Species in UniProt vs up:Species in OMA/Bgee, and
      up:commonName is \"Human\" in UniProt vs \"human\" in Bgee (case differs — a case-sensitive filter on
      commonName flips between 0 rows and duplicates depending on which graph answers).
      FIX = pin `GRAPH <http://sparql.uniprot.org/taxonomy>`, not DISTINCT.
    check:
      kind: count            # the model-organism case: 3 graphs supply scientificName for taxon 9606
      date: "2026-08-26"
      query: |
        PREFIX up: <http://purl.uniprot.org/core/>
        SELECT (COUNT(*) AS ?n) WHERE {
          GRAPH ?g { <http://purl.uniprot.org/taxonomy/9606> up:scientificName ?name }
        }
      expect: {value: 3, tolerance: 0.0}
  - id: go_label_duplication
    say: >
      GO term rdfs:label is supplied by EIGHT graphs on this endpoint, so an unpinned `?goTerm rdfs:label ?l`
      multiplies rows ~3.4× (measured: P01308's 70 GO terms -> 238 rows; see example `go_label_pin`). Sources:
      UniProt's own go (70) + co-hosted rdfportal.org/ontology/go (70, a full duplicate) + ontology/cl (40),
      ontology/uberon (36), ontology/efo (5), bgee (2) — which import GO terms — AND UniProt's OWN keywords (8)
      and locations (7) graphs. The multiplier VARIES per term (how many ontologies import it), so it is not a
      fixed factor you can divide out. The LABELS AGREE, which is what makes it dangerous: the duplicate looks
      like a legitimate multi-valued label and DISTINCT hides it. rdfs:subClassOf sets DIFFER between graphs
      (7 vs 3 for GO_0004672), so a hierarchy walk answers differently depending on which graph it reads.
      FIX = pin `GRAPH <http://sparql.uniprot.org/go>` — note that pinning "UniProt's graphs" is NOT enough,
      since keywords and locations are UniProt-owned and still contribute. Annotation lookups
      (`up:classifiedWith obo:GO_*`) are unaffected — they never touch a label.
    check:
      kind: ratio            # P01308's 70 GO terms: 238 rows unpinned, 70 pinned to the `go` graph
      date: "2026-08-26"
      unpinned: |
        PREFIX up: <http://purl.uniprot.org/core/>
        PREFIX uniprot: <http://purl.uniprot.org/uniprot/>
        PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
        SELECT (COUNT(*) AS ?n) WHERE {
          GRAPH <http://sparql.uniprot.org/uniprot> {
            uniprot:P01308 up:classifiedWith ?goTerm .
            FILTER(STRSTARTS(STR(?goTerm), "http://purl.obolibrary.org/obo/GO_"))
          }
          ?goTerm rdfs:label ?label .
        }
      pinned: |
        PREFIX up: <http://purl.uniprot.org/core/>
        PREFIX uniprot: <http://purl.uniprot.org/uniprot/>
        PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
        SELECT (COUNT(*) AS ?n) WHERE {
          GRAPH <http://sparql.uniprot.org/uniprot> {
            uniprot:P01308 up:classifiedWith ?goTerm .
            FILTER(STRSTARTS(STR(?goTerm), "http://purl.obolibrary.org/obo/GO_"))
          }
          GRAPH <http://sparql.uniprot.org/go> { ?goTerm rdfs:label ?label . }
        }
      expect: {ratio: 3.4, tolerance: 0.05}

  - id: no_protein_label
    say: "up:Protein has NO rdfs:label. Names come from up:recommendedName/up:fullName (Swiss-Prot) or up:submittedName/up:fullName (TrEMBL). rdfs:label on a protein -> 0 rows silently."
    check:
      kind: zero_rows
      date: "2026-08-26"
      query: |
        PREFIX up: <http://purl.uniprot.org/core/>
        PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
        SELECT ?p WHERE { GRAPH <http://sparql.uniprot.org/uniprot> { ?p a up:Protein ; rdfs:label ?l } } LIMIT 1
  - id: flat_lineage
    say: >
      Taxonomy lineage is pre-computed as flat single-hop rdfs:subClassOf: EVERY ancestor is a direct
      edge, so single-hop and the transitive form return the IDENTICAL set (verified 2026-08-26: reviewed
      proteins under Enterobacterales/91347 = 63,419 both ways). Use the single hop. The `*`/`+` form is
      wrong for two separate reasons, neither of which is a timeout — that word was in this entry until
      2026-08-26 and it was never what happened. (1) Where BOTH ends of the path are variables, or the
      path sits inside an aggregate, Virtuoso REJECTS it outright: HTTP 500 \"transitive start not given\"
      / \"neither end of it is bound by equality\", in 0.2s. (2) Where it does run, it merely costs ~30×
      for the same answer (41.3s vs 1.4s on the clade aggregate above). So: single-hop for correctness of
      effort, not to dodge a hang.
    check:
      kind: ratio            # the load-bearing claim: the flat single hop really does cover the whole lineage
      date: "2026-08-26"
      numerator: |
        PREFIX up: <http://purl.uniprot.org/core/>
        PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
        SELECT (COUNT(DISTINCT ?protein) AS ?n)
        FROM <http://sparql.uniprot.org/uniprot>
        FROM <http://sparql.uniprot.org/taxonomy>
        WHERE { ?protein a up:Protein ; up:reviewed 1 ; up:organism ?organism .
                ?organism rdfs:subClassOf* <http://purl.uniprot.org/taxonomy/91347> . }
      denominator: |
        PREFIX up: <http://purl.uniprot.org/core/>
        PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
        SELECT (COUNT(DISTINCT ?protein) AS ?n)
        FROM <http://sparql.uniprot.org/uniprot>
        FROM <http://sparql.uniprot.org/taxonomy>
        WHERE { ?protein a up:Protein ; up:reviewed 1 ; up:organism ?organism .
                ?organism rdfs:subClassOf <http://purl.uniprot.org/taxonomy/91347> . }
      expect: {ratio: 1.0, tolerance: 0.001}

# ── examples: the load-bearing content. Each is executable, verified, and IS the schema+shape+sample it
#    would otherwise be written four times over. `traps_avoided` are the inline, query-specific warnings. ──
examples:
  - id: sequence_mass
    intent: amino-acid sequence + mass of a protein, selected by naming the canonical isoform IRI
    question: "What is the canonical amino-acid sequence and mass of human insulin (P01308)?"
    complexity: basic
    sparql: |
      PREFIX up: <http://purl.uniprot.org/core/>
      PREFIX uniprot: <http://purl.uniprot.org/uniprot/>
      PREFIX isoform: <http://purl.uniprot.org/isoforms/>
      PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
      SELECT ?sequence ?mass (STRLEN(?sequence) AS ?length)
      FROM <http://sparql.uniprot.org/uniprot>        # load-bearing, not decoration — see traps_avoided
      WHERE {
        # The canonical sequence node is NAMED <isoforms/ACC-1>. State it as an IRI instead of binding
        # ?seq and testing the string afterwards: both legs stay index-resolved, nothing is post-filtered.
        uniprot:P01308 up:sequence isoform:P01308-1 .
        isoform:P01308-1 rdf:value ?sequence ; up:mass ?mass .
      }
    verified: {result_rows: 1, mass: 11981, length: 110, date: "2026-08-20", runtime: "0.4s",
               under_extension: "with two OPTIONALs bolted on (rdfs:seeAlso/up:database and up:classifiedWith/rdfs:label) it returns 918 rows in 1.0\u20131.5s; the previous FILTER(CONTAINS)+unpinned form did not finish within 200s"}
    teaches: "up:sequence \u2192 the isoform node \u2192 rdf:value carries the letters, up:mass the Da. For a known protein, name the isoform IRI: the canonical node for accession ACC is isoforms/ACC-1 in 2,985 of 3,000 sampled reviewed human entries (2026-08-20), so the lookup needs no ?seq variable and no string test at all."
    traps_avoided:
      - "up:sequence on P01308 ALSO returns isoforms/F8WCM5-1 \u2014 the 200-aa INS-IGF2 readthrough, which belongs to a DIFFERENT accession \u2014 so a bare `?protein up:sequence ?seq` yields 2 sequences. Not a one-off: O94854 hangs five Q9UPN3-* isoform nodes off up:sequence and has no O94854-1 node at all."
      - "Do NOT select the isoform with FILTER(CONTAINS(STR(?seq), \"/P01308-1\")). It passes alone (1.1s pinned) but it is a post-filter over whatever ?seq bound, so it does not survive being extended \u2014 and the query it was written in had no FROM. Measured 2026-08-20 with the two OPTIONALs above: unpinned FILTER form >200s (no result), unpinned direct-IRI form >200s too, pinned FILTER form 5.6s, this form ~1.5s. The FROM pin is the larger half of the fix (gotcha union_inflation); naming the IRI is what removes the remaining 4\u00d7."
      - "isoforms/ACC-1 is not universal: ~0.5% of entries have no -1 node because the canonical was merged or demoted (Q9Y2K2 starts at -5, Q12955 at -3, Q8N7W2 at -2). If a direct-IRI lookup returns 0 rows, run `?p up:sequence ?seq` once and read the real node name, or scope by accession instead of by number: FILTER(STRSTARTS(STR(?seq), \"http://purl.uniprot.org/isoforms/P01308-\"))."
      - "Every sequence node is typed BOTH up:Simple_Sequence AND up:External_Sequence, so a `?seq a ?class` binding doubles the rows. Naming the IRI avoids the type triple entirely; a fixed `?seq a up:Simple_Sequence` is safe but buys nothing here."

  - id: go_function
    intent: proteins by GO molecular-function term (OBO IRI namespace)
    question: "How many reviewed proteins have protein-kinase activity?"
    complexity: basic
    sparql: |
      PREFIX up: <http://purl.uniprot.org/core/>
      PREFIX obo: <http://purl.obolibrary.org/obo/>
      SELECT (COUNT(DISTINCT ?protein) AS ?n)
      FROM <http://sparql.uniprot.org/uniprot>
      WHERE {
        VALUES ?goTerm { obo:GO_0004674 obo:GO_0004672 }   # ser/thr kinase; protein kinase
        ?protein a up:Protein ; up:reviewed 1 ; up:classifiedWith ?goTerm .
      }
    verified: {n: 4806, date: "2026-07-29"}
    teaches: "GO annotation is up:classifiedWith an OBO IRI. FROM-pin the uniprot graph for a clean DISTINCT count."
    traps_avoided:
      - say: "GO terms are OBO IRIs (obo:GO_XXXXXXX), NOT purl.uniprot.org/go/ — wrong namespace returns 0 rows silently."
        check:
          kind: zero_rows
          date: "2026-08-26"
          query: |
            PREFIX up: <http://purl.uniprot.org/core/>
            SELECT ?protein WHERE {
              GRAPH <http://sparql.uniprot.org/uniprot> { ?protein up:classifiedWith <http://purl.uniprot.org/go/0004674> }
            } LIMIT 1
      - "up:classifiedWith ALSO carries UniProt keywords (purl.uniprot.org/keywords/NNN); if mixing, distinguish by FILTER(STRSTARTS(STR(?x), ...))."

  - id: go_label_pin
    intent: read GO term LABELS alongside UniProt annotations without the eight-graph label duplication
    question: "Which GO terms is human insulin (P01308) annotated with, and what are their labels?"
    complexity: intermediate
    sparql: |
      PREFIX up: <http://purl.uniprot.org/core/>
      PREFIX uniprot: <http://purl.uniprot.org/uniprot/>
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
      SELECT ?goTerm ?label
      WHERE {
        GRAPH <http://sparql.uniprot.org/uniprot> {
          uniprot:P01308 up:classifiedWith ?goTerm .
          FILTER(STRSTARTS(STR(?goTerm), "http://purl.obolibrary.org/obo/GO_"))   # classifiedWith also carries keywords
        }
        GRAPH <http://sparql.uniprot.org/go> { ?goTerm rdfs:label ?label . }      # THE PIN — without it, 238 rows
      }
      ORDER BY ?label
    verified: {result_rows: 70, distinct_terms: 70, date: "2026-07-29",
               first_rows: "G protein-coupled receptor signaling pathway; Golgi lumen; Golgi membrane; acute-phase response"}
    teaches: "Pin BOTH sides when labelling GO terms: the annotation from the uniprot graph, the label from sparql.uniprot.org/go. Rows then equal distinct terms (70 = 70) — the 1:1 you should always sanity-check on a label join."
    traps_avoided:
      - "Unpinned, this returns 238 rows for the same 70 terms (~3.4x) — eight graphs supply GO rdfs:label. The labels AGREE, so nothing looks wrong; it reads as a legitimately multi-valued label (gotcha go_label_duplication)."
      - "Pinning only `sparql.uniprot.org/uniprot` does NOT fix it: keywords and locations are also UniProt-owned graphs supplying GO labels. Pin the `go` graph specifically."
      - "DISTINCT is the wrong instrument here — it would collapse the 238 to 70 and hide a duplication you need to see. The row-count-equals-term-count check is what tells you the join is clean."

  - id: keyword_enum
    intent: enumerate ALL proteins carrying a UniProt keyword (domain / feature / function) — the classification route
    question: "How many reviewed human proteins contain an SH3 domain?"
    complexity: basic
    sparql: |
      PREFIX up: <http://purl.uniprot.org/core/>
      PREFIX keywords: <http://purl.uniprot.org/keywords/>
      SELECT (COUNT(DISTINCT ?protein) AS ?n)
      FROM <http://sparql.uniprot.org/uniprot>
      WHERE {
        ?protein a up:Protein ; up:reviewed 1 ;
                 up:organism <http://purl.uniprot.org/taxonomy/9606> ;
                 up:classifiedWith keywords:727 .    # KW-0727 = SH3 domain (swap the KW number for any feature/domain/function)
      }
    verified: {n: 108, date: "2026-07-29"}
    teaches: "To enumerate proteins by a domain/feature/functional class, use up:classifiedWith keywords:NNN (the KW number). This is the PRIMARY route for 'all proteins with feature X' — keywords cover ~99% of reviewed proteins."
    traps_avoided:
      - "Do NOT substitute a name/comment text match or the per-annotation route for whole-set enumeration: free-text matches miss synonyms and non-name mentions and silently UNDERCOUNT, while the keyword classification is complete (~99% of reviewed entries carry keywords). Resolve a feature name to its KW number (keywords graph rdfs:label), then enumerate by that IRI."

  - id: count_swissprot           # the ELEVATED `aggregation` class — targets the factoid miscount failure mode
    intent: count current reviewed Swiss-Prot proteins (the union-inflation recipe)
    question: "How many proteins are in current Swiss-Prot?"
    complexity: aggregation
    sparql: |
      PREFIX up: <http://purl.uniprot.org/core/>
      SELECT (COUNT(DISTINCT ?p) AS ?current_swissprot)
      FROM <http://sparql.uniprot.org/uniprot>            # graph-pin does BOTH corrections at once
      WHERE { ?p a up:Protein ; up:reviewed 1 . }
    verified: {current_swissprot: 575503, date: "2026-07-29"}
    teaches: "Graph-pinning the uniprot graph gives the current-Swiss-Prot count in one move (drops OMA re-typings AND obsolete)."
    traps_avoided:
      - "Unpinned COUNT(*) = 928,116 (inflated); COUNT(DISTINCT) alone = 589,957 (keeps 14,454 DELETED). See gotcha union_inflation for the full decomposition and the 'include historical' variant."

  - id: disease_variants
    intent: disease-linked natural variants of a protein (substitution + disease + dbSNP)
    question: "Which natural variants of TP53 (P04637) carry a substitution, and their disease / dbSNP links?"
    complexity: intermediate
    sparql: |
      PREFIX up: <http://purl.uniprot.org/core/>
      PREFIX uniprot: <http://purl.uniprot.org/uniprot/>
      PREFIX skos: <http://www.w3.org/2004/02/skos/core#>
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
      SELECT ?substitution ?diseaseLabel ?dbsnp
      WHERE {
        VALUES ?protein { uniprot:P04637 }
        ?protein up:annotation ?annot .
        ?annot a up:Natural_Variant_Annotation ; up:substitution ?substitution .
        OPTIONAL { ?annot skos:related ?disease . ?disease skos:prefLabel ?diseaseLabel . }   # ~39% carry a disease
        OPTIONAL { ?annot rdfs:seeAlso ?dbsnp . FILTER(STRSTARTS(STR(?dbsnp), "http://purl.uniprot.org/dbsnp/")) }  # ~66% carry dbSNP
      }
    verified: {result_rows: 1363, date: "2026-07-29", note: "row count includes the OPTIONAL cross-product; use DISTINCT on ?substitution for unique substitutions"}
    teaches: "Natural_Variant_Annotation carries up:substitution; disease is skos:related -> up:Disease -> skos:prefLabel (variant-level), dbSNP is rdfs:seeAlso by prefix."
    traps_avoided:
      - "Variant-level disease is skos:related; the PROTEIN-level disease link is a different predicate (up:annotation -> Disease_Annotation -> up:disease). Do not conflate the two tiers."

  - id: faldo_positions
    intent: positional features of a protein (PTMs, domains, binding sites) via FALDO ranges
    question: "What modified residues, domains, and binding sites does TP53 (P04637) have, with positions?"
    complexity: intermediate
    sparql: |
      PREFIX up: <http://purl.uniprot.org/core/>
      PREFIX uniprot: <http://purl.uniprot.org/uniprot/>
      PREFIX faldo: <http://biohackathon.org/resource/faldo#>
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
      SELECT ?annotType ?comment ?beginPos ?endPos
      WHERE {
        VALUES ?protein { uniprot:P04637 }
        ?protein up:annotation ?annot .
        ?annot a ?annotType .
        OPTIONAL { ?annot rdfs:comment ?comment }
        OPTIONAL { ?annot up:range ?range . ?range faldo:begin/faldo:position ?beginPos ; faldo:end/faldo:position ?endPos . }
        FILTER(?annotType IN (up:Modified_Residue_Annotation, up:Domain_Annotation, up:Binding_Site_Annotation))
      }
    verified: {result_rows: 36, distinct_types: 3, date: "2026-07-29"}
    teaches: "ALL positional features use FALDO: up:annotation -> typed *_Annotation -> up:range -> faldo:begin/end -> faldo:position. Filter by annotation type."

  - id: ec_class
    intent: proteins by EC class via the up:enzyme IRI-prefix filter
    question: "How many reviewed proteins are transferases (EC 2.7.*)?"
    complexity: intermediate
    sparql: |
      PREFIX up: <http://purl.uniprot.org/core/>
      SELECT (COUNT(DISTINCT ?protein) AS ?n)
      FROM <http://sparql.uniprot.org/uniprot>
      WHERE {
        ?protein a up:Protein ; up:reviewed 1 ; up:enzyme ?ecNumber .
        FILTER(STRSTARTS(STR(?ecNumber), "http://purl.uniprot.org/enzyme/2.7"))
      }
    verified: {n: 34120, date: "2026-07-29"}
    teaches: "up:enzyme points at an EC IRI (purl.uniprot.org/enzyme/X.X.X.X); STRSTARTS on the prefix selects a whole EC subtree."

  - id: taxonomy_agg               # ELEVATED `aggregation` class — clade counts on the flat lineage
    intent: aggregate proteins per taxonomic clade using the pre-flattened single-hop lineage
    question: "Which bacterial order has more reviewed carbon-fixation proteins: Enterobacterales or Synechococcales?"
    complexity: aggregation
    sparql: |
      PREFIX up: <http://purl.uniprot.org/core/>
      PREFIX taxonomy: <http://purl.uniprot.org/taxonomy/>
      PREFIX obo: <http://purl.obolibrary.org/obo/>
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
      SELECT ?order (COUNT(DISTINCT ?protein) AS ?count)
      FROM <http://sparql.uniprot.org/uniprot>
      FROM <http://sparql.uniprot.org/taxonomy>
      WHERE {
        VALUES ?order { taxonomy:91347 taxonomy:1890424 }    # Enterobacterales, Synechococcales
        VALUES ?goTerm { obo:GO_0015977 obo:GO_0043427 }     # carbon fixation, C4 photosynthesis
        ?protein a up:Protein ; up:reviewed 1 ; up:organism ?organism ; up:classifiedWith ?goTerm .
        ?organism rdfs:subClassOf ?order .
      }
      GROUP BY ?order ORDER BY DESC(?count)
    verified: {Enterobacterales_91347: 61, Synechococcales_1890424: 53, date: "2026-07-29"}
    teaches: "Reach a clade with a SINGLE-HOP ?organism rdfs:subClassOf ?order; pin both graphs (FROM uniprot + taxonomy)."
    traps_avoided:
      - "Use the single hop, NOT rdfs:subClassOf* — the lineage is pre-flattened so both return the same set, but the transitive form is ~30x slower where it runs at all and Virtuoso rejects it outright when neither end is bound (gotcha flat_lineage). Pinning the taxonomy graph also avoids the taxon-multiplication trap."

  - id: xdb_rhea                    # ELEVATED `cross_db` class
    intent: "cross-DB: human enzymes -> catalysed Rhea reactions via shared EC IRIs (same SIB endpoint)"
    question: "Which Rhea reactions do human reviewed enzymes catalyse?"
    complexity: cross_db
    endpoint_name: sib
    sparql: |
      PREFIX up: <http://purl.uniprot.org/core/>
      PREFIX rhea: <http://rdf.rhea-db.org/>
      SELECT ?protein ?mnemonic ?ecNumber ?reaction ?equation
      WHERE {
        GRAPH <http://sparql.uniprot.org/uniprot> {
          ?protein a up:Protein ; up:reviewed 1 ;
                   up:organism <http://purl.uniprot.org/taxonomy/9606> ;
                   up:mnemonic ?mnemonic ; up:enzyme ?ecNumber .
        }
        GRAPH <http://rdfportal.org/dataset/rhea> {
          ?reaction rdfs:subClassOf rhea:Reaction ; rhea:status rhea:Approved ;
                    rhea:ec ?ecNumber ; rhea:equation ?equation .
        }
      }
      LIMIT 25
    verified: {result_rows: 25, date: "2026-07-29", first_row: "P00326 ADH1G_HUMAN -> rhea:10736 (primary alcohol + NAD+ = aldehyde + NADH + H+)"}
    teaches: "UniProt up:enzyme EC IRIs are the SAME IRIs as Rhea rhea:ec — a direct GRAPH join, no text search, no ID bridge."
    traps_avoided:
      - say: "The aggregate COUNT form of this join is expensive but NOT fatal: 16.8s for 5,276 rows (re-measured 2026-08-26 — this line claimed >60s/timeout until then, which was wrong). Pre-filter one side to a single EC or organism if you need it faster; the LIMIT row form above is 0.4s."
        check:
          kind: count       # the COUNT form COMPLETES — asserting otherwise steers readers off a working route
          date: "2026-08-26"
          query: |
            PREFIX up: <http://purl.uniprot.org/core/>
            PREFIX rhea: <http://rdf.rhea-db.org/>
            PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
            SELECT (COUNT(*) AS ?n) WHERE {
              GRAPH <http://sparql.uniprot.org/uniprot> {
                ?protein a up:Protein ; up:reviewed 1 ; up:organism <http://purl.uniprot.org/taxonomy/9606> ;
                         up:mnemonic ?mnemonic ; up:enzyme ?ecNumber .
              }
              GRAPH <http://rdfportal.org/dataset/rhea> {
                ?reaction rdfs:subClassOf rhea:Reaction ; rhea:status rhea:Approved ;
                          rhea:ec ?ecNumber ; rhea:equation ?equation .
              }
            }
          expect: {value: 5276, tolerance: 0.10}

  - id: xdb_mesh
    intent: "cross-DB: human disease proteins -> MeSH descriptor label (co-hosted, direct join)"
    question: "What MeSH descriptors correspond to the diseases of human reviewed proteins?"
    complexity: cross_db
    endpoint_name: sib
    sparql: |
      PREFIX up: <http://purl.uniprot.org/core/>
      PREFIX skos: <http://www.w3.org/2004/02/skos/core#>
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
      SELECT ?protein ?mnemonic ?diseaseLabel ?meshLabel
      WHERE {
        GRAPH <http://sparql.uniprot.org/uniprot> {
          ?protein a up:Protein ; up:reviewed 1 ;
                   up:organism <http://purl.uniprot.org/taxonomy/9606> ;
                   up:mnemonic ?mnemonic ; up:annotation ?annot .
          ?annot a up:Disease_Annotation ; up:disease ?disease .
        }
        GRAPH <http://sparql.uniprot.org/diseases> {
          ?disease skos:prefLabel ?diseaseLabel ; rdfs:seeAlso ?meshIRI .
          FILTER(STRSTARTS(STR(?meshIRI), "http://id.nlm.nih.gov/mesh/"))
        }
        GRAPH <http://id.nlm.nih.gov/mesh> { ?meshIRI rdfs:label ?meshLabel . }
      }
      LIMIT 15
    verified: {result_rows: 15, date: "2026-07-29", first_row: "P25054 APC_HUMAN -> 'Desmoid disease, hereditary' -> MeSH 'Abdominal Neoplasms'"}
    teaches: "up:disease -> up:Disease rdfs:seeAlso -> MeSH descriptor IRI (prefix-filtered), whose rdfs:label lives in the co-hosted mesh graph — one join, no bridge."

  - id: xdb_oma
    intent: "cross-DB: UniProt <-> OMA cross-references (Ensembl protein, RefSeq) via reverse xref"
    question: "What is the OMA entry and its Ensembl/RefSeq cross-references for TP53 (P04637)?"
    complexity: cross_db
    endpoint_name: sib
    sparql: |
      PREFIX up: <http://purl.uniprot.org/core/>
      PREFIX lscr: <http://purl.org/lscr#>
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
      PREFIX uniprot: <http://purl.uniprot.org/uniprot/>
      SELECT ?omaEntry ?omaLabel ?ensemblProtein ?refseq
      WHERE {
        GRAPH <http://sparql.uniprot.org/uniprot> { uniprot:P04637 a up:Protein ; up:reviewed 1 . }
        GRAPH <http://rdfportal.org/dataset/oma> {
          ?omaEntry lscr:xrefSwissProt uniprot:P04637 ; rdfs:label ?omaLabel .
          OPTIONAL { ?omaEntry lscr:xrefEnsemblProtein ?ensemblProtein }
          OPTIONAL { ?omaEntry lscr:xrefNCBIRefSeq ?refseq }
        }
      }
      LIMIT 10
    verified: {result_rows: 4, date: "2026-07-29", first_row: "OMA HUMAN31522 'TP53' -> ENSP00000484409 / NP_001119589"}
    teaches: "OMA reverse-links to the SAME UniProt IRI via lscr:xrefSwissProt (460,199 triples); the OMA entry then carries Ensembl-protein + RefSeq xrefs. Direct join, no bridge."
    traps_avoided:
      - "This same-IRI reuse is ALSO the count-inflation source (gotcha union_inflation) — the join opportunity and the hazard share one cause."

  - id: xdb_bgee
    intent: "cross-DB: anatomical structures where a protein is expressed, via Bgee xref + IRI transform"
    question: "In which anatomical structures is TP53 (P04637) expressed, per Bgee?"
    complexity: cross_db
    endpoint_name: sib
    sparql: |
      PREFIX up: <http://purl.uniprot.org/core/>
      PREFIX genex: <http://purl.org/genex#>
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
      SELECT DISTINCT ?anatLabel
      WHERE {
        GRAPH <http://sparql.uniprot.org/uniprot> {
          <http://purl.uniprot.org/uniprot/P04637> rdfs:seeAlso ?bgeeRef .
          FILTER(STRSTARTS(STR(?bgeeRef), "http://purl.uniprot.org/bgee/"))
          BIND(IRI(CONCAT("http://omabrowser.org/ontology/oma#GENE_", STRAFTER(STR(?bgeeRef), "bgee/"))) AS ?bgeeGene)
        }
        GRAPH <http://bgee.org> {
          ?bgeeGene genex:isExpressedIn ?anatEntity . ?anatEntity rdfs:label ?anatLabel .
        }
      }
      LIMIT 15
    verified: {result_rows: 15, date: "2026-07-29", first_rows: "uterine cervix, nose, islet of Langerhans, pituitary gland"}
    teaches: "Bgee has no direct UniProt IRI: take rdfs:seeAlso purl.uniprot.org/bgee/<ENSG> (94.1% of human reviewed), then BIND-transform to omabrowser.org/ontology/oma#GENE_<ENSG> to reach the bgee graph."

# ── schema_delta: ONLY non-obvious predicates/idioms no example above already demonstrates.
#    If a predicate appears in an example, it is NOT repeated here. ──
schema_delta:
  - "Gene symbol: ?protein up:encodedBy ?gene . ?gene skos:prefLabel ?symbol (skos:altLabel = synonyms). 87.7% coverage — 46,270 of the 550,744 gene-bearing entries have an unnamed gene node."
  - "Catalytic activity is an indirect 3-hop scaffold: up:annotation -> up:Catalytic_Activity_Annotation -> up:catalyticActivity -> up:catalyzedReaction -> Rhea IRI. Do not reach ?reaction directly from ?protein. (Example xdb_rhea joins the same reactions via the EC IRI instead.)"
  - "Isoforms: canonical = uniprot:ACC-1 (Simple_Sequence); alternates uniprot:ACC-2..N (Modified_Sequence). Suffix -N = isoform number, not an index."
  - "dcterms:identifier ON A PROTEIN is OMA-supplied (co-hosted graph only; 0 in sparql.uniprot.org/uniprot, verified 2026-08-26), NOT the native accession — so a protein query must not reach for it. But the PREDICATE is not absent from UniProt, which this entry wrongly implied until 2026-08-26: it carries citation DOIs (citations, 1,639,486), proteome IDs (proteomes, 1,044,473), EC numbers (enzyme, 2,554), DB names (databases, 361) and location IDs (locations, 18). Native protein accession = STRAFTER(STR(?p),'uniprot/'); up:mnemonic = e.g. 'P53_HUMAN'."

# ── id_join_map: the least-recoverable asset — how to anchor stably and cross to other DBs. ──
id_join_map:
  stable_anchor: "Accession IRI uniprot:P04637 (= localname of the up:Protein IRI). up:mnemonic is a secondary human key (P53_HUMAN)."
  same_endpoint_joins:            # SIB co-hosted — direct GRAPH join, NO TogoID
    rhea: "up:enzyme EC IRI == rhea:ec (see example xdb_rhea)"
    mesh: "up:disease -> up:Disease rdfs:seeAlso -> id.nlm.nih.gov/mesh/ (see example xdb_mesh)"
    oma:  "reverse: OMA ?e lscr:xrefSwissProt uniprot:ACC (460,199 triples); ?e also carries Ensembl-protein + RefSeq xrefs (see example xdb_oma)"
    bgee: "rdfs:seeAlso purl.uniprot.org/bgee/<ENSG> (94.1% of human reviewed) + IRI transform to the bgee graph (see example xdb_bgee)"
  xref_via_seeAlso:               # rdfs:seeAlso, prefix-filtered; coverage of reviewed proteins
    pdb: "rdf.wwpdb.org ~13-15%"
    alphafold: "alphafolddb >98%"
    embl: "~95%"
    refseq: "~80%"
    hgnc: "100% of human"
    interpro: ">98%"
    dbsnp: "purl.uniprot.org/dbsnp/rs... (~66% of natural variants)"
    omim: "purl.uniprot.org/mim/..."
  bridged_via_togoid:             # NOT co-hosted — use togoid_convertId
    - "PDB, ChEMBL, Ensembl accession bridging still routes through TogoID."
