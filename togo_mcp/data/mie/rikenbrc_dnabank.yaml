# MIE v3 — RIKEN BRC Gene Engineering Division DNA material catalogue (graph xsearch_dnabank), 2026-11-12.
# Served from RIKEN BRC's own endpoint (knowledge.brc.riken.jp, endpoint_name rikenbrc), NOT RDF Portal.
mie_spec: 3
database: rikenbrc_dnabank

discovery:
  title: RIKEN BRC DNA — RIKEN BioResource Research Center DNA material catalogue
  description: >
    Catalogue of ~170k DNA materials distributed by the RIKEN BRC DNA Bank — human cDNA clone sets (GNP, NRCD),
    NIA/NIH mouse cDNA, marmoset cDNA, S. pombe and thermophile genome clones, expression and visualisation
    vectors, BAC clones and microbial genomic DNA — with the carried gene (NCBI Gene, OMA), vector, host strain,
    source tissue, organism, depositor and references.
  keywords: [biological resource, dna clone, cdna clone, plasmid, expression vector, bac clone, orfeome,
             fluorescent protein vector, genomic dna, gene resource, ncbi gene, riken brc, bioresource]
  categories: [biological resource, gene]

endpoint: https://knowledge.brc.riken.jp/sparql   # RIKEN BRC's own Virtuoso — ~400 named graphs; endpoint_name rikenbrc
base_uri: http://metadb.riken.jp/db/rikenbrc_dnabank/   # clone IRI = base + <catalogue number> (RDB…, HGE…, HKR…, MCH…, SPW…, JGD…)
graphs:
  primary: http://metadb.riken.jp/db/xsearch_dnabank
  co_hosted:
    xsearch_dnabank_brso: >
      DUPLICATE + INFLATION. The same clones (same IRIs) re-modelled in BRSO and re-declaring the catalogue
      predicates: an unpinned query returns exactly ×2.00 the rows (gotcha graph_pin).
    xsearch_animal: >
      JOIN (example xdb_mouse_strains_for_human_gene). rikenbrc_mouse's gene nodes carry the same
      <http://identifiers.org/ncbigene/N> IRIs (rdfs:seeAlso for the mouse gene, xs:humanOrtholog for the human
      one), so clones and mouse strains join in ONE query on IRIs.
    xsearch_cell / xsearch_jcm / xsearch_plant: "Other RIKEN BRC catalogues on the same brs:/xs: schema — they bleed into any unpinned brs:/xs: pattern. Resource type 'Genomic DNA, microbe' (JCM_DNA) points at JCM strains."

entity_counts:                       # graph-pinned COUNT(DISTINCT), ?s rdfs:subClassOf dna:DNAResource — 2026-11-12
  clones: 169495                     # 169,493 with dct:identifier
  clones_with_ncbigene: 137307       # 36,096 distinct NCBI Gene IDs
  by_gene_taxon: {human_9606: 97060, mouse_10090: 19993, S_pombe_4896: 14598, marmoset_9483: 2003}
  by_resource_set: {GNP_dnabank20: 73465, NRCD_dnabank21: 39569, NIA_mouse_dnabank22: 22658, S_pombe_dnabank31: 14679,
                    thermophile_dnabank32: 5012, uncategorized_dnabank0: 4707, marmoset_dnabank23: 1999}
  clones_with_vector: 142817
  clones_with_host: 81179
  date: "2026-11-12"

global_gotchas:
  - id: graph_pin
    say: >
      GRAPH IS MANDATORY: wrap every pattern in GRAPH <http://metadb.riken.jp/db/xsearch_dnabank>. The endpoint holds
      ~400 graphs and xsearch_dnabank_brso repeats every clone, so an unpinned query returns ×2.00 the rows
      (45,316 vs 22,658 for the NIA mouse cDNA set). With 170k clones this also doubles the cost of every scan.
    check:
      kind: ratio
      date: "2026-11-12"
      unpinned: |
        SELECT (COUNT(*) AS ?n) WHERE { ?s <http://metadb.riken.jp/terms/xsearch#resourceTypeLink> <http://metadb.riken.jp/terms/xsearch#resource_type_dnabank22> }
      pinned: |
        SELECT (COUNT(*) AS ?n) WHERE { GRAPH <http://metadb.riken.jp/db/xsearch_dnabank> { ?s <http://metadb.riken.jp/terms/xsearch#resourceTypeLink> <http://metadb.riken.jp/terms/xsearch#resource_type_dnabank22> } }
      expect: {ratio: 2.0, tolerance: 0.02}
  - id: clones_are_classes
    say: >
      A clone is an rdfs:Class with `rdfs:subClassOf dna:DNAResource` — `?s a dna:DNAResource` matches nothing.
      Anchor clones with `?s rdfs:subClassOf dna:DNAResource` (169,495).
    check:
      kind: absent
      date: "2026-11-12"
      query: |
        SELECT ?s WHERE { GRAPH <http://metadb.riken.jp/db/xsearch_dnabank> { ?s a <http://metadb.riken.jp/db/rikenbrc_dnabank/DNAResource> } } LIMIT 1
  - id: literal_forms
    say: >
      Almost every literal is typed ^^xsd:string — dct:identifier, rdfs:label (clone name), dna:runningTitle,
      skos:altLabel (gene symbol), organism and host labels. A plain "HGE000552" matches 0 rows. Resource-type
      labels are @en/@ja. Write "…"^^xsd:string or FILTER(STR(?x) = "…").
    check:
      kind: zero_rows
      date: "2026-11-12"
      query: |
        SELECT ?s WHERE { GRAPH <http://metadb.riken.jp/db/xsearch_dnabank> { ?s <http://purl.org/dc/terms/identifier> "HGE000552" } } LIMIT 1
  - id: organism_labels_are_free_text
    say: >
      nbrp:organism → blank node rdfs:label is free text: 'Homo sapiens' 113,032 clones, 'Human' 3,256, 'human'
      1,316; 'Mus musculus', 'mouse', 'Mouse' likewise; most organism nodes carry no NCBITaxon. For species,
      use the gene node's obo:RO_0002162 NCBITaxon (example clones_by_gene_taxon), or match every spelling.
    check:
      kind: count
      date: "2026-11-12"
      query: |
        SELECT (COUNT(DISTINCT ?s) AS ?n) WHERE { GRAPH <http://metadb.riken.jp/db/xsearch_dnabank> { ?s <http://nbrp.jp/ontology/organism> ?o . ?o <http://www.w3.org/2000/01/rdf-schema#label> "Human"^^<http://www.w3.org/2001/XMLSchema#string> } }
      expect: {value: 3256}
  - id: resource_type_labels_collide
    say: >
      Resource-type labels are not unique: resource_type_dnabank20 (GNP) and _dnabank21 (NRCD) are both 'Human
      cDNA from clone set'; _31 and _32 are both 'others from genome clone set'. Group by the type IRI and show
      its skos:altLabel (the clone-set code), never by the label.

examples:
  - id: clone_record
    intent: core record for one clone by catalogue number
    question: "What is RIKEN BRC DNA clone HGE000552 — which gene, resource set, host and source tissue?"
    complexity: basic
    sparql: |
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
      PREFIX skos: <http://www.w3.org/2004/02/skos/core#>
      PREFIX dct:  <http://purl.org/dc/terms/>
      PREFIX xsd:  <http://www.w3.org/2001/XMLSchema#>
      PREFIX brs:  <http://metadb.riken.jp/db/bioresource_schema/>
      PREFIX xs:   <http://metadb.riken.jp/terms/xsearch#>
      PREFIX dna:  <http://metadb.riken.jp/db/rikenbrc_dnabank/>
      SELECT ?s ?name ?title ?symbol ?gene ?set ?host ?tissue WHERE {
        GRAPH <http://metadb.riken.jp/db/xsearch_dnabank> {
          ?s rdfs:subClassOf dna:DNAResource ; dct:identifier "HGE000552"^^xsd:string ; rdfs:label ?name .
          OPTIONAL { ?s dna:runningTitle ?title }
          OPTIONAL { ?s brs:brs_hasGenomicFeature/brs:brs_hasGene ?g . ?g skos:altLabel ?symbol ; rdfs:seeAlso ?gene .
                     FILTER(STRSTARTS(STR(?gene), "http://identifiers.org/ncbigene/")) }
          OPTIONAL { ?s xs:resourceTypeLink/skos:altLabel ?set }
          OPTIONAL { ?s brs:brs_hasHost/rdfs:label ?host }
          OPTIONAL { ?s brs:brs_derivedFrom/rdfs:label ?tissue }
        }
      }
    verified: {row_count: 1, has_values: ["HGE000552", "W01A001G08", "SAP18", "10284", "GNP", "DH10B", "Brain, hypothalamus"], date: "2026-11-12"}
    teaches: "Catalogue number = dct:identifier; rdfs:label is the clone's own name (W01A001G08), dna:runningTitle the human-readable title. Gene node = clone → brs:brs_hasGenomicFeature → brs:brs_hasGene (blank node, a brs:brs_gene): skos:altLabel symbol, rdfs:label name, obo:RO_0002162 taxon, rdfs:seeAlso NCBI Gene (two IRI forms) + OMA. Host strain = brs_hasHost label; source tissue = brs_derivedFrom label; vector = brs_hasGenomicFeature → brs_hasVector."

  - id: clones_by_ncbigene
    intent: the literal-free gene anchor — all clones of one NCBI Gene ID
    question: "Which RIKEN BRC DNA clones carry human PAX6 (NCBI Gene 5080)?"
    complexity: basic
    sparql: |
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
      PREFIX dct:  <http://purl.org/dc/terms/>
      PREFIX brs:  <http://metadb.riken.jp/db/bioresource_schema/>
      PREFIX dna:  <http://metadb.riken.jp/db/rikenbrc_dnabank/>
      SELECT ?id ?title WHERE {
        GRAPH <http://metadb.riken.jp/db/xsearch_dnabank> {
          ?s rdfs:subClassOf dna:DNAResource ; dct:identifier ?id ;
             brs:brs_hasGenomicFeature/brs:brs_hasGene/rdfs:seeAlso <http://identifiers.org/ncbigene/5080> .
          OPTIONAL { ?s dna:runningTitle ?title }
        }
      } ORDER BY ?id
    verified: {row_count: 7, has_values: ["HGE022081", "HKR184411", "RDB05898"], date: "2026-11-12"}
    teaches: "Match the NCBI Gene IRI (http://identifiers.org/ncbigene/N — the same form as the `ncbigene` database and as rikenbrc_mouse's gene xrefs). One clone per row; each clone carries one gene."
    traps_avoided:
      - say: "A symbol is not species-specific: skos:altLabel \"PAX6\"^^xsd:string matches 7 human clones AND 1 marmoset clone. Restrict symbol searches with the gene node's obo:RO_0002162, or use the NCBI Gene IRI."
        check:
          kind: count
          date: "2026-11-12"
          query: |
            SELECT (COUNT(DISTINCT ?s) AS ?n) WHERE { GRAPH <http://metadb.riken.jp/db/xsearch_dnabank> { ?s <http://www.w3.org/2000/01/rdf-schema#subClassOf> <http://metadb.riken.jp/db/rikenbrc_dnabank/DNAResource> ; <http://metadb.riken.jp/db/bioresource_schema/brs_hasGenomicFeature>/<http://metadb.riken.jp/db/bioresource_schema/brs_hasGene> ?g . ?g <http://www.w3.org/2004/02/skos/core#altLabel> "PAX6"^^<http://www.w3.org/2001/XMLSchema#string> } }
          expect: {value: 8}

  - id: resource_set_counts
    intent: the SET-LEVEL clone-set route — xs:resourceTypeLink grouped by IRI with its set code
    question: "Which DNA clone sets does RIKEN BRC distribute, and how many clones are in each?"
    complexity: aggregation
    sparql: |
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
      PREFIX skos: <http://www.w3.org/2004/02/skos/core#>
      PREFIX xs:   <http://metadb.riken.jp/terms/xsearch#>
      PREFIX dna:  <http://metadb.riken.jp/db/rikenbrc_dnabank/>
      SELECT ?type ?set ?label (COUNT(DISTINCT ?s) AS ?clones) WHERE {
        GRAPH <http://metadb.riken.jp/db/xsearch_dnabank> {
          ?s rdfs:subClassOf dna:DNAResource ; xs:resourceTypeLink ?type .
          OPTIONAL { ?type skos:altLabel ?set }
          OPTIONAL { ?type rdfs:label ?label FILTER(LANG(?label) = "en") }
        }
      } GROUP BY ?type ?set ?label ORDER BY DESC(?clones) ?type LIMIT 10
    verified: {min_rows: 10, has_values: ["resource_type_dnabank20", "GNP", 73465, "NRCD", 39569, "NIA_mouse", 22658], date: "2026-11-12"}
    teaches: "33 resource types, one per clone. skos:altLabel is the clone-set code (GNP, NRCD, NIA_mouse, EST_marmoset, Vis_FP, JCM_DNA …) and is what separates types that share a label (gotcha resource_type_labels_collide)."

  - id: clones_by_gene_taxon
    intent: species of the carried gene — the reliable species route (organism labels are free text)
    question: "From which species are the genes carried by RIKEN BRC DNA clones, and how many clones per species?"
    complexity: aggregation
    sparql: |
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
      PREFIX obo:  <http://purl.obolibrary.org/obo/>
      PREFIX brs:  <http://metadb.riken.jp/db/bioresource_schema/>
      PREFIX dna:  <http://metadb.riken.jp/db/rikenbrc_dnabank/>
      SELECT ?tax (COUNT(DISTINCT ?s) AS ?clones) WHERE {
        GRAPH <http://metadb.riken.jp/db/xsearch_dnabank> {
          ?s rdfs:subClassOf dna:DNAResource ; brs:brs_hasGenomicFeature/brs:brs_hasGene/obo:RO_0002162 ?tax .
        }
      } GROUP BY ?tax ORDER BY DESC(?clones) ?tax LIMIT 6
    verified: {min_rows: 6, has_values: ["NCBITaxon_9606", 97060, "NCBITaxon_10090", 19993, "NCBITaxon_4896", 14598], date: "2026-11-12"}
    teaches: "Gene taxon is obo:NCBITaxon_N (OBO form, joinable to `taxonomy` by number). Scans ~140k clones in a few seconds — fine as a whole-catalogue aggregate; vectors and clones without a gene node are not counted."

  - id: xdb_mouse_strains_for_human_gene
    intent: same-endpoint cross-catalogue join — DNA clones of a human gene AND mouse strains carrying its mouse ortholog
    question: "For human PAX6, which RIKEN BRC DNA clones and which RIKEN BRC mouse strains (carrying the mouse ortholog) are available?"
    complexity: cross_db
    endpoint_name: rikenbrc
    sparql: |
      PREFIX brs:  <http://metadb.riken.jp/db/bioresource_schema/>
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
      PREFIX xs:   <http://metadb.riken.jp/terms/xsearch#>
      PREFIX dct:  <http://purl.org/dc/terms/>
      SELECT ?catalogue (COUNT(DISTINCT ?r) AS ?resources) (GROUP_CONCAT(DISTINCT STR(?id); separator=" ") AS ?ids) WHERE {
        VALUES ?human { <http://identifiers.org/ncbigene/5080> }
        { GRAPH <http://metadb.riken.jp/db/xsearch_dnabank> { ?r brs:brs_hasGenomicFeature/brs:brs_hasGene/rdfs:seeAlso ?human ; dct:identifier ?id }
          BIND("1 DNA clones of the human gene" AS ?catalogue) }
        UNION
        { GRAPH <http://metadb.riken.jp/db/xsearch_animal> { ?r brs:brs_hasGenomicFeature/brs:brs_hasGene/xs:humanOrtholog ?human ; dct:identifier ?id }
          BIND("2 mouse strains carrying its mouse ortholog" AS ?catalogue) }
      } GROUP BY ?catalogue ORDER BY ?catalogue
    verified: {row_count: 2, has_values: ["1 DNA clones of the human gene", 7, "2 mouse strains carrying its mouse ortholog", 9], date: "2026-11-12"}
    teaches: "Both catalogues are on this endpoint and share NCBI Gene IRIs, so one query spans them — each branch pinned to its own graph (see the rikenbrc_mouse MIE for the strain side). IRIs join directly; no re-typing needed (contrast rikenbrc_cell's cross_graph_literal_join)."

id_join_map:
  stable_anchor: >
    Clone = http://metadb.riken.jp/db/rikenbrc_dnabank/<catalogue number>; dct:identifier repeats the number
    (xsd:string); foaf:page = http://dna.brc.riken.jp/DataSheet/<number>.
  same_endpoint_joins:
    xsearch_animal: "gene node rdfs:seeAlso <http://identifiers.org/ncbigene/N> = rikenbrc_mouse gene rdfs:seeAlso (mouse gene) / xs:humanOrtholog (human gene) — example xdb_mouse_strains_for_human_gene"
  xrefs:
    ncbigene: "gene node rdfs:seeAlso <http://identifiers.org/ncbigene/N> (= `ncbigene` base_uri) and https://www.ncbi.nlm.nih.gov/gene/N — filter to one prefix. SERVICE to https://rdfportal.org/ncbi/sparql works from this endpoint (see rikenbrc_mouse)."
    oma: "gene node rdfs:seeAlso <https://omabrowser.org/oma/info/HUMANnnnnn> — several per gene (one per isoform entry)"
    taxonomy: "gene node obo:RO_0002162 obo:NCBITaxon_N"
    pubmed: "clone cito:citesAsAuthority <http://rdf.ncbi.nlm.nih.gov/pubmed/N>"

schema_delta:
  - "Gene dictionary: <http://identifiers.org/ncbigene/N> also appears as a SUBJECT (rdfs:label, skos:altLabel, xs:hasSynonyms, obo:RO_0002162) — a name/synonym lookup table separate from the per-clone gene nodes."
  - "Vector: clone → brs:brs_hasGenomicFeature → brs:brs_hasVector → node; vector classes dna:vectorType_N form an rdfs:subClassOf hierarchy. dna:hasKeyword (xsd:string, 3,571) tags vectors ('pH', …)."
  - "brs:brs_depositedBy / brs:brs_developedBy → node with rdfs:label (@en person or organisation name)."
