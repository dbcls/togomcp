id: question_044
type: list
body: "Which human sialic acid-binding Ig-like lectin (siglec) proteins have glycan structures, determined by site-resolved glycoproteomic mass spectrometry, curated at specific glycosylation sites by an experimental glycoprotein knowledgebase (not merely inherited from a general aggregator or a predicted-site resource)?"

inspiration_keyword:
  keyword_id: KW-0430
  name: Lectin
  category: Molecular function

togomcp_databases_used:
  - glycosmos
  - uniprot

verification_score:
  biological_insight: 3
  multi_database: 2
  verifiability: 3
  rdf_necessity: 3
  total: 11
  passed: true

pubmed_test:
  time_spent: 10 minutes
  method: >
    Searched "siglec glycosylation GlyConnect experimental characterization" and
    "siglec N-glycosylation site mapping experimental" via PubMed:search_articles.
    Both queries returned zero results.
  result: |
    No PubMed papers enumerate which specific siglec family members have curated
    site-specific N-glycan composition data in the GlyConnect knowledgebase. Papers
    on siglec biology discuss glycan ligand recognition (trans-interactions) but do
    not systematically document which siglecs have been glycoproteomic-MS-characterized
    per site. The four-protein answer reflects current GlyConnect curation state, which
    changes as new mass spectrometry data are processed.
  conclusion: PASS (cannot answer from literature - requires current GlycoSMOS/GlyConnect state)

sparql_queries:
  - query_number: 1
    database: glycosmos
    description: >
      Enumerate all human sialic acid-binding Ig-like lectin (siglec) glycoproteins
      in GlycoSMOS to establish the total family population (11 proteins).
    query: |
      PREFIX glycan: <http://purl.jp/bio/12/glyco/glycan#>
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>

      SELECT DISTINCT ?protein ?label
      FROM <http://rdf.glycosmos.org/glycoprotein>
      WHERE {
        ?protein a glycan:Glycoprotein ;
                 glycan:has_taxon <http://identifiers.org/taxonomy/9606> ;
                 rdfs:label ?label .
        FILTER(CONTAINS(LCASE(?label), "sialic acid-binding ig"))
      }
      ORDER BY ?label
    result_count: 11

  - query_number: 2
    database: glycosmos
    description: >
      Siglecs whose glycosylation sites carry glycan structures with experimental-knowledgebase provenance.
      Refreshed 2026-10-01: GlyCosmos moved the GlyConnect link from sio:SIO_000772 on the site (the old
      query now returns 0 rows) to dct:source on each per-site annotation node (sio:SIO_000255), which also
      carries the glycan (has_saccharide) and a PubMed reference. Returns the same 4 siglecs: SIGLEC5 (1 site,
      33 glycans, GlyConnect 568), SIGLEC7 (1 site, 31, 569), SIGLEC8 (1 site, 27, 570) and SIGLEC14 (5
      sites, 9, 1978).
    query: |
      PREFIX glycan: <http://purl.jp/bio/12/glyco/glycan#>
      PREFIX glycoconjugate: <http://purl.jp/bio/12/glyco/conjugate#>
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
      PREFIX sio: <http://semanticscience.org/resource/>
      PREFIX dct: <http://purl.org/dc/terms/>

      SELECT ?protein ?label ?glyconnect_ref
             (COUNT(DISTINCT ?site) AS ?site_count)
             (COUNT(DISTINCT ?glycan) AS ?glycan_count)
      FROM <http://rdf.glycosmos.org/glycoprotein>
      WHERE {
        ?protein a glycan:Glycoprotein ;
                 glycan:has_taxon <http://identifiers.org/taxonomy/9606> ;
                 rdfs:label ?label ;
                 glycoconjugate:glycosylated_at ?site .
        FILTER(CONTAINS(LCASE(?label), "sialic acid-binding ig"))
        # site-level glycan annotation whose provenance is the experimental glycoprotein knowledgebase
        ?site sio:SIO_000255 ?annotation .
        ?annotation glycoconjugate:has_saccharide ?glycan ;
                    dct:source ?glyconnect_ref .
        FILTER(STRSTARTS(STR(?glyconnect_ref), "https://purl.org/glyconnect/"))
      }
      GROUP BY ?protein ?label ?glyconnect_ref
      ORDER BY ?label
    result_count: 4

  - query_number: 3
    database: uniprot
    description: >
      Retrieve gene names and confirm SwissProt-reviewed status for the four
      siglecs with GlyConnect data (O15389/SIGLEC5, Q9Y286/SIGLEC7,
      Q9NYZ4/SIGLEC8, Q08ET2/SIGLEC14).
    query: |
      PREFIX up: <http://purl.uniprot.org/core/>
      PREFIX skos: <http://www.w3.org/2004/02/skos/core#>

      SELECT DISTINCT ?protein ?name ?gene ?mnemonic
      WHERE {
        VALUES ?protein {
          <http://purl.uniprot.org/uniprot/O15389>
          <http://purl.uniprot.org/uniprot/Q9Y286>
          <http://purl.uniprot.org/uniprot/Q9NYZ4>
          <http://purl.uniprot.org/uniprot/Q08ET2>
        }
        ?protein a up:Protein ;
                 up:mnemonic ?mnemonic ;
                 up:reviewed true ;
                 up:recommendedName/up:fullName ?name .
        OPTIONAL { ?protein up:encodedBy/skos:prefLabel ?gene }
      }
    result_count: 4

  - query_number: 4
    database: glycosmos
    description: >
      Rule-3 verification on the new model: of the 11 human siglecs, 4 have at least one site-level glycan
      with GlyConnect provenance, so 7 do not (4 + 7 = 11). Refreshed 2026-10-01 (the old SIO_000772 form
      returned 0).
    query: |
      PREFIX glycan: <http://purl.jp/bio/12/glyco/glycan#>
      PREFIX glycoconjugate: <http://purl.jp/bio/12/glyco/conjugate#>
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
      PREFIX sio: <http://semanticscience.org/resource/>
      PREFIX dct: <http://purl.org/dc/terms/>

      SELECT (COUNT(DISTINCT ?protein) AS ?all_siglecs)
             (COUNT(DISTINCT ?with) AS ?with_glyconnect_site_glycans)
      FROM <http://rdf.glycosmos.org/glycoprotein>
      WHERE {
        ?protein a glycan:Glycoprotein ;
                 glycan:has_taxon <http://identifiers.org/taxonomy/9606> ;
                 rdfs:label ?label .
        FILTER(CONTAINS(LCASE(?label), "sialic acid-binding ig"))
        BIND(IF(EXISTS {
               ?protein glycoconjugate:glycosylated_at ?site .
               ?site sio:SIO_000255 ?annotation .
               ?annotation glycoconjugate:has_saccharide ?glycan ; dct:source ?src .
               FILTER(STRSTARTS(STR(?src), "https://purl.org/glyconnect/"))
             }, ?protein, ?none) AS ?with)
      }
    result_count: 1

arithmetic_verification:
  query: "GlycoSMOS: siglecs with GlyConnect data (Q2) vs. without (Q4)"
  sum_of_category_counts: 11
  total_distinct_entities: 11
  result: "Sum (4 + 7 = 11) = Total (11) — VALID, mutually exclusive categories (Query 4, refreshed 2026-10-01)"
  interpretation: |
    11 human siglec glycoproteins exist in GlyCosmos. Exactly 4 have site-level glycan
    annotations whose dct:source is GlyConnect (SIGLEC5, 7, 8, 14). Of the remaining 7,
    SIGLEC6, 9, 10, 11 and 16 carry site-level glycans sourced from GlyGen, SIGLEC12 and 16
    O-GlcNAc from the O-GlcNAc database, and SIGLEC15 none; none of these has GlyConnect
    provenance. Categories are mutually exclusive.

