exact_answer:
  - "SIGLEC5 (UniProt:O15389)"
  - "SIGLEC7 (UniProt:Q9Y286)"
  - "SIGLEC8 (UniProt:Q9NYZ4)"
  - "SIGLEC14 (UniProt:Q08ET2)"

ideal_answer: |
  Four: SIGLEC5 (UniProt O15389), SIGLEC7 (Q9Y286), SIGLEC8 (Q9NYZ4) and SIGLEC14 (Q08ET2). Of the eleven
  human siglecs (SIGLEC5, 6, 7, 8, 9, 10, 11, 12, 14, 15 and 16), these are the only ones whose
  glycosylation sites carry glycan structures from the experimental glycoprotein knowledgebase GlyConnect,
  which curates site-resolved glycoproteomic mass spectrometry: SIGLEC5 has 33 distinct glycans at one
  site (GlyConnect 568), SIGLEC7 31 at one site (569), SIGLEC8 27 at one site (570), and SIGLEC14 9 across
  five sites (1978). The other siglecs are not bare: SIGLEC6, 9, 10, 11 and 16 carry a few site-level
  glycans relayed by the GlyGen aggregator, and SIGLEC12 and 16 O-GlcNAc records, but none of these has
  knowledgebase-curated glycoproteomic provenance.

