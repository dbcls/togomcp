id: question_109
type: choice
held_out: true   # created 2026-09-30; never used for MIE development
body: "Phospholipid degradation by phospholipases leaves lysophospholipids that carry their single
  acyl chain either at sn-1 (1-acyl) or at sn-2 (2-acyl), and a cell can re-acylate them with an
  acyl-CoA. In curated biochemical reactions, for which of the following headgroup classes is the
  1-acyl lysophospholipid recorded as an acyl-CoA acceptor while the 2-acyl lysophospholipid, although
  produced by recorded reactions, never is?"

choices:
  - phosphatidylcholine
  - phosphatidylethanolamine
  - phosphatidylserine
  - phosphatidylinositol
  - phosphatidylglycerol

inspiration_keyword:
  keyword_id: KW-0595
  name: Phospholipid degradation
  category: Biological process

togomcp_databases_used:
  - swisslipids
  - chebi
  - rhea

verification_score:
  biological_insight: 2
  multi_database: 3
  verifiability: 3
  rdf_necessity: 3
  total: 11
  passed: true

pubmed_test:
  time_spent: 6 minutes
  method: |
    Two PubMed searches: "2-acyl lysophosphatidylglycerol acyltransferase acyl-CoA" (0 hits) and
    "acyl-CoA acylation 2-acyl lysophospholipids sn-1 position headgroup comparison
    lysophosphatidylcholine lysophosphatidylethanolamine lysophosphatidylglycerol" (0 hits).
  result: |
    No source compares, across headgroups, whether the 1-acyl and 2-acyl lysophospholipids are recorded
    as acyl-CoA acceptors. The answer comes from classifying curated reactions by the positional class
    of their lysophospholipid and by the presence of an acyl-CoA on the same side.
  conclusion: PASS (cannot answer from literature - requires current database state)

sparql_queries:
  - query_number: 1
    database: swisslipids
    description: >
      The ten SwissLipids lysophospholipid classes (1-acyl and 2-acyl, for choline, ethanolamine,
      L-serine, 1D-myo-inositol and sn-glycerol headgroups) with the ChEBI entity each is declared
      equivalent to. All ten point at the pH-7.3 form Rhea records (e.g. 2-acyl-lysoPG at CHEBI:76528).
    query: |
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
      PREFIX owl: <http://www.w3.org/2002/07/owl#>
      PREFIX SLM: <https://swisslipids.org/rdf/SLM_>
      SELECT ?class ?label ?chebi
      WHERE {
        GRAPH <https://sparql.swisslipids.org/swisslipids> {
          VALUES ?class {
            SLM:000000724 SLM:000000352 SLM:000043286 SLM:000000354 SLM:000043367
            SLM:000000335 SLM:000000552 SLM:000000334 SLM:000046347 SLM:000000381
          }
          ?class SLM:rank SLM:Class ; rdfs:label ?label ; owl:equivalentClass ?chebi .
          FILTER(STRSTARTS(STR(?chebi), "http://purl.obolibrary.org/obo/CHEBI_"))
        }
      }
      ORDER BY ?label
    result_count: 10

  - query_number: 2
    database: chebi
    description: >
      ChEBI descendants of the ten anchors: 154 entities, none under two anchors. Of these
      descendants and the ten anchors, 79 occur as Rhea compounds; they form the VALUES table of
      Queries 4 and 6.
    query: |
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
      PREFIX owl: <http://www.w3.org/2002/07/owl#>
      PREFIX obo: <http://purl.obolibrary.org/obo/>
      SELECT DISTINCT ?root ?entity
      WHERE {
        GRAPH <http://rdf.ebi.ac.uk/dataset/chebi> {
          VALUES ?root { obo:CHEBI_57875 obo:CHEBI_58168 obo:CHEBI_65213 obo:CHEBI_64381 obo:CHEBI_65214 obo:CHEBI_64379 obo:CHEBI_64872 obo:CHEBI_64771 obo:CHEBI_76528 obo:CHEBI_64840 }
          ?entity a owl:Class ; rdfs:subClassOf+ ?root .
          FILTER(STRSTARTS(STR(?entity), "http://purl.obolibrary.org/obo/CHEBI_"))
        }
      }
    result_count: 154

  - query_number: 3
    database: chebi
    description: >
      Structural check on the acyl-CoA test of Query 4: the 995 ChEBI descendants of acyl-CoA(4-)
      (CHEBI:58342), the pH-7.3 form Rhea uses. Requiring one of these (or the root) on the same side as
      the lysolipid gives exactly the per-class acylation counts of Query 4, so the name test
      STRENDS(name, "-CoA") used there selects the same reactions.
    query: |
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
      PREFIX owl: <http://www.w3.org/2002/07/owl#>
      PREFIX obo: <http://purl.obolibrary.org/obo/>
      SELECT DISTINCT ?root ?entity
      WHERE {
        GRAPH <http://rdf.ebi.ac.uk/dataset/chebi> {
          VALUES ?root { obo:CHEBI_58342 }
          ?entity a owl:Class ; rdfs:subClassOf+ ?root .
          FILTER(STRSTARTS(STR(?entity), "http://purl.obolibrary.org/obo/CHEBI_"))
        }
      }
    result_count: 995

  - query_number: 4
    database: rhea
    description: >
      The answer. For each headgroup and lyso class: approved, non-transport reactions containing the
      lysolipid, and those with an acyl-CoA on the same side (acyl-CoA-dependent acylation of it).
      1-acyl: PC 34, PE 26, PG 16, PI 14, PS 14 acylations. 2-acyl: PC 9, PE 6, PI 2, PS 2 and PG 0,
      although 2-acyl-lysoPG occurs in 4 reactions. Only phosphatidylglycerol has 1-acyl acylations and
      no 2-acyl acylation. Pinned and unpinned runs return identical rows. (The acylation flag is an
      IF(EXISTS ...) BIND; the same test inside OPTIONAL returns 0 on this Virtuoso.)
