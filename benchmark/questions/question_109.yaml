  - query_number: 6
    database: rhea
    description: >
      Every reaction containing a 2-acyl-lysoPG entity, with the other compounds on its side: 4
      reactions, all producing it. RHEA:67428 and RHEA:74103 are sn-1 hydrolyses of
      phosphatidylglycerol (with a fatty acid on the product side); RHEA:57144 and RHEA:78359 transfer
      the sn-1 acyl chain of phosphatidylglycerol to N-acetylsphingosine (with the 1-O-acyl ceramide on
      the product side). None consumes it.
    query: |
      PREFIX rhea: <http://rdf.rhea-db.org/>
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
      PREFIX CHEBI: <http://purl.obolibrary.org/obo/CHEBI_>
      SELECT DISTINCT ?accession ?equation ?lyso_on_side_with
      WHERE {
        VALUES (?lyso ?headgroup ?lyso_class) {
          (CHEBI:76528 "PG" "2-acyl")
          (CHEBI:141490 "PG" "2-acyl")
        }
        GRAPH <http://rdfportal.org/dataset/rhea> {
          ?reaction rdfs:subClassOf rhea:Reaction ; rhea:status <http://rdf.rhea-db.org/Approved> ;
                    rhea:isTransport false ; rhea:accession ?accession ; rhea:equation ?equation ; rhea:side ?side .
          ?side rhea:contains/rhea:compound/rhea:chebi ?lyso .
          ?side rhea:contains/rhea:compound ?partner .
          ?partner rhea:chebi ?pchebi ; rhea:name ?lyso_on_side_with .
          FILTER(?pchebi != ?lyso)
        }
      }
      ORDER BY ?accession
    result_count: 6

