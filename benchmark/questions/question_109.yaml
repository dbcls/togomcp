  @prefix rdfs: <http://www.w3.org/2000/01/rdf-schema#> .
  @prefix owl: <http://www.w3.org/2002/07/owl#> .
  @prefix SLM: <https://swisslipids.org/rdf/SLM_> .
  @prefix obo: <http://purl.obolibrary.org/obo/> .
  @prefix rhea: <http://rdf.rhea-db.org/> .

  SLM:000046347 rdfs:label "2-acyl-sn-glycero-3-phospho-(1'-sn-glycerol)" ; owl:equivalentClass obo:CHEBI_76528 .
  # Database: swisslipids | Query: 1 | Comment: the 2-acyl-lysoPG class anchor, pH-7.3 form
  SLM:000000381 rdfs:label "1-acyl-sn-glycero-3-phospho-(1'-sn-glycerol)" ; owl:equivalentClass obo:CHEBI_64840 .
  # Database: swisslipids | Query: 1 | Comment: the 1-acyl-lysoPG class anchor; 16 acyl-CoA acylations in Query 4
  rhea:67428 rhea:accession "RHEA:67428" ; rhea:status rhea:Approved .
  # Database: rhea | Query: 6 | Comment: a 1,2-diacyl-PG + H2O = 2-acyl-lysoPG + a fatty acid; produces the 2-acyl form
  rhea:78359 rhea:accession "RHEA:78359" .
  # Database: rhea | Query: 6 | Comment: diacyl-PG + N-acetylsphingosine = 2-acyl-lysoPG + 1-O-acyl-N-acetylsphingosine; produces it again
  obo:CHEBI_58342 rdfs:label "acyl-CoA(4-)" .
  # Database: chebi | Query: 3 | Comment: the acyl-donor class; none of its 995 descendants shares a side with 2-acyl-lysoPG

exact_answer:
  - phosphatidylglycerol

ideal_answer: |
  Phosphatidylglycerol. Its 1-acyl lysophospholipid is the acyl-CoA acceptor in 16 approved reactions,
  but its 2-acyl form, which appears in four reactions, is never acylated: all four produce it, two by
  hydrolysis of the sn-1 chain of phosphatidylglycerol and two by transfer of that chain to
  N-acetylsphingosine. For every other headgroup both isomers are recorded as acyl-CoA acceptors, the
  1-acyl form far more often: phosphatidylcholine 34 against 9 reactions, phosphatidylethanolamine 26
  against 6, and phosphatidylinositol and phosphatidylserine 14 against 2 each. In the curated
  chemistry, then, 2-acyl lysophosphatidylglycerol is a dead end, and re-acylation of every lyso class
  runs mainly through the 1-acyl isomer, adding the sn-2 chain.

question_template_used: Lipid-class anchors (reference lyso classes -> pH-7.3 ChEBI) -> ChEBI hierarchy expansion -> curated reactions classified by lyso position and by an acyl-CoA co-substrate -> per-class presence/absence

