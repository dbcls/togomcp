id: question_022
type: factoid
held_out: true   # created 2026-09-30 to replace the dev-exposed original (see benchmark/questions/retired/); never used for MIE development
body: "Among human glycoproteins annotated with the biological process 'tRNA processing'
  (GO:0008033) or any of its descendant terms, which protein has the largest number of
  glycosylation sites recorded in an integrated glycoscience knowledge base, and how many
  sites is that?"

inspiration_keyword:
  keyword_id: KW-0819
  name: tRNA processing
  category: Biological process

togomcp_databases_used:
  - go
  - glycosmos

verification_score:
  biological_insight: 2
  multi_database: 2
  verifiability: 3
  rdf_necessity: 3
  total: 10
  passed: true

pubmed_test:
  time_spent: 10 minutes
  method: |
    Four PubMed searches: "TRUB1 glycosylation O-GlcNAc sites" (0 hits), "O-GlcNAc
    glycosylation tRNA modification enzymes proteome-wide glycosylation sites" (0 hits),
    "O-GlcNAc tRNA pseudouridine synthase glycosylation" (0 hits) and "glycosylation tRNA
    processing proteins human" (28 hits; top 5 abstracts read).
  result: |
    No abstract reports glycosylation-site counts for tRNA-processing enzymes, let alone
    ranks them. The only relevant hit is a review of seryl-tRNA synthetase noting that
    nutrient deprivation triggers SerRS glycosylation (PMID 38255739), with no site count.
    The ranking depends on the current aggregated site set joined to the current GO
    subtree and annotations.
  conclusion: PASS (cannot answer from literature - requires current database state)

sparql_queries:
  - query_number: 1
    database: go
    description: >
      Expand 'tRNA processing' (GO:0008033) over the authoritative Gene Ontology on the
      `go` database: the anchor term plus every rdfs:subClassOf descendant, excluding
      deprecated classes. 64 non-deprecated terms. These IRIs are pasted verbatim into the
      VALUES blocks of Queries 2 and 3 (Rule 2: the full subtree, no sampling). The
      glycosmos endpoint's embedded go.owl copy yields the same 64 terms today, but the
      native GO is used because that embedded copy has diverged before.
    query: |
      PREFIX obo: <http://purl.obolibrary.org/obo/>
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
      PREFIX owl: <http://www.w3.org/2002/07/owl#>

      SELECT DISTINCT ?term ?label
      FROM <http://rdfportal.org/ontology/go>
      WHERE {
        ?term rdfs:subClassOf* obo:GO_0008033 ;
              rdfs:label ?label .
        FILTER(STRSTARTS(STR(?term), "http://purl.obolibrary.org/obo/GO_"))
        FILTER NOT EXISTS { ?term owl:deprecated true }
      }
      ORDER BY ?term
    result_count: 64

  - query_number: 2
    database: glycosmos
    description: >
      Per-protein glycosylation-site counts for every human glycoprotein annotated with
      any of the 64 terms. GO annotation on a glycoprotein is the
      sio:SIO_000255/up:classifiedWith scaffold; sites are gc:glycosylated_at. Pinned to
      the glycoprotein graph (gpdb re-types the same glycoprotein IRIs). COUNT(DISTINCT
      ?site) is required: a protein matching several in-scope terms repeats each site once
      per term (TRUB1: 6 sites x 3 term-annotations = 18 raw rows). 45 proteins; TRUB1
      (Q8WWH5) is the unique maximum with 6, followed by four proteins tied at 4.
    query: |
      PREFIX obo: <http://purl.obolibrary.org/obo/>
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
      PREFIX sio: <http://semanticscience.org/resource/>
      PREFIX up: <http://purl.uniprot.org/core/>
      PREFIX glycan: <http://purl.jp/bio/12/glyco/glycan#>
      PREFIX gc: <http://purl.jp/bio/12/glyco/conjugate#>
      PREFIX faldo: <http://biohackathon.org/resource/faldo#>

      SELECT ?glycoprotein ?name (COUNT(DISTINCT ?site) AS ?sites)
      WHERE {
        VALUES ?goTerm {
          obo:GO_0001680 obo:GO_0001682 obo:GO_0001717 obo:GO_0001720 obo:GO_0002097
          obo:GO_0002098 obo:GO_0002099 obo:GO_0002100 obo:GO_0002101 obo:GO_0002127
          obo:GO_0002128 obo:GO_0002129 obo:GO_0002130 obo:GO_0002131 obo:GO_0002132
          obo:GO_0002136 obo:GO_0002143 obo:GO_0002926 obo:GO_0002927 obo:GO_0002937
          obo:GO_0002938 obo:GO_0002939 obo:GO_0002940 obo:GO_0002942 obo:GO_0002943
          obo:GO_0002946 obo:GO_0002949 obo:GO_0006388 obo:GO_0006400 obo:GO_0008033
          obo:GO_0008616 obo:GO_0019988 obo:GO_0030488 obo:GO_0031119 obo:GO_0031591
          obo:GO_0034227 obo:GO_0035600 obo:GO_0042780 obo:GO_0043685 obo:GO_0043688
          obo:GO_0051391 obo:GO_0061504 obo:GO_0070329 obo:GO_0070899 obo:GO_0070900
          obo:GO_0070901 obo:GO_0070902 obo:GO_0070903 obo:GO_0071951 obo:GO_0071952
          obo:GO_0072670 obo:GO_0080178 obo:GO_0090646 obo:GO_0097745 obo:GO_0099116
          obo:GO_0106004 obo:GO_0106217 obo:GO_0140023 obo:GO_0160253 obo:GO_0160254
          obo:GO_0160255 obo:GO_1990180 obo:GO_1990799 obo:GO_1990983
        }
        GRAPH <http://rdf.glycosmos.org/glycoprotein> {
          ?glycoprotein glycan:has_taxon <http://identifiers.org/taxonomy/9606> ;
                        sio:SIO_000255/up:classifiedWith ?goTerm ;
                        rdfs:label ?name ;
                        gc:glycosylated_at ?site .
        }
      }
      GROUP BY ?glycoprotein ?name
      ORDER BY DESC(?sites) ?glycoprotein
    result_count: 45

  - query_number: 3
    database: glycosmos
    description: >
      Rule-3 arithmetic check for Query 2: distinct proteins and distinct sites over the
      same criteria. 45 proteins and 84 sites; the per-protein counts of Query 2 sum to
      exactly 84 (a site belongs to one protein, so no overlap is possible). The same
      query run WITHOUT the GRAPH pin also returns 45 / 84, and a GRAPH ?g provenance
      probe on Q8WWH5 finds only the glycoprotein graph (44 triples) plus one HPA
      cross-reference triple, so the union adds no entities (Rule 4).
    query: |
      PREFIX obo: <http://purl.obolibrary.org/obo/>
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
      PREFIX sio: <http://semanticscience.org/resource/>
      PREFIX up: <http://purl.uniprot.org/core/>
      PREFIX glycan: <http://purl.jp/bio/12/glyco/glycan#>
      PREFIX gc: <http://purl.jp/bio/12/glyco/conjugate#>
      PREFIX faldo: <http://biohackathon.org/resource/faldo#>

      SELECT (COUNT(DISTINCT ?glycoprotein) AS ?proteins) (COUNT(DISTINCT ?site) AS ?sites)
      WHERE {
        VALUES ?goTerm {
          obo:GO_0001680 obo:GO_0001682 obo:GO_0001717 obo:GO_0001720 obo:GO_0002097
          obo:GO_0002098 obo:GO_0002099 obo:GO_0002100 obo:GO_0002101 obo:GO_0002127
          obo:GO_0002128 obo:GO_0002129 obo:GO_0002130 obo:GO_0002131 obo:GO_0002132
          obo:GO_0002136 obo:GO_0002143 obo:GO_0002926 obo:GO_0002927 obo:GO_0002937
          obo:GO_0002938 obo:GO_0002939 obo:GO_0002940 obo:GO_0002942 obo:GO_0002943
          obo:GO_0002946 obo:GO_0002949 obo:GO_0006388 obo:GO_0006400 obo:GO_0008033
          obo:GO_0008616 obo:GO_0019988 obo:GO_0030488 obo:GO_0031119 obo:GO_0031591
          obo:GO_0034227 obo:GO_0035600 obo:GO_0042780 obo:GO_0043685 obo:GO_0043688
          obo:GO_0051391 obo:GO_0061504 obo:GO_0070329 obo:GO_0070899 obo:GO_0070900
          obo:GO_0070901 obo:GO_0070902 obo:GO_0070903 obo:GO_0071951 obo:GO_0071952
          obo:GO_0072670 obo:GO_0080178 obo:GO_0090646 obo:GO_0097745 obo:GO_0099116
          obo:GO_0106004 obo:GO_0106217 obo:GO_0140023 obo:GO_0160253 obo:GO_0160254
          obo:GO_0160255 obo:GO_1990180 obo:GO_1990799 obo:GO_1990983
        }
        GRAPH <http://rdf.glycosmos.org/glycoprotein> {
          ?glycoprotein glycan:has_taxon <http://identifiers.org/taxonomy/9606> ;
                        sio:SIO_000255/up:classifiedWith ?goTerm ;
                        gc:glycosylated_at ?site .
        }
      }
    result_count: 1

  - query_number: 4
    database: glycosmos
    description: >
      The six glycosylation sites of TRUB1 with residue positions (FALDO chain). Each site
      node is one residue position (84 site nodes = 84 distinct protein-position pairs
      across the set). Positions 10, 34, 81, 144, 146 and 335.
    query: |
      PREFIX obo: <http://purl.obolibrary.org/obo/>
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
      PREFIX sio: <http://semanticscience.org/resource/>
      PREFIX up: <http://purl.uniprot.org/core/>
      PREFIX glycan: <http://purl.jp/bio/12/glyco/glycan#>
      PREFIX gc: <http://purl.jp/bio/12/glyco/conjugate#>
      PREFIX faldo: <http://biohackathon.org/resource/faldo#>

      SELECT DISTINCT ?site ?position
      FROM <http://rdf.glycosmos.org/glycoprotein>
      WHERE {
        <http://glycosmos.org/glycoprotein/Q8WWH5> gc:glycosylated_at ?site .
        ?site faldo:location/faldo:position ?position .
      }
      ORDER BY ?position
    result_count: 6

  - query_number: 5
    database: glycosmos
    description: >
      Scope check: proteins carrying the ROOT term GO:0008033 alone. Only 7 of the 45
      proteins; TRUB1 is annotated only to descendants (GO:0006400 tRNA modification,
      GO:0031119 tRNA pseudouridine synthesis), so a root-only query misses the answer.
      This is why the descendant expansion is load-bearing.
    query: |
      PREFIX obo: <http://purl.obolibrary.org/obo/>
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
      PREFIX sio: <http://semanticscience.org/resource/>
      PREFIX up: <http://purl.uniprot.org/core/>
      PREFIX glycan: <http://purl.jp/bio/12/glyco/glycan#>
      PREFIX gc: <http://purl.jp/bio/12/glyco/conjugate#>
      PREFIX faldo: <http://biohackathon.org/resource/faldo#>

      SELECT (COUNT(DISTINCT ?glycoprotein) AS ?proteins_root_only)
      WHERE {
        GRAPH <http://rdf.glycosmos.org/glycoprotein> {
          ?glycoprotein glycan:has_taxon <http://identifiers.org/taxonomy/9606> ;
                        sio:SIO_000255/up:classifiedWith obo:GO_0008033 ;
                        gc:glycosylated_at ?site .
        }
      }
    result_count: 1

rdf_triples: |
  @prefix obo: <http://purl.obolibrary.org/obo/> .
  @prefix rdfs: <http://www.w3.org/2000/01/rdf-schema#> .
  @prefix sio: <http://semanticscience.org/resource/> .
  @prefix up: <http://purl.uniprot.org/core/> .
  @prefix glycan: <http://purl.jp/bio/12/glyco/glycan#> .
  @prefix gc: <http://purl.jp/bio/12/glyco/conjugate#> .
  @prefix faldo: <http://biohackathon.org/resource/faldo#> .
  @prefix gp: <http://glycosmos.org/glycoprotein/> .
  @prefix feature: <http://glycosmos.org/feature/> .

  obo:GO_0006400 rdfs:subClassOf+ obo:GO_0008033 .
  # Database: go | Query: 1 | Comment: tRNA modification is a descendant of tRNA processing
  obo:GO_0031119 rdfs:subClassOf+ obo:GO_0008033 .
  # Database: go | Query: 1 | Comment: tRNA pseudouridine synthesis is a descendant of tRNA processing
  gp:Q8WWH5 rdfs:label "Pseudouridylate synthase TRUB1" ; glycan:has_taxon <http://identifiers.org/taxonomy/9606> .
  # Database: glycosmos | Query: 2 | Comment: TRUB1 is a human glycoprotein entry keyed by its UniProt accession
  gp:Q8WWH5 sio:SIO_000255 [ up:classifiedWith obo:GO_0031119 ] .
  # Database: glycosmos | Query: 2 | Comment: TRUB1 reaches the scope only through descendant terms, never the root (Query 5)
  gp:Q8WWH5 gc:glycosylated_at feature:gly00030996 , feature:gly00018589 , feature:gly00018590 , feature:gly00030997 , feature:gly00030998 , feature:gly00030999 .
  # Database: glycosmos | Query: 2 | Comment: six distinct glycosylation sites, the maximum among the 45 in-scope proteins
  feature:gly00030996 faldo:location [ faldo:position 10 ] .
  # Database: glycosmos | Query: 4 | Comment: site at residue 10 (sites at 34, 81, 144, 146, 335 follow the same pattern)
  gp:Q12849 rdfs:label "G-rich sequence factor 1" .
  # Database: glycosmos | Query: 2 | Comment: one of four runners-up tied at 4 sites (with Q7Z2T5, Q99575, Q9H0A0)

exact_answer: "TRUB1 (UniProt:Q8WWH5); 6 glycosylation sites"

ideal_answer: |
  The protein with the most recorded glycosylation sites is pseudouridylate synthase
  TRUB1 (tRNA pseudouridine 55 synthase; UniProt Q8WWH5), with six sites at residues 10,
  34, 81, 144, 146 and 335. Four of them (10, 144, 146 and 335) carry a single
  beta-N-acetylglucosamine (O-GlcNAc), while 34 and 81 are recorded as sites without an
  attached glycan structure. The comparison spans 45 human glycoproteins annotated with
  tRNA processing or one of its 63 non-deprecated descendant terms, carrying 84
  glycosylation sites between them. Four proteins tie for second place with four sites
  each: G-rich sequence factor 1 (GRSF-1, Q12849), the tRNA (guanine(27)-N(2))-
  dimethyltransferase TRMT1-like protein (Q7Z2T5), the ribonucleases P/MRP subunit POP1
  (Q99575) and the RNA cytidine acetyltransferase N-acetyltransferase 10 (Q9H0A0). TRUB1
  is annotated only to specific branches of the process (tRNA modification and tRNA
  pseudouridine synthesis), not to the parent term, which only 7 of the 45 proteins carry
  directly, so the answer is reachable only by expanding the process over its full
  hierarchy.

question_template_used: Template 2 (Cross-Database Counting) - ontology-subtree expansion joined to a per-entity maximum

time_spent:
  exploration: 30 minutes
  formulation: 20 minutes
  verification: 25 minutes
  pubmed_test: 10 minutes
  extraction: 10 minutes
  documentation: 20 minutes
  total: 115 minutes
