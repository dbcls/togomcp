exact_answer: "TRIM28 (UniProt:Q13263); 68 distinct phosphorylated residue positions"

ideal_answer: |
  Transcription intermediary factor 1-beta (TRIM28, also called KAP-1; UniProt Q13263)
  has been observed phosphorylated at the most positions: 68 distinct residues, 50 serines,
  12 threonines and 6 tyrosines. It is well ahead of the next proteins, interleukin
  enhancer-binding factor 3 (ILF3, 44 positions), the histone-lysine N-methyltransferase
  SETD2 (38) and zinc finger CCCH-type antiviral protein 1 (ZC3HAV1, 37). The comparison
  covers 271 reviewed human proteins annotated with defense response to virus or one of
  its five descendant terms; 126 of them have at least one observed phosphosite, 895
  distinct phosphorylated positions in total. TRIM28 enters the set only through the
  narrower term 'suppression of viral release by host', not through defense response to
  virus itself, so a search restricted to the parent term would miss it and wrongly put
  ILF3 first.

