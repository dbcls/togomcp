  - query_number: 6
    database: jpostdb
    description: >
      Independent check of the winning value, anchored on TRIM28 alone: its phosphorylated
      positions split by residue as 50 Ser + 12 Thr + 6 Tyr = 68, matching Query 4.
    query: |
      PREFIX jpost: <http://rdf.jpostdb.org/ontology/jpost.owl#>
      PREFIX faldo: <http://biohackathon.org/resource/faldo#>
      PREFIX unimod: <http://www.unimod.org/obo/unimod.obo#>

      SELECT ?residue (COUNT(DISTINCT ?protPos) AS ?positions)
      WHERE {
        GRAPH <http://jpost.org/graph/database> {
          VALUES ?up { <http://purl.uniprot.org/uniprot/Q13263> }
          ?prot jpost:hasDatabaseSequence ?up ;
                jpost:hasPeptideEvidence ?ev .
          ?ev jpost:hasPeptide ?pep ;
              faldo:location [ faldo:begin [ faldo:position ?peptBegin ] ] .   # protein-absolute
          ?pep jpost:hasPsm/jpost:hasModification ?mod .
          ?mod a unimod:UNIMOD_21 ;                                             # Phospho
               jpost:modificationSite ?residue ;
               faldo:location [ faldo:position ?modPos ] .                      # peptide-relative
          BIND(?peptBegin + ?modPos - 1 AS ?protPos)
        }
      }
      GROUP BY ?residue
      ORDER BY DESC(?positions)
    result_count: 3

