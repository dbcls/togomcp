  - query_number: 5
    database: jpostdb
    description: >
      Rule-3 arithmetic check for Query 4: 126 proteins and 895 distinct
      (protein, position) pairs; the per-protein counts in Query 4 sum to exactly 895.
      Provenance probe: every jpost:hasDatabaseSequence triple pointing at Q13263 (307)
      lies in http://jpost.org/graph/database, so no co-tenant contributes.
    query: |
