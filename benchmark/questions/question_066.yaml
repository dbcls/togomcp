id: question_066
type: factoid
held_out: true   # created 2026-09-30 to replace the dev-exposed original (see benchmark/questions/retired/); never used for MIE development
body: "Consider all reviewed human proteins annotated with the biological process 'defense
  response to virus' (GO:0051607) or any of its descendant terms. Across publicly
  reanalyzed shotgun mass-spectrometry proteomics datasets, which of these proteins has
  been observed phosphorylated at the largest number of distinct residue positions, and
  how many positions is that?"

inspiration_keyword:
  keyword_id: KW-0051
  name: Antiviral defense
  category: Biological process

togomcp_databases_used:
  - go
  - uniprot
  - jpostdb

verification_score:
  biological_insight: 2
  multi_database: 3
  verifiability: 3
  rdf_necessity: 3
  total: 11
  passed: true

pubmed_test:
  time_spent: 10 minutes
  method: |
    Four PubMed searches: "TRIM28 phosphorylation sites phosphoproteomics number of
    sites" (0 hits), "antiviral proteins phosphoproteome most phosphorylated protein
    reanalysis" (0 hits), "KAP1 TRIM28 multiple phosphorylation sites mass spectrometry"
    (0 hits) and "TRIM28 phosphorylation" (156 hits; top 3 abstracts read).
  result: |
    The literature reports individual TRIM28 phosphosites studied one at a time (S473 by
    RSK1, PMID 40519166; S824 by DNA-PK, PMID 39229050), never a total count of observed
    positions, and no source compares phosphosite counts across the antiviral-defense
    protein set. Both the winner and the value depend on the current reanalyzed
    repository joined to the current GO annotations.
  conclusion: PASS (cannot answer from literature - requires current database state)

sparql_queries:
  - query_number: 1
    database: go
    description: >
      Expand 'defense response to virus' (GO:0051607) over the authoritative Gene
      Ontology on the `go` database: the anchor plus every rdfs:subClassOf descendant,
      deprecated classes excluded. 6 terms, pasted verbatim into the VALUES blocks of
      Queries 2 and 3 (Rule 2: the full subtree).
    query: |
      PREFIX obo: <http://purl.obolibrary.org/obo/>
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
      PREFIX owl: <http://www.w3.org/2002/07/owl#>

      SELECT DISTINCT ?term ?label
      FROM <http://rdfportal.org/ontology/go>
      WHERE {
        ?term rdfs:subClassOf* obo:GO_0051607 ;
              rdfs:label ?label .
        FILTER(STRSTARTS(STR(?term), "http://purl.obolibrary.org/obo/GO_"))
        FILTER NOT EXISTS { ?term owl:deprecated true }
      }
      ORDER BY ?term
    result_count: 6

  - query_number: 2
    database: uniprot
    description: >
      All reviewed human proteins annotated to any of the 6 terms. Pinned to the UniProt
      graph with deleted entries excluded (up:obsolete). 271 proteins. Rule 4: the same
      pattern unpinned gives 271 distinct proteins over 596 rows - the extra rows are
      proteins matching several in-scope terms, not foreign entities (OMA re-types only
      the `a up:Protein` leg, and up:classifiedWith is UniProt-only). This accession set
      is the VALUES block of Queries 4 and 5.
    query: |
      PREFIX up: <http://purl.uniprot.org/core/>
      PREFIX obo: <http://purl.obolibrary.org/obo/>

      SELECT DISTINCT ?protein ?mnemonic
      FROM <http://sparql.uniprot.org/uniprot>
      WHERE {
        VALUES ?goTerm { obo:GO_0009616 obo:GO_0044790 obo:GO_0051214 obo:GO_0051215 obo:GO_0051607 obo:GO_0140374 }
        ?protein a up:Protein ;
                 up:reviewed 1 ;
                 up:organism <http://purl.uniprot.org/taxonomy/9606> ;
                 up:classifiedWith ?goTerm ;
                 up:mnemonic ?mnemonic .
        FILTER NOT EXISTS { ?protein up:obsolete 1 }
      }
      ORDER BY ?protein
    result_count: 271

  - query_number: 3
    database: uniprot
    description: >
      Scope check on the eventual answer: TRIM28 (Q13263) carries ONLY the descendant
      term GO:0044790 (suppression of viral release by host) within the subtree, not the
      root GO:0051607. A root-only question therefore misses the answer entirely (ILF3,
      annotated to the root, would appear to lead with 44).
    query: |
      PREFIX up: <http://purl.uniprot.org/core/>
      PREFIX obo: <http://purl.obolibrary.org/obo/>

      SELECT ?goTerm
      FROM <http://sparql.uniprot.org/uniprot>
      WHERE {
        VALUES ?goTerm { obo:GO_0009616 obo:GO_0044790 obo:GO_0051214 obo:GO_0051215 obo:GO_0051607 obo:GO_0140374 }
        <http://purl.uniprot.org/uniprot/Q13263> up:classifiedWith ?goTerm .
      }
    result_count: 1

  - query_number: 4
    database: jpostdb
    description: >
      Distinct phosphorylated residue positions per protein. jPOST records two FALDO
      frames: the peptide evidence's begin is protein-absolute, the modification's
      position is peptide-relative, so protein position = peptide begin + modification
      position - 1 (MIE ptm_absolute_position). Phospho = unimod:UNIMOD_21 (unimod.obo#
      namespace). Graph-pinned; jPOST maps to canonical accessions only (0 isoform IRIs
      among 76,820 hasDatabaseSequence targets), so no isoform-mapped peptides are
      missed. 126 of the 271 proteins have at least one phosphosite; TRIM28 is the unique
      maximum with 68, ahead of ILF3 (44), SETD2 (38) and ZC3HAV1 (37).
    query: |
      PREFIX jpost: <http://rdf.jpostdb.org/ontology/jpost.owl#>
      PREFIX faldo: <http://biohackathon.org/resource/faldo#>
      PREFIX unimod: <http://www.unimod.org/obo/unimod.obo#>

