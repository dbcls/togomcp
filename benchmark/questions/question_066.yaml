          <http://purl.uniprot.org/uniprot/O14879> <http://purl.uniprot.org/uniprot/O15162> <http://purl.uniprot.org/uniprot/O15318>
          <http://purl.uniprot.org/uniprot/O15455> <http://purl.uniprot.org/uniprot/O15496> <http://purl.uniprot.org/uniprot/O43143>
