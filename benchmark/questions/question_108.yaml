exact_answer: "yes"

ideal_answer: |
  Yes, one: the Sodalis-like endosymbiont of the seal louse Proechinophthirus fluctus (assembly
  GCF_001602625.1). Seven Sodalis genomes carry these assignments. Five of them (S. glossinidius
  'morsitans', Candidatus S. pierantonii SOPE, S. ligni, Candidatus S. endolongispinus and
  S. praecaptivus subsp. spalangiae) have the complete cAMP system: CRP, class I adenylate cyclase
  and cAMP phosphodiesterase. The Sodalis endosymbiont of Henestaris halophilus keeps only CRP.
  The louse symbiont keeps CRP (score 198.6 over a threshold of 148.8) and the phosphodiesterase
  (234.3 over 110.17), but its only adenylate cyclase-like protein, WP_244267252.1, scores 312.8,
  just below the 322.8 threshold, and is a 199-residue partial protein. This endosymbiont's genome
  is known to be degrading, which fits a cyclase reduced to a fragment while the cAMP receptor and
  the cAMP-degrading enzyme persist. The flag decides the answer: counting every hit whatever its
  score treats the fragment as an adenylate cyclase and finds no such genome.

