    database: bh26microbes
    description: >
      Trap route, recorded for contrast: the same test on the bare protein-KO links
      (rdfs:seeAlso), which include below-threshold hits. It returns 0 genomes, because
      GCF_001602625.1's non-significant K05851 hit counts as an adenylate cyclase, and the answer
      flips to NO (MIE gotcha seealso_includes_below_threshold_hits).
    query: |
      PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
