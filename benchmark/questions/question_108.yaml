  - query_number: 7
    database: bh26microbes
    description: >
      Scores behind the answer for GCF_001602625.1: CRP WP_066596293.1 scores 198.6 (threshold
      148.8), phosphodiesterase WP_066596552.1 234.3 (110.17), but the class I adenylate cyclase
      match WP_244267252.1 scores 312.8, below the 322.8 threshold, although its E-value is
      5.4e-94. The NCBI Protein record for WP_244267252.1 (ncbi esummary) is a 199-residue
      "class I adenylate cyclase domain-containing protein, partial".
    query: |
      PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
      PREFIX sio: <http://semanticscience.org/resource/>
      PREFIX obo: <http://purl.obolibrary.org/obo/>
      PREFIX m2r: <http://med2rdf.org/ontology/med2rdf#>
      PREFIX ko: <http://identifiers.org/kegg.orthology/>
      PREFIX gcf: <http://identifiers.org/refseq.gcf/>
      SELECT ?ko ?protein ?label ?value
      WHERE {
        GRAPH <https://2026.biohackathon.org/microbes/kofamscan> {
          ?protein obo:RO_0002162 gcf:GCF_001602625.1 .
          ?hit rdf:subject ?protein ; rdf:object ?ko ; sio:SIO_000008 ?a .
          FILTER(?ko IN (ko:K10914, ko:K05851, ko:K03651))
          ?a rdfs:label ?label ; sio:SIO_000300 ?value .
        }
      }
      ORDER BY ?ko ?label
    result_count: 12

