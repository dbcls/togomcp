  # Database: taxonomy | Query: 1 | Comment: under 'unclassified Sodalis', within genus Sodalis (taxon 84565)
  ncbiprotein:WP_066596293.1 obo:RO_0002162 gcf:GCF_001602625.1 ; rdfs:seeAlso ko:K10914 .
  # Database: bh26microbes | Query: 7 | Comment: CRP, score 198.6 over threshold 148.8, significant
  ncbiprotein:WP_066596552.1 obo:RO_0002162 gcf:GCF_001602625.1 ; rdfs:seeAlso ko:K03651 .
  # Database: bh26microbes | Query: 7 | Comment: cAMP phosphodiesterase, score 234.3 over threshold 110.17, significant
  ncbiprotein:WP_244267252.1 obo:RO_0002162 gcf:GCF_001602625.1 ; rdfs:seeAlso ko:K05851 .
  # Database: bh26microbes | Query: 7 | Comment: class I adenylate cyclase link exists, but score 312.8 is below threshold 322.8
