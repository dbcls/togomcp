            gcf:GCF_047324155.1
            gcf:GCF_047324165.1
            gcf:GCF_047324175.1
            gcf:GCF_047324205.1
            gcf:GCF_047324215.1
            gcf:GCF_047324225.1
            gcf:GCF_047324235.1
            gcf:GCF_047324245.1
            gcf:GCF_047324255.1
            gcf:GCF_047324285.1
            gcf:GCF_047324305.1
            gcf:GCF_047528285.1
            gcf:GCF_047607725.1
            gcf:GCF_900004845.1
            gcf:GCF_900161835.1
            gcf:GCF_960934445.1
            gcf:GCF_963969435.1
        }
        GRAPH <https://2026.biohackathon.org/microbes/kofamscan> {
          ?crp rdfs:seeAlso ko:K10914 ; obo:RO_0002162 ?genome .
          ?pde rdfs:seeAlso ko:K03651 ; obo:RO_0002162 ?genome .
