            gcf:GCF_046352915.1
            gcf:GCF_047324135.1
            gcf:GCF_047324145.1
            gcf:GCF_047324155.1
            gcf:GCF_047324165.1
            gcf:GCF_047324175.1
            gcf:GCF_047324205.1
            gcf:GCF_047324215.1
            gcf:GCF_047324225.1
            gcf:GCF_047324235.1
            gcf:GCF_047324245.1
            gcf:GCF_047324255.1
            gcf:GCF_047324285.1
            gcf:GCF_047324305.1
            gcf:GCF_047528285.1
            gcf:GCF_047607725.1
            gcf:GCF_900004845.1
            gcf:GCF_900161835.1
            gcf:GCF_960934445.1
            gcf:GCF_963969435.1
        }
        GRAPH <https://2026.biohackathon.org/microbes/kofamscan> {
          ?h1 rdf:object ko:K10914 ; rdf:subject ?crp ; sio:SIO_000008 ?s1 .
          ?s1 rdfs:label "significant" ; sio:SIO_000300 true .
          ?crp obo:RO_0002162 ?genome .
          ?h2 rdf:object ko:K03651 ; rdf:subject ?pde ; sio:SIO_000008 ?s2 .
          ?s2 rdfs:label "significant" ; sio:SIO_000300 true .
          ?pde obo:RO_0002162 ?genome .
          FILTER NOT EXISTS {
            ?h3 rdf:object ko:K05851 ; rdf:subject ?cya ; sio:SIO_000008 ?s3 .
            ?s3 rdfs:label "significant" ; sio:SIO_000300 true .
            ?cya obo:RO_0002162 ?genome .
          }
        }
      }
    result_count: 1

