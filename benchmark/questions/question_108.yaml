      PREFIX ko: <http://identifiers.org/kegg.orthology/>
      PREFIX gcf: <http://identifiers.org/refseq.gcf/>
      SELECT ?genome
      WHERE {
        VALUES ?genome {
            gcf:GCF_000010085.1
            gcf:GCF_000517405.1
            gcf:GCF_000517425.1
            gcf:GCF_001602625.1
            gcf:GCF_001879235.1
            gcf:GCF_002261105.1
            gcf:GCF_003668825.1
            gcf:GCF_004346745.1
            gcf:GCF_018777395.1
            gcf:GCF_019646055.1
