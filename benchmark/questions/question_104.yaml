exact_answer:
  - Saccharomyces cerevisiae

ideal_answer: |
  Budding yeast, Saccharomyces cerevisiae. Six of its eight reviewed lipid-biosynthesis
  proteins (75%) appear in its own pathway diagrams, spread over five diagrams that are all
  lipid pathways: sterol, triglyceride, sphingolipid and phospholipid biosynthesis. The mouse
  follows with 13 of 29 (45%, in eight diagrams, several of them not lipid-specific, such as
  insulin signalling and pluripotency), then C. elegans with 2 of 10 (20%). Arabidopsis
  thaliana comes last with 3 of 41 (7%), all in a single triacylglycerol biosynthesis
  diagram, even though it has the most reviewed lipid-biosynthesis proteins of the four.
  Ranking by the number of diagrams instead would favour the mouse, but that mainly
  reflects collection size: the mouse has 214 pathway diagrams, yeast 106, C. elegans 60
  and Arabidopsis 33.

