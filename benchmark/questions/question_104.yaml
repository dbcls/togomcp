  - query_number: 5
    database: wikipathways
    description: >
      Context: total pathway records per organism (mouse 214, yeast 106, C. elegans 60,
      Arabidopsis 33). Ranking by pathway COUNT would simply follow collection size (mouse
      8 > yeast 5); the share of proteins depicted does not.
    query: |
      PREFIX wp: <http://vocabularies.wikipathways.org/wp#>
      PREFIX dc: <http://purl.org/dc/elements/1.1/>
      PREFIX dcterms: <http://purl.org/dc/terms/>
      SELECT ?organism (COUNT(DISTINCT ?pathway) AS ?allPathways)
      FROM <http://rdf.wikipathways.org/>
      WHERE {
        VALUES ?organism { "Mus musculus" "Saccharomyces cerevisiae" "Caenorhabditis elegans" "Arabidopsis thaliana" }
        ?pathway a wp:Pathway ;
                 wp:organismName ?organism ;
                 dc:title ?t .
      }
      GROUP BY ?organism
      ORDER BY DESC(?allPathways)
    result_count: 4

