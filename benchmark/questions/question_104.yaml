id: question_104
type: choice
held_out: true   # created 2026-09-30; never used for MIE development
body: "Consider the manually reviewed protein entries annotated with the keyword 'Lipid
  biosynthesis' for each of four model organisms. Which organism has the largest share of
  those proteins depicted in at least one of its own community-curated pathway diagrams?"

choices:
  - Mus musculus
  - Saccharomyces cerevisiae
  - Caenorhabditis elegans
  - Arabidopsis thaliana

inspiration_keyword:
  keyword_id: KW-0444
  name: Lipid biosynthesis
  category: Biological process

togomcp_databases_used:
  - uniprot
  - wikipathways

verification_score:
  biological_insight: 2
  multi_database: 2
  verifiability: 3
  rdf_necessity: 3
  total: 10
  passed: true

pubmed_test:
  time_spent: 5 minutes
  method: |
    Two PubMed searches: "WikiPathways coverage lipid biosynthesis proteins yeast
    Arabidopsis mouse pathway" (0 hits) and "WikiPathways 2024 update species pathway
    collections" (0 hits).
  result: |
    No source reports, per organism, how much of a keyword-defined protein set a pathway
    collection depicts. The shares depend on the current reviewed annotations and on the
    current diagrams of each species.
  conclusion: PASS (cannot answer from literature - requires current database state)

sparql_queries:
  - query_number: 1
    database: uniprot
    description: >
      Reviewed (Swiss-Prot) proteins carrying the UniProt keyword KW-0444 Lipid biosynthesis
      in the four organisms, pinned to the UniProt graph with deleted entries excluded. 88
      proteins: Arabidopsis 41, mouse 29, C. elegans 10, S. cerevisiae (strain S288c,
      taxon 559292) 8. These are the denominators.
    query: |
      PREFIX up: <http://purl.uniprot.org/core/>
      PREFIX taxon: <http://purl.uniprot.org/taxonomy/>
      SELECT DISTINCT ?protein ?taxon
      FROM <http://sparql.uniprot.org/uniprot>
      WHERE {
        VALUES ?taxon { taxon:10090 taxon:559292 taxon:6239 taxon:3702 }
        ?protein a up:Protein ;
                 up:reviewed 1 ;
                 up:organism ?taxon ;
                 up:classifiedWith <http://purl.uniprot.org/keywords/444> .   # KW-0444 Lipid biosynthesis
        FILTER NOT EXISTS { ?protein up:obsolete 1 }
      }
      ORDER BY ?taxon ?protein
    result_count: 88

  - query_number: 2
    database: wikipathways
    description: >
      Per organism, the distinct pathways of THAT organism containing any of its keyword
      proteins, and how many of those proteins are depicted. Join through the BridgeDb
      xref wp:bdbUniprot (identifiers.org IRIs); each accession travels with its species and
      FILTER(?organism = ?species) drops cross-species hits; dc:title restricts to real
      pathway records (not pathway-as-DataNode stubs) and a Pathway-typed parent avoids
      the isPartOf interaction/complex trap. Depicted proteins: mouse 13 of 29 (45%),
      S. cerevisiae 6 of 8 (75%), C. elegans 2 of 10 (20%), Arabidopsis 3 of 41 (7%).
