id: question_105
type: summary
held_out: true   # created 2026-09-30; never used for MIE development
body: "Summarize which nuclear genes of the liverwort Marchantia polymorpha are linked to
  photorespiration, comparing two routes: keyword annotation of the matching entries in the
  major curated protein-sequence knowledgebase, and gene-level annotation to the biological
  process 'photorespiration' (GO:0009853, including any descendant terms). Cover how many
  genes each route yields and whether they overlap, which protein families dominate, how the
  genes are arranged in the genome, and whether they are co-expressed."

inspiration_keyword:
  keyword_id: KW-0601
  name: Photorespiration
  category: Biological process

togomcp_databases_used:
  - uniprot
  - marpolbase
  - go

verification_score:
  biological_insight: 3
  multi_database: 3
  verifiability: 2
  rdf_necessity: 3
  total: 11
  passed: true

pubmed_test:
  time_spent: 5 minutes
  method: |
    Two PubMed searches: "Marchantia polymorpha RBCS gene family cluster photorespiration"
    (0 hits) and "Marchantia photorespiration genes" (1 hit, PMID 39047726, read).
  result: |
    The one hit studies MYB-related regulators of chloroplast biogenesis and does not list
    photorespiration-annotated genes, their genomic arrangement or co-expression. Gene counts,
    the disjointness of the two annotation routes, cluster membership and co-expression ranks
    all come from the current annotation and expression data.
  conclusion: PASS (cannot answer from literature - requires current database state)

sparql_queries:
  - query_number: 1
    database: uniprot
    description: >
      Protein-level route: every M. polymorpha UniProt entry (both taxa used for the species)
      carrying keyword KW-0601 Photorespiration. 37 entries, 1 reviewed (the plastid RbcL,
      P06292), the rest automatic annotation: RuBisCO small subunits, large chains and two
      (S)-2-hydroxy-acid (glycolate) oxidases.
    query: |
      PREFIX up: <http://purl.uniprot.org/core/>
      SELECT DISTINCT ?protein ?reviewed ?organism
      FROM <http://sparql.uniprot.org/uniprot>
      WHERE {
        VALUES ?organism { <http://purl.uniprot.org/taxonomy/3197>       # Marchantia polymorpha
                           <http://purl.uniprot.org/taxonomy/1480154> }  # subsp. ruderalis
        ?protein up:organism ?organism ;
                 up:reviewed ?reviewed ;
                 up:classifiedWith <http://purl.uniprot.org/keywords/601> .   # KW-0601 Photorespiration
      }
      ORDER BY ?protein
    result_count: 37

  - query_number: 2
    database: marpolbase
    description: >
      Map those accessions onto nuclear MarpolBase genes through its BLAST-top-hit xref graph
      (protein -> CDS -> transcript -> gene, three graphs; the xref graph is keyed on protein
      IRIs). 16 of the 37 accessions are hit, giving 21 genes: 19 RuBisCO small-subunit-family
      genes (several paralogs share one best-hit accession), the glycolate oxidase Mp1g01210,
      and Mp3g01300, a nuclear gene whose best hit is a RuBisCO large chain. The other 21
      accessions (among them the reviewed RbcL, P06292) are the best hit of no gene.
    query: |
      PREFIX mpo: <http://marchantia.info/ontology/>
      PREFIX so: <http://purl.obolibrary.org/obo/so#>
      PREFIX obo: <http://purl.obolibrary.org/obo/>
      PREFIX dcterms: <http://purl.org/dc/terms/>
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
      PREFIX skos: <http://www.w3.org/2004/02/skos/core#>
      PREFIX faldo: <http://biohackathon.org/resource/faldo#>
      SELECT DISTINCT ?geneId ?symbol ?uniprot
      WHERE {
        GRAPH <http://marchantia.info/rdf/graph/xref/uniprot> {
          VALUES ?uniprot {
            <http://purl.uniprot.org/uniprot/A0A0H5BHG6> <http://purl.uniprot.org/uniprot/A0A176VDP6> <http://purl.uniprot.org/uniprot/A0A176VL02>
            <http://purl.uniprot.org/uniprot/A0A176VMB3> <http://purl.uniprot.org/uniprot/A0A176VMQ7> <http://purl.uniprot.org/uniprot/A0A176W002>
            <http://purl.uniprot.org/uniprot/A0A176W4I8> <http://purl.uniprot.org/uniprot/A0A176W4Y5> <http://purl.uniprot.org/uniprot/A0A176W6U3>
            <http://purl.uniprot.org/uniprot/A0A176W791> <http://purl.uniprot.org/uniprot/A0A176W7I3> <http://purl.uniprot.org/uniprot/A0A176WCW6>
            <http://purl.uniprot.org/uniprot/A0A176WD83> <http://purl.uniprot.org/uniprot/A0A2R6VXI6> <http://purl.uniprot.org/uniprot/A0A2R6VXJ7>
            <http://purl.uniprot.org/uniprot/A0A2R6W5R3> <http://purl.uniprot.org/uniprot/A0A2R6W5R4> <http://purl.uniprot.org/uniprot/A0A2R6W5T4>
            <http://purl.uniprot.org/uniprot/A0A2R6WAE0> <http://purl.uniprot.org/uniprot/A0A2R6WAE2> <http://purl.uniprot.org/uniprot/A0A2R6WBL2>
            <http://purl.uniprot.org/uniprot/A0A2R6WBL5> <http://purl.uniprot.org/uniprot/A0A2R6WBL7> <http://purl.uniprot.org/uniprot/A0A2R6WBL9>
            <http://purl.uniprot.org/uniprot/A0A2R6WBM0> <http://purl.uniprot.org/uniprot/A0A2R6WBM1> <http://purl.uniprot.org/uniprot/A0A2R6WBM3>
            <http://purl.uniprot.org/uniprot/A0A2R6WBM6> <http://purl.uniprot.org/uniprot/A0A2R6WBM9> <http://purl.uniprot.org/uniprot/A0A2R6WP06>
            <http://purl.uniprot.org/uniprot/A0A2R6X967> <http://purl.uniprot.org/uniprot/A0A2R6XJT5> <http://purl.uniprot.org/uniprot/A0A2R6XJT8>
            <http://purl.uniprot.org/uniprot/A0A2R6XNP5> <http://purl.uniprot.org/uniprot/O03119> <http://purl.uniprot.org/uniprot/P06292>
            <http://purl.uniprot.org/uniprot/R4LAS6>
          }
          ?protein rdfs:seeAlso ?uniprot .                  # keyed on PROTEIN IRIs, BLAST top hit
        }
        GRAPH <http://marchantia.info/rdf/graph/MpTak_v7.1/annotation> {
          ?cds so:translates_to ?protein .
          ?transcript mpo:hasCds ?cds ;
                      so:transcribed_from ?gene .
        }
        GRAPH <http://marchantia.info/rdf/graph/MpTak_v7.1/function> {
          ?gene dcterms:identifier ?geneId .
          OPTIONAL { ?gene skos:prefLabel ?symbol }
        }
      }
      ORDER BY ?geneId
    result_count: 21

  - query_number: 3
    database: go
    description: >
      Gene-level route, step 1: expand 'photorespiration' (GO:0009853) over the authoritative GO
      on the `go` database - it has no descendants (1 term). MarpolBase's GO annotation is flat
      (no subClassOf closure), so the expansion must come from here.
    query: |
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
      PREFIX obo: <http://purl.obolibrary.org/obo/>
      PREFIX owl: <http://www.w3.org/2002/07/owl#>
      SELECT DISTINCT ?term ?label
      FROM <http://rdfportal.org/ontology/go>
      WHERE {
        ?term rdfs:subClassOf* obo:GO_0009853 ;
              rdfs:label ?label .
        FILTER(STRSTARTS(STR(?term), "http://purl.obolibrary.org/obo/GO_"))
        FILTER NOT EXISTS { ?term owl:deprecated true }
      }
    result_count: 1

  - query_number: 4
    database: marpolbase
    description: >
      Gene-level route, step 2: MarpolBase genes annotated to GO:0009853, with protein product
      names. 3 genes: Mp5g22480 (D-glycerate 3-kinase), Mp4g18090 (alanine transaminase) and
      Mp8g07420 (hypothetical protein, carrying the same aminotransferase GO terms). None of
      them is among the 21 genes of Query 2 - the two routes are disjoint.
    query: |
      PREFIX mpo: <http://marchantia.info/ontology/>
      PREFIX so: <http://purl.obolibrary.org/obo/so#>
      PREFIX obo: <http://purl.obolibrary.org/obo/>
      PREFIX dcterms: <http://purl.org/dc/terms/>
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
      PREFIX skos: <http://www.w3.org/2004/02/skos/core#>
      PREFIX faldo: <http://biohackathon.org/resource/faldo#>
      SELECT DISTINCT ?geneId ?productName ?uniprot
      WHERE {
        GRAPH <http://marchantia.info/rdf/graph/MpTak_v7.1/function> {
          ?gene mpo:hasGOTerm obo:GO_0009853 ;            # flat annotation: the term has no descendants
                dcterms:identifier ?geneId .
        }
        GRAPH <http://marchantia.info/rdf/graph/MpTak_v7.1/annotation> {
          ?transcript so:transcribed_from ?gene ; mpo:hasCds ?cds .
          ?cds so:translates_to ?protein .
          OPTIONAL { ?protein rdfs:label ?productName }
        }
        OPTIONAL { GRAPH <http://marchantia.info/rdf/graph/xref/uniprot> { ?protein rdfs:seeAlso ?uniprot } }
      }
      ORDER BY ?geneId
    result_count: 3

  - query_number: 5
    database: marpolbase
    description: >
      Genomic positions of all 24 genes (annotation graph, FALDO). Ten RuBisCO small-subunit
      genes, Mp4g05960-Mp4g06050, lie consecutively within 35.6 kb on chr4 (8,016,026-
      8,051,656), on mixed strands; six more are elsewhere on chr4, three form a tandem trio on
      chr7 (Mp7g08130-08150, within 6.8 kb). The glycolate oxidase is on chr1, the RbcL-like gene
      on chr3, and the GO-route genes on chr4, chr5 and chr8.
    query: |
      PREFIX mpo: <http://marchantia.info/ontology/>
      PREFIX so: <http://purl.obolibrary.org/obo/so#>
      PREFIX obo: <http://purl.obolibrary.org/obo/>
      PREFIX dcterms: <http://purl.org/dc/terms/>
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
      PREFIX skos: <http://www.w3.org/2004/02/skos/core#>
      PREFIX faldo: <http://biohackathon.org/resource/faldo#>
      SELECT ?geneId ?chr ?min ?max ?strand
      FROM <http://marchantia.info/rdf/graph/MpTak_v7.1/annotation>
      WHERE {
        VALUES ?geneId {
            "Mp1g01210" "Mp3g01300" "Mp4g05960" "Mp4g05970" "Mp4g05980" "Mp4g05990"
            "Mp4g06000" "Mp4g06010" "Mp4g06020" "Mp4g06030" "Mp4g06040" "Mp4g06050"
            "Mp4g09890" "Mp4g10830" "Mp4g10850" "Mp4g14420" "Mp4g15070" "Mp4g15080"
            "Mp4g18090" "Mp5g22480" "Mp7g08130" "Mp7g08140" "Mp7g08150" "Mp8g07420"
        }
        ?gene a obo:SO_0001217 ;
              dcterms:identifier ?geneId ;
              faldo:location ?region .
        ?region faldo:reference/dcterms:identifier ?chr ;
                mpo:minPosition ?min ;
                mpo:maxPosition ?max ;
                faldo:begin ?beginPos .
        BIND(IF(EXISTS { ?beginPos a faldo:ReverseStrandPosition }, "-", "+") AS ?strand)
      }
      ORDER BY ?chr ?min
    result_count: 24

  - query_number: 6
    database: marpolbase
    description: >
      Co-expression edges among the 24 genes (edges are stored once, with the two genes ordered by
      ID; binding both ends from the same VALUES set captures every edge exactly once). 93
      edges: 80 within the 21 protein-route genes, 1 within the 3 GO-route genes, 12 across the
      two sets. The chr4 cluster is co-expressed in 44 of its 45 possible pairs, 24 of them with
      mutual rank <= 10. Seven of the 21 have no edge to any other gene in the set: the named
      MpRBCS (Mp4g09890), Mp4g10830, Mp4g14420, the chr7 trio and the RbcL-like Mp3g01300. The
      glycolate oxidase links to six small-subunit genes (best rank 8) and to the Mp4g18090
      aminotransferase; the glycerate kinase Mp5g22480 links to eight cluster genes.
    query: |
      PREFIX mpo: <http://marchantia.info/ontology/>
      PREFIX so: <http://purl.obolibrary.org/obo/so#>
      PREFIX obo: <http://purl.obolibrary.org/obo/>
      PREFIX dcterms: <http://purl.org/dc/terms/>
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
      PREFIX skos: <http://www.w3.org/2004/02/skos/core#>
      PREFIX faldo: <http://biohackathon.org/resource/faldo#>
      SELECT ?geneA ?geneB ?pcc ?hrr
      FROM <http://marchantia.info/rdf/graph/MpTak_v7.1/function>
      WHERE {
        VALUES ?geneA {
            "Mp1g01210" "Mp3g01300" "Mp4g05960" "Mp4g05970" "Mp4g05980" "Mp4g05990"
            "Mp4g06000" "Mp4g06010" "Mp4g06020" "Mp4g06030" "Mp4g06040" "Mp4g06050"
            "Mp4g09890" "Mp4g10830" "Mp4g10850" "Mp4g14420" "Mp4g15070" "Mp4g15080"
            "Mp4g18090" "Mp5g22480" "Mp7g08130" "Mp7g08140" "Mp7g08150" "Mp8g07420"
        }
        VALUES ?geneB {
            "Mp1g01210" "Mp3g01300" "Mp4g05960" "Mp4g05970" "Mp4g05980" "Mp4g05990"
            "Mp4g06000" "Mp4g06010" "Mp4g06020" "Mp4g06030" "Mp4g06040" "Mp4g06050"
            "Mp4g09890" "Mp4g10830" "Mp4g10850" "Mp4g14420" "Mp4g15070" "Mp4g15080"
            "Mp4g18090" "Mp5g22480" "Mp7g08130" "Mp7g08140" "Mp7g08150" "Mp8g07420"
        }
        ?a dcterms:identifier ?geneA .
        ?b dcterms:identifier ?geneB .
        ?edge mpo:gene1 ?a ; mpo:gene2 ?b ;              # each edge stored once; both VALUES cover both orders
              mpo:pcc ?pcc ; mpo:hrr ?hrr .
      }
      ORDER BY ?geneA ?geneB
    result_count: 93

rdf_triples: |
  @prefix up: <http://purl.uniprot.org/core/> .
  @prefix uniprot: <http://purl.uniprot.org/uniprot/> .
  @prefix mpo: <http://marchantia.info/ontology/> .
  @prefix obo: <http://purl.obolibrary.org/obo/> .
  @prefix rdfs: <http://www.w3.org/2000/01/rdf-schema#> .
  @prefix dcterms: <http://purl.org/dc/terms/> .

  uniprot:A0A2R6WBM0 up:classifiedWith <http://purl.uniprot.org/keywords/601> ; up:organism <http://purl.uniprot.org/taxonomy/3197> .
  # Database: uniprot | Query: 1 | Comment: a RuBisCO small-subunit entry carrying the photorespiration keyword (automatic annotation)
  ?protein rdfs:seeAlso uniprot:A0A2R6WBM0 .
  # Database: marpolbase | Query: 2 | Comment: best hit of three cluster genes (Mp4g05970, Mp4g06020, Mp4g06040)
  ?gene dcterms:identifier "Mp5g22480" ; mpo:hasGOTerm obo:GO_0009853 .
  # Database: marpolbase | Query: 4 | Comment: D-glycerate 3-kinase - on the GO route only, absent from the keyword route
  obo:GO_0009853 rdfs:label "photorespiration" .
  # Database: go | Query: 3 | Comment: no descendant terms exist, so the GO route is this single term
  ?edge mpo:gene1 ?mp4g05960 ; mpo:gene2 ?mp4g05980 ; mpo:hrr "1" .
  # Database: marpolbase | Query: 6 | Comment: the two cluster genes are each other's top co-expression partner

exact_answer: ""

ideal_answer: |
  The two annotation routes pick out entirely different photorespiration genes in Marchantia polymorpha. Protein-level keyword annotation marks 37 protein entries, only one of them reviewed (the plastid-encoded RuBisCO large chain), and these map by best BLAST hit onto 21 nuclear genes: 19 RuBisCO small-subunit-family genes, one glycolate oxidase (Mp1g01210) and one nuclear gene whose closest match is a RuBisCO large chain (Mp3g01300). The keyword is thus mostly inherited by RuBisCO, which initiates photorespiration through its oxygenase reaction, rather than by the enzymes of the recycling pathway. Gene-level GO annotation to photorespiration, a term with no descendants, instead yields just three genes, and none of them overlaps the first set: a D-glycerate 3-kinase (Mp5g22480) and two aminotransferases annotated as alanine/glyoxylate transaminases (Mp4g18090 and the uncharacterized Mp8g07420), which are the classical recycling steps of the cycle. Genomically, the small-subunit genes are strongly clustered: ten of them lie consecutively within about 36 kb on chromosome 4 (Mp4g05960-Mp4g06050, on both strands), six more are elsewhere on chromosome 4, and three form a tandem trio on chromosome 7. The cluster behaves as a co-expression unit, with 44 of its 45 possible pairs co-expressed and 24 of them in each other's top ten partners. The glycolate oxidase co-expresses with six small-subunit genes, and the glycerate kinase with eight cluster members, so the two routes are linked by co-expression (12 cross edges) even though they share no gene. Seven of the 21 keyword-route genes have no co-expression partner in either set, including the only named small-subunit gene, MpRBCS (Mp4g09890), the chromosome-7 trio and the RuBisCO-large-chain-like nuclear gene.

