# Waivers for scripts/check_mie_leakage.py (MIE_v3_spec.md §4.6).
#
# A waiver says: this match is real text but NOT the subject the question scores on.
# Waive generic domain vocabulary only. A genuine leak (the question's gold entity, its exact
# keyword phrase used as an example's vehicle) is fixed in the MIE by swapping the subject,
# never waived here.
#
# One entry covers every example of `database` that matches `token` for `question`.
# A waiver that stops matching fails the checker — delete it rather than keep it "just in case".

# Subjects §4.6 names as always fine: canonical, non-benchmark vehicles.
canonical:
  - ATP
  - TP53
  - BRCA1

waivers:
  - question: question_005
    database: chembl
    token: Kinase
    reason: "class_enum lists 'kinase' as one family its protein-classification route generalises to; q005 scores on a kinase GROUP (TK), which no example names."

  - question: question_035
    database: pdb
    token: X-RAY DIFFRACTION
    reason: "The controlled method vocabulary every PDB method query must use; the question text itself names all three options. method_enum's counts are PDB-wide, while q035 scores on reviewed human serine proteases."

  - question: question_044
    database: glycosmos
    token: Lectin
    reason: "Class name (sb:Lectin). lectin_grounding's vehicle is concanavalin A; q044 scores on human siglec glycosites."

  - question: question_050
    database: amrportal
    token: Antibiotic
    reason: "Core AMR vocabulary (every phenotype is per antibiotic); q050 scores on a specific organism, which no example names."

  - question: question_077
    database: ensembl
    token: Chromosome
    reason: "Generic coordinate vocabulary; q077 scores on a specific chromosome (7), which the matching examples do not select."

  - question: question_077
    database: mco
    token: Chromosome
    reason: "mco IS the mouse chromosome ontology — every example says 'chromosome'. q077's answer (a specific chromosome) is not an example vehicle."

  - question: question_099
    database: glycosmos
    token: Glycoprotein
    reason: "The name of GlyCosmos's own glycoprotein graph; q099 scores on an AML-linked gene count (24), which no example carries."
